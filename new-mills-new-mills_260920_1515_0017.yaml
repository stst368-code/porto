caption: |
  Global Metadata
  Basic Attributes: Melodic Death Metal / Extreme Heavy Metal, roughly 170–190 BPM, fast and aggressive but built around clearly shaped twin-guitar melody rather than breakdown-heavy metalcore. Global Emotional Progression: Rebuild the supplied song completely inside this style while preserving its narrative identity: an affectionate, overblown declaration that the small town of New Mills is the centre of the universe and the obvious place to conquer life. Let repeated sections evolve through arrangement, register and intensity. Application Scenarios & Imagery: a local high street presented with the glamour of a giant theatre marquee and the confidence of a world-capital anthem. Sonics & Production Profile: Tight live drums with sustained double-kick drive, distorted but articulate rhythm guitars, audible bass grind and bright harmonised lead-guitar lines. Production should be modern enough for detail without becoming sterile. Avoid pop-rock choruses, electronic drops and half-time breakdown dependence.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male), a rich baritone crooner with relaxed confidence, clean consonants and theatrical timing. Vocal Style: Use forceful harsh vocals with clear rhythmic attack. Verses lock tightly to riffs; choruses can stretch into longer growls or rasps while melodic identity is carried primarily by guitars. Harmony/Backing Vocals: Use occasional low group shouts or a second harsh layer at peaks; no glossy clean choir unless the supplied character roles require contrast. Role Continuity: Keep the principal male singer recognisable across all genre changes; ensembles may enlarge the hook without turning the song into anonymous group vocals. Vocal FX: Compact room, saturation and firm compression; keep consonants and attack clear.
  Arrangement
  Section Timeline: [verse] → [verse] → [chorus] → [verse] → [chorus] → [verse] → [verse] → [instrumental] → [chorus]. Instrument Lifecycle: Twin guitars establish a recurring harmonised motif over bass and double-kick drums. Verses alternate tight rhythm figures with melodic runs; choruses simplify the chord foundation so lead harmonies can become memorable. Section Directives: [intro]: Open with the central harmonised guitar motif and immediate drum urgency. [verse]: Drive with tightly articulated riffing and sustained double-kick, leaving small gaps around vocal attacks. [chorus]: Broaden into a memorable twin-guitar line over a simpler crushing rhythm foundation. [bridge]: Change riff contour and harmonic colour but keep momentum; avoid a lazy half-time breakdown. [outro]: Accelerate or intensify the main motif and end with a decisive final hit. Groove & Foundation Progression: All transitions must remain native to the stated genre. Preserve recognisable motifs across repeated sections while changing density, register, voicing or articulation. Keep the target genre dominant throughout.
