name: Build GBR Sonic Landscape

on:
  workflow_dispatch:

jobs:
  build-landscape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh existing GBR source data
        working-directory: good-boy-records
        run: |
          if [ -f tools/import_showcase.py ]; then python tools/import_showcase.py; fi
      - name: Build genre catalogue
        working-directory: good-boy-records
        run: |
          python tools/build_genre_catalogue.py showcase-manifest.json templates/music_genre_taxonomy.csv _site/catalogue.json
      - name: Verify landscape
        working-directory: good-boy-records
        run: |
          test -f _site/landscape.html
          test -f _site/catalogue.json
          python -m json.tool _site/catalogue.json >/dev/null
