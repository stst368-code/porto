caption: |
  Global Metadata
  Basic Attributes: bpm is 122. key is F#, and scale is minor. City Pop / Funk-Pop.
  Global Emotional Progression: The track opens with a dreamy, atmospheric introduction that quickly establishes a groovy and confident momentum. The verses maintain a cool, rhythmic restraint, allowing the bassline to drive the narrative, while the pre-chorus builds anticipation through rising melodic tension.
  Application Scenarios & Imagery: Ideal for late-night city drives under neon lights, retro-themed dance floors, or scenes depicting urban exploration and youthful romance.
  Sonics & Production Profile: The production features a wide, polished soundstage with a distinct separation between the punchy low-end and the shimmering highs.

  Vocal Details
  Vocal Gender & Timbre: Singer A (Female), a silky, confident lead for Doja; Singer B (Male), a warm, enthusiastic character voice for Bam Bam; short ensemble responses may support them. Preserve the contrast between the two roles.
  Vocal Style: The performance begins with a smooth, melodic delivery in the verses, utilizing subtle rhythmic phrasing to lock in with the funk groove.
  Harmony/Backing Vocals: Rich, multi-layered harmonies appear prominently in the choruses, often employing third and fifth intervals to thicken the melodic texture.
  Vocal FX: The lead vocal is treated with a tasteful amount of plate reverb and a subtle delay, creating a sense of space and depth.

  Arrangement
  Instrument Lifecycle (Primary/Secondary): Primary: A funky, melodic electric bass guitar serves as the core harmonic and rhythmic driver, present from the very first bar and maintaining a consistent, syncopated pattern throughout the entire track. Clean, rhythmic electric guitar chords provide the characteristic "chicka-chicka" funk texture, entering immediately and persisting through the verses and choruses. Secondary: A warm electric piano adds harmonic color in the verses, often playing extended chords that enrich the progression.
  Groove & Foundation Progression: The rhythm foundation is built on a tight, four-on-the-floor drum pattern with a crisp snare on beats 2 and 4. The verses feature a stripped-back groove with a focus on the kick and hi-hat interplay.
  Embellishments, Textures & Spatial FX: Subtle riser effects and white noise sweeps are used to transition between sections, particularly leading into the choruses.
  Section Continuity: Follow the lyric macro structure in order ([intro] → [verse] → [pre-chorus] → [chorus] → [solo] → [verse] → [chorus] → [bridge] → [chorus] → [outro]). Keep the target genre active in every sung section; use changes in density, register, articulation and groove for contrast rather than switching to a different style.
