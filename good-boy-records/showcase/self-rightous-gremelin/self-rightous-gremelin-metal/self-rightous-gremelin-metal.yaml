caption: |
  Global Metadata
  Basic Attributes: Brutal Death Metal / Technical Death Metal, roughly 200–230 BPM, dense, low-tuned and rhythmically intricate with relentless double-kick and sharply articulated riff changes. Global Emotional Progression: Rebuild the supplied song completely inside this style while preserving its narrative identity: a frantic self-justifying argument with Mother that swings between accusation, panic, theatrical grievance and explosive pleading. Let repeated sections evolve through arrangement, register and intensity. Application Scenarios & Imagery: a domestic argument inflated into a surreal stage confrontation where every tiny injustice feels apocalyptic. Sonics & Production Profile: Huge low-tuned guitars, grinding bass, precise kick attack, violent snare, blast beats and controlled cymbal detail. Keep the mix heavy but intelligible enough for complex riffs. Avoid metalcore uplift, pop-rock hooks, orchestral sweetening and electronic effects.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male), a flexible baritone-tenor capable of clipped rhythmic attack, sudden high intensity and abrupt returns to intimate phrasing. Vocal Style: Use a deep guttural lead with rapid, rhythm-locked phrasing and occasional higher bark or shriek accents. Choruses may sustain longer roars over simpler motifs. Harmony/Backing Vocals: Layer a second extreme voice or low group shout only on selected chorus accents; no clean singing unless a supplied character role absolutely requires a contrasting line. Role Continuity: Keep one recognisable male lead through the violent mood changes; group responses should appear only at major confrontations. Vocal FX: Dense compression, short dark room and restrained saturation; keep the vocal physically close to the riff attack.
  Arrangement
  Section Timeline: [intro] → [verse] → [chorus] → [verse] → [chorus] → [bridge] → [chorus]. Instrument Lifecycle: Low-tuned rhythm guitar and double-kick drums dominate. Bass follows or counters complex riff cells. Choruses simplify just enough to create a memorable crushing motif before technical motion returns. Section Directives: [intro]: Enter with a short feedback or drum count and immediately establish a low technical riff. [verse]: Use rapid syncopation, stop-start accents and continuous double-kick beneath tightly phrased vocals. [chorus]: Lock into a simpler but enormous crushing motif with longer vocal roars. [bridge]: Create contrast through odd accent placement and lower-register riff mass, not a generic metalcore breakdown. Groove & Foundation Progression: All transitions must remain native to the stated genre. Preserve recognisable motifs across repeated sections while changing density, register, voicing or articulation. Keep the target genre dominant throughout.
