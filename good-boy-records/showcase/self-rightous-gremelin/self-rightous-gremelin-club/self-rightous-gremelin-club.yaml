caption: |-
  Global Metadata
  Basic Attributes: French House / Filter Disco, roughly 122–128 BPM, tightly looped, physical and hypnotic with sample-like chord stabs and an unwavering club pulse. Global Emotional Progression: Present a frantic self-justifying argument with Mother that swings between accusation, panic, theatrical grievance and explosive pleading as a groove-led dance-floor narrative. Establish the bass-and-drum pulse immediately, keep verses lean enough for the words to remain intelligible, and use pre-choruses to create unmistakable harmonic and rhythmic lift. Choruses should open into wider harmony, stronger bass movement and more communal vocal energy while preserving the same central hook. Any bridge or instrumental section should thin to the essential groove before rebuilding. The final chorus reaches maximum density without changing genre or turning into a festival-style drop. Application Scenarios & Imagery: a domestic argument inflated into a surreal stage confrontation where every tiny injustice feels apocalyptic. Sonics & Production Profile: Solid four-on-the-floor kick, rubbery bass, filtered disco-chord loop, bright open hi-hats, compressed drum bus and sweeping low-pass/high-pass movement. The mix should pump rhythmically and feel tactile. Avoid trance leads, festival EDM drops and unrelated cinematic layers.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male), a flexible baritone-tenor capable of clipped rhythmic attack, sudden high intensity and abrupt returns to intimate phrasing. Vocal Style: Keep vocals rhythmically precise and comparatively dry. Verses may be more clipped and loop-aware; hooks should become memorable through repetition and doubling rather than huge melodic ornament. Harmony/Backing Vocals: Use short doubles, filtered backing fragments and selective stacked phrases in choruses; do not bury the lead in a choir. Role Continuity: Keep one recognisable male lead through the violent mood changes; group responses should appear only at major confrontations. Vocal FX: Firm compression, subtle saturation and tempo-synced delay; occasional filter or telephone treatment can mark transitions, but intelligibility remains primary.
  Arrangement
  Section Timeline: [intro] to [verse] to [chorus] to [post-chorus] to [verse] to [chorus] to [post-chorus] to [bridge] to [instrumental] to [chorus] to [post-chorus]. Instrument Lifecycle: A filtered chord loop, kick, bass and hi-hat are the permanent engine. Arrangement evolution comes from opening filters, muting layers, changing sample register and adding short percussion accents rather than introducing many new instruments. Section Directives: [intro]: Begin with the chord loop heavily filtered, then introduce kick and bass in stages before the vocal settles. [verse]: Hold a constrained loop with strong negative space and small filter motion under the vocal. [chorus]: Fully open the chord loop, widen the vocal doubles and let the pumping mix reach maximum brightness. [bridge]: Drop the kick or heavily low-pass the entire mix to create a vacuum, then rebuild mechanically. Groove & Foundation Progression:
