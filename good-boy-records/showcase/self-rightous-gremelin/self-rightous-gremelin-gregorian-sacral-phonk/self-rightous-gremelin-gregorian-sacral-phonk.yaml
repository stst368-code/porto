story:
caption: |
  Global Metadata
  Basic Attributes: 58–72 BPM. Desert noir ballad / slow torch-song rock / sparse tremolo guitar ballad. Rebuild self-rightous-gremelin as a dark, hypnotic slow-burn with enormous negative space. The arrangement should revolve around a clean electric guitar with deep tremolo and long bends, a restrained bass line, minimal drums and a close, exposed lead vocal. Source identity to preserve: Genre early 2000s nu-metal, alternative metal, Armenian-influenced metal, abrupt rhythmic stops, erratic tempo changes, unusual rhythmic accents, and progressive song structure. Approximately 130 BPM. G minor target key, in 4/4 timing. Dramatic quiet-loud dynamics, melodic melancholic bridge, and enormous aggressive chorus.
  Global Emotional Progression: Begin almost motionless, with a single suspended guitar figure and exposed voice. Verses should remain intimate and restrained, letting silence become part of the groove. Pre-choruses increase tension through bass movement, cymbal swells and slightly wider guitar harmony rather than increased loudness. Choruses should feel emotionally larger but still sparse: longer vocal notes, wider tremolo guitar, deeper bass and a restrained snare pulse. Bridges should become even emptier before the final return. If the lyric is comic, play the music absolutely straight so the seriousness makes the words funnier; if the lyric is dark, let the restraint make it more unsettling.
  Application Scenarios & Imagery: Empty desert highway after midnight, dim motel neon, heat haze, black sky, a slow dance in an almost-empty room.
  Sonics & Production Profile: Warm vintage guitar amp, deep spring or plate ambience, narrow-to-moderate stereo image, soft transients, natural dynamics and a dark low-mid body. Avoid glossy pop production, bright acoustic strumming, arena drums, synth pads, orchestral swells and busy fills.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male), preserving the source character and register while adapting the delivery to this arrangement.
  Vocal Style: Low, intimate and patient. Use breath, pauses and sustained endings rather than dense melodic runs. Verses should feel almost confessional; choruses can rise into a fuller chest register without becoming a power ballad. Preserve dry spoken or character lines where present.
  Harmony/Backing Vocals: Very sparse. Use an occasional low octave, distant harmony or ghostlike sustained backing note only at emotional peaks.
  Vocal FX: Close dry vocal with short plate plus a faint longer tail; occasional slapback only on selected phrase endings.
  Arrangement
  Instrument Lifecycle: [intro] starts with lone tremolo electric guitar and perhaps a low bass entrance near the end. [verse] adds restrained bass and minimal kick/snare or brushed kit. [pre-chorus] introduces a second guitar voice or subtle cymbal swell. [chorus] widens the guitar, lets bass sustain longer and adds slightly stronger snare while retaining large gaps. [post-chorus] recedes immediately. [bridge] strips toward voice and guitar. [solo] if present should be slow, lyrical and bend-heavy rather than technical. [outro] lets the core guitar motif decay into room ambience.
  Groove & Foundation Progression: Slow 4/4 or loose 6/8 feel, with no busy percussion. Keep the pulse implied and heavy.
  Embellishments, Textures & Spatial FX: Tremolo, long guitar bends, muted string noise, amp hum and long reverb decay. Every effect must reinforce emptiness and tension.
