caption: |
  Global Metadata
  Basic Attributes: bpm is approximately 225–245. key is C, and scale is minor. Raw Norwegian second-wave black metal, primitive black metal, chaotic extreme metal and dissonant atmospheric black metal. The music must sound unmistakably like hostile early-1990s Scandinavian black metal rather than death metal, metalcore or modern extreme-metal production.
  Global Emotional Progression: Begin in immediate instability, with screaming guitar feedback and a thin, malignant tremolo figure emerging from noise before the entire band erupts into relentless blast beats. The verses should feel manic and barely contained, constantly driving forward with rapidly changing tremolo patterns and ugly chromatic movement. Pre-choruses become more ritualistic and threatening, briefly simplifying the harmony before the choruses explode into the fastest and widest sections of the song. The bridge suddenly becomes slower, spacious and ominous rather than a conventional breakdown, creating a stalking sense of dread before the solo and final chorus return at maximum violence. The outro should collapse into sustained distortion, cymbal wash and one final tortured vocal.
  Application Scenarios & Imagery: A freezing forest at midnight, ruined stone walls, distant firelight, violent winter wind and something feral moving unseen between the trees.
  Sonics & Production Profile: Cold, abrasive and deliberately hostile. Thin but vicious distorted guitars dominate the upper mids, drums are dry and frantic, bass is audible but dirty rather than sub-heavy. Preserve raw edges, amplifier hiss, pick attack and cymbal chaos. Avoid polished modern metal production, huge sub-bass, djent, deathcore breakdowns, trigger-perfect drums and glossy mastering.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male). Extremely harsh, high-register rasped black-metal shrieks with a tortured, feral and unstable timbre.
  Vocal Style: Verses use frantic snarled phrasing with words spat rapidly over the blast beats. Pre-choruses become more deliberate and accusatory. Choruses use sustained screaming, cracked upper-register shrieks and desperate repeated phrases. Occasional lower rasped voices may reinforce individual accents, but deep death-metal gutturals must never become the primary vocal style.
  Harmony/Backing Vocals: Sparse doubled screams and distant ghostlike shrieks appear during choruses and the final climax. Avoid conventional harmonies.
  Vocal FX: Rough room reverb, occasional long cavernous tails and restrained saturation. Vocals should feel embedded inside the chaos rather than cleanly isolated above it.
  Arrangement
  Instrument Lifecycle: Two heavily distorted electric guitars dominate throughout. Guitar A maintains rapid tremolo-picked melodic and chromatic figures while Guitar B supplies dissonant counter-lines, unstable chord shapes and occasional open-string drones. Dirty electric bass follows the harmonic movement without becoming excessively low or modern. A frantic acoustic-style extreme-metal drum kit provides blasts, double-kick bursts, primitive fills and constant cymbal violence.
  Groove & Foundation Progression: The intro grows from feedback into tremolo picking before detonating into blasts. Verses alternate full-speed blasting with brief charging d-beat passages. Pre-choruses briefly reduce rhythmic density while retaining tremolo guitars. Choruses immediately return to maximum-speed blasts with broader, more memorable descending guitar motifs. The bridge drops into a slow, ritualistic pulse with ringing dissonant chords and enormous empty spaces between drum hits, never becoming a groove-metal breakdown. The solo is chaotic, atonal and screaming rather than technically polished. The final chorus accelerates back into complete instrumental saturation. The outro disintegrates through unresolved tremolo guitar, feedback, cymbal wash and amplifier noise.
