caption: |
  Global Metadata
  Basic Attributes: bpm is 140. key is D, and scale is minor. Epic Cinematic Baroque / Gothic Neo-Classical / Dramatic Oratorio. The composition combines relentless Baroque counterpoint with the overwhelming scale of a modern cinematic orchestra, remaining recognisably classical rather than drifting into trailer-rock or symphonic metal.
  Global Emotional Progression: Begin in oppressive nocturnal stillness, with restless motion already simmering beneath the surface. The verses should feel introspective and increasingly desperate, as though private insomnia is becoming a grand existential tragedy. Pre-choruses tighten rhythmically and harmonically, withholding release before each chorus erupts into enormous sacred-oratorio grandeur. The bridge becomes briefly intimate and watchful before an instrumental solo drives the music toward its largest final climax. The ending should collapse suddenly from overwhelming scale into haunting solitude, resolving unexpectedly into D major.
  Application Scenarios & Imagery: A moonlit Gothic manor at the height of summer, enormous windows overlooking an empty landscape, one sleepless golden retriever staring into darkness while imagining his missing ball as a sacred object of salvation.
  Sonics & Production Profile: Large concert-hall acoustics, natural orchestral dynamics, wide stereo strings and choir, powerful but realistic timpani and brass, crisp harpsichord articulation, and substantial depth between close solo instruments and distant ensemble layers. Avoid modern drums, distorted guitars, synthesizer bass, EDM percussion, and contemporary trailer braams.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Female), a dramatic operatic soprano with a commanding upper register, rich classical resonance, precise diction and broad controlled vibrato.
  Vocal Style: Verses use restrained operatic storytelling with long legato lines and occasional sharply articulated Baroque passages. Pre-choruses become increasingly urgent. Choruses expand into full dramatic projection with sustained high notes, rapid ornamental runs and emphatic repeated phrases. The final chorus should reach near-cadenza intensity without becoming pop belting.
  Harmony/Backing Vocals: A large SATB classical choir enters sparingly in the first pre-chorus, then becomes fully polyphonic during choruses. Sopranos and tenors answer the lead in counterpoint while altos and basses provide dense sustained harmonic foundations. The final chorus uses antiphonal exchanges between lead soprano and full choir.
  Vocal FX: Natural concert-hall reverberation only. Preserve intelligibility and classical vocal realism.
  Arrangement
  Instrument Lifecycle: The intro begins with rapid solo harpsichord arpeggiation in D minor, answered by a sharp solo violin motif. The first verse adds low cello ostinato and double bass, with viola figures gradually filling the middle register. The pre-chorus introduces tremolo strings, restrained timpani rolls and distant choir tones while the harpsichord becomes increasingly aggressive.
  The first chorus releases the full orchestra: racing violin counterpoint, sweeping violas and cellos, French horns, trumpets, trombones, timpani and SATB choir, while the harpsichord continues beneath the mass rather than disappearing. The second verse strips brass and choir away but retains faster string movement, making the return feel more restless than the opening.
  The second chorus increases contrapuntal density and brass weight. The bridge abruptly contracts to harpsichord, solo cello, quiet basses and exposed soprano, creating the impression of listening into an enormous dark room. The solo then becomes a virtuosic violin-and-harpsichord duel, gradually joined by sequential string entries and accelerating orchestral imitation.
  The final chorus arrives at maximum scale with full choir, brass, timpani, rapid strings and overlapping Baroque counterpoint. After the final vocal peak, everything cuts away except solo violin and soprano. The soprano sustains the last note while the violin resolves the harmony through a tierce de Picardie, leaving a quiet final D major chord.
