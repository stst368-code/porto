caption: |
  Global Metadata
  Basic Attributes: roughly 68–82 BPM. Minimal Contemporary Piano Singer-Songwriter / Intimate Piano Ballad. Exactly two musical elements for the entire song: one female lead voice and one acoustic piano. No backing vocals, choir, strings, bass, drums, percussion, pads, synths, guitar, sound design or additional instruments at any point. All emotional growth must come from vocal intensity, piano register, voicing density, rhythm, dynamics and silence.
  Global Emotional Progression: Begin tired, private and uncertain, as though the singer is replaying events after everyone else has gone home. The first chorus should still carry genuine longing. The betrayal reveal changes the colour of the performance from sadness to disbelief and then resolve. The final chorus must sound like the same person finally choosing herself, without becoming a theatrical power ballad. End quietly, with distance rather than victory.
  Application Scenarios & Imagery: alone at an old upright or grand piano after midnight, cold coffee nearby, car keys on the lid and streetlight coming through blinds.
  Sonics & Production Profile: close natural piano with audible pedal, hammer and room detail. Preserve wide dynamics and vocal breaths. Warm midrange, minimal compression and no glossy pop polish.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Female), intimate mezzo-soprano with a breathy lower register, slightly rough chest tone and controlled emotionally strained upper notes.
  Vocal Style: Early verses are nearly conversational. Pre-choruses gain urgency through articulation rather than sudden loudness. Choruses use fuller chest voice and sustained melodic phrases. After the betrayal reveal, allow occasional cracks and harder consonants. The final chorus is the strongest performance but remains believable and close.
  Harmony/Backing Vocals: none; one singer only.
  Vocal FX: subtle natural room ambience and minimal transparent compression; no delay, doubling or synthetic widening.
  Arrangement
  [intro] Isolated upper-register notes and soft broken chords with deliberate silence.
  [verse] Sparse right hand, restrained low notes and large gaps around vocal phrases.
  [pre-chorus] More continuous left-hand motion and gradually widening voicings.
  [chorus] Fuller two-handed chords and broader register, still one piano only.
  [post-chorus] Repetitive unsettled figure that circles the harmony beneath a quieter vocal.
  [bridge] Reduce to isolated notes and near-silence, then rebuild carefully.
  [verse] Return with slightly denser inner movement and darker voicings after the betrayal reveal.
  [pre-chorus] Increase velocity and bass-register weight.
  [chorus] Stronger attacks and wider chords, never adding layers beyond piano and voice.
  [verse] Pull back again but retain restless inner motion.
  [bridge] Begin almost empty, then build through increasingly active arpeggios.
  [pre-chorus] Strong low octaves and rising register create the final lift.
  [chorus] Maximum piano range and vocal intensity, emotionally resolved rather than bombastic.
  [outro] Simplify back to the opening figure and let one final unresolved chord decay naturally.
