caption: |-
  Global Metadata
  Basic Attributes: approximately 68–82 BPM. Minimal Piano Singer-Songwriter / Contemporary Piano Ballad. Female vocal and acoustic piano only for the entire song. No strings, no bass, no drums, no percussion, no pads, no guitar, no background instrumentation and no cinematic orchestral build. The emotional scale must come entirely from the singer and the changing intensity of the piano performance.
  Global Emotional Progression: Begin fragile, tired and almost conversational. The first verse should sound like someone replaying events alone after the argument has already ended. Pre-choruses introduce tension through more insistent piano movement. Choruses swell emotionally, but remain intimate rather than becoming theatrical power ballads. Post-choruses carry a bitter, restless edge. As the song progresses, sadness should slowly become certainty. The bridges expose the deepest vulnerability, then the final chorus changes the emotional perspective from wanting an answer to no longer needing one. The outro should be quiet, exhausted and resolved.
  Application Scenarios & Imagery: sitting alone at an upright piano in a dark room after midnight, car keys and cold coffee on top of the instrument, streetlight coming through the blinds and nobody left to argue with.
  Sonics & Production Profile: extremely intimate natural recording. Warm acoustic piano with audible pedal movement, key action and room resonance. The vocal should sit very close to the listener with preserved breaths and small imperfections. Wide dynamic range, minimal compression and no glossy pop production.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Female), intimate mezzo-soprano with a soft breathy lower register, slightly rough chest voice and the ability to rise into emotionally strained but controlled high notes.
  Vocal Style: The intro and early verse should feel almost spoken in places, with restrained pitch movement and audible breath. Pre-choruses increase urgency without becoming loud immediately. Choruses allow fuller chest voice and longer sustained notes. Post-choruses should sound bitter and conversational. Bridges pull back again into exposed near-whispers before the final emotional expansion. The last chorus should be the strongest vocal performance but remain believable rather than polished into perfection.
  Harmony/Backing Vocals: none. One lead vocalist only throughout.
  Vocal FX: very light natural room reverb and minimal compression. No obvious delay, doubling or synthetic effects.
  Arrangement
  Instrument Lifecycle (Primary/Secondary): Piano begins alone with a repeating broken-chord motif before the vocal enters. During the first verse, keep the right hand sparse and leave deliberate gaps around the vocal phrases. The pre-chorus introduces stronger left-hand movement and slightly tighter rhythmic playing.
  The chorus expands through wider piano voicings, heavier low-register notes and more continuous movement while remaining strictly one piano. The post-chorus becomes more rhythmically unsettled, with short repeated figures answering the vocal.
  The second verse retains slightly fuller harmony than the first. Each subsequent pre-chorus should use increased register and velocity rather than additional instrumentation.
  At the first bridge, dramatically reduce the piano to isolated notes and soft chords, allowing silence to become part of the arrangement. Rebuild gradually through increasingly active arpeggios.
  The later bridge should reach the piano's most agitated playing before suddenly reducing to near silence immediately before the final chorus.
  The final chorus uses the widest register and strongest dynamics of the entire performance. For the outro, progressively simplify the piano until only the original opening motif remains. End with the final vocal line followed by one unresolved-feeling piano chord allowed to decay naturally.
