caption: |
  Global Metadata
  Basic Attributes: Epic A Cappella Choral / Contemporary Sacred Vocal Ensemble, with a broad 72–88 BPM perceived pulse. The entire piece must be made from sung human voices only. Absolutely no instruments, drums, percussion, claps, stomps, snaps, beatboxing, mouth percussion, synths, piano, strings, brass, organ, impacts or non-vocal sound effects. Rhythm, bass weight, harmony and transitions must all come from pitched or syllabically sung voices.
  Global Emotional Progression: Begin intimate and almost devotional, as though the lead is confessing something privately. Gradually surround her with judgemental harmony. Early choruses should feel yearning and enormous; after the betrayal reveal, the choir becomes darker and less comforting. The final chorus should transform the same melodic material into a decisive act of separation. End with distance and release rather than triumphal bombast.
  Application Scenarios & Imagery: one woman standing alone beneath a vast cathedral dome while hidden choirs gradually appear in galleries around her, then recede as she walks away.
  Sonics & Production Profile: realistic cathedral acoustics, long natural decay and large front-to-back depth. Low basses provide weight; sopranos provide height. No synthetic enhancement that resembles instrumentation.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Female), clear dramatic mezzo-soprano with intimate low notes, controlled chest power and an emotionally exposed upper register. Supporting ensemble is a large SATB choir.
  Vocal Style: Verses remain close and text-led. Pre-choruses widen and intensify through sustained phrasing. Choruses allow the lead to soar over the ensemble. Post-chorus lines are rhythmically articulated but still sung. Later sections become firmer and less vulnerable.
  Harmony/Backing Vocals: closed-mouth humming, bass drones, open fifths, suspensions, minor clusters, antiphonal responses and full multi-register chords. No percussive vocal imitation.
  Vocal FX: natural hall reverberation only.
  Arrangement
  [intro] Solo lead with distant low humming.
  [verse] Add bass and baritone drones under selected phrases; keep upper choir sparse.
  [pre-chorus] Altos and tenors enter with rising suspensions and closer dissonance.
  [chorus] Full SATB choir blooms around the lead with deep bass foundations and high soprano extensions.
  [post-chorus] Use short sung antiphonal responses between choir sections; no clapping or rhythmic body sounds.
  [bridge] Collapse to lead plus one sustained distant chord, then rebuild register by register.
  [verse] Keep a restrained low choir bed beneath the lead; harmony is darker than before.
  [pre-chorus] Thicken suspensions and widen the ensemble.
  [chorus] Return at greater scale with divided choir parts and stronger low-register weight.
  [verse] Pull back to intimate lead with soft humming behind it.
  [bridge] Use slowly shifting clusters and quiet syllabic responses, never percussion.
  [pre-chorus] Reassemble the full choir gradually.
  [chorus] Maximum choral climax, wide divided SATB harmony, lead clearly above the mass.
  [outro] Remove upper sections first, leaving low humming and solo voice to decay naturally.
