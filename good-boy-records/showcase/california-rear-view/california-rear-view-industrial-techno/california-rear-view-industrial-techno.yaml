caption: |
  Global Metadata
  Basic Attributes: bpm is 146. key is Eb, and scale is major. Industrial Techno / Cinematic Electronic.
  Global Emotional Progression: The piece opens with a foreboding, narrative-driven tension that feels cinematic and ominous. This atmosphere abruptly shatters into a high-energy, aggressive assault characterized by relentless rhythmic drive and distorted textures.
  Application Scenarios & Imagery: Ideal for dark fantasy video game trailers, cyberpunk action sequences, or immersive audio experiences depicting dystopian warfare and ancient magical breaches.
  Sonics & Production Profile: The soundstage is expansive yet heavily focused on the center channel for maximum impact, featuring a "wall of sound" aesthetic.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Female), an intimate mezzo-soprano with a soft lower register, clear diction and enough chest resonance for emotionally stronger refrains.
  Vocal Style: The delivery is strictly spoken-word, utilizing a slow, deliberate cadence with dramatic pauses to emphasize gravity. The performance remains consistent in its narrative tone throughout the intro but is treated with increasing spatial depth as the track progresses.
  Harmony/Backing Vocals: No harmonic or backing vocals are present; the vocal line stands alone as a solitary narrative element.
  Vocal FX: The voice is processed with a long-tail hall reverb and subtle delay to create a cavernous, epic atmosphere.
  Arrangement
  Instrument Lifecycle (Primary/Secondary): Primary: A massive, distorted saw-wave synthesizer bass serves as the core melodic and rhythmic driver, entering forcefully after the spoken intro and sustaining through the main drop with a repetitive, grinding motif. Secondary: Atmospheric drone pads provide the harmonic bed during the intro, fading out as the beat kicks in. Sharp, metallic synth stabs appear intermittently during the main section to accentuate the rhythm and add textural complexity.
  Groove & Foundation Progression: The track begins without percussion, relying solely on the vocal and ambient drones. Upon the transition, a hard-hitting industrial drum pattern erupts, featuring a punchy, distorted kick drum on every beat and a crisp, metallic snare/clap on the off-beats.
  Embellishments, Textures & Spatial FX: Rising white-noise sweeps and reverse cymbal effects are utilized extensively during the build-up to bridge the gap between the spoken word and the drop.
  Section Continuity: Follow the lyric macro structure in order ([intro] → [verse] → [pre-chorus] → [chorus] → [instrumental] → [post-chorus] → [bridge] → [verse] → [pre-chorus] → [chorus] → [verse] → [bridge] → [pre-chorus] → [chorus] → [outro]). Keep the target genre active in every sung section; use changes in density, register, articulation and groove for contrast rather than switching to a different style.
