caption: |
  Global Metadata
  Basic Attributes: roughly 225–255 BPM. Blackened Brutal Death Metal / Bestial Black Metal / Extreme Death Metal. Relentless blast beats, continuous rapid double-kick, dissonant tremolo guitars, chromatic low-register death-metal riffing and ugly diminished or tritone harmony. No hard rock, alternative metal, nu-metal, metalcore, deathcore breakdowns, post-hardcore, pop-punk, clean guitars, clean vocals, arena-rock hooks or sentimental melodic choruses. Do not slow down for emotional sections.
  Global Emotional Progression: Start at full hostility and stay there. Development must come from riff mutation, drum-pattern changes, increased dissonance and shifts between gutturals and shrieks, never from becoming softer or more accessible. The betrayal reveal should intensify the attack. The final chorus should feel like absolute severance, followed by a hostile abrupt ending rather than catharsis.
  Application Scenarios & Imagery: freezing concrete rehearsal room, overdriven amplifiers, blown speakers and a band performing as if any reduction in intensity would be failure.
  Sonics & Production Profile: abrasive rather than glossy. Dense low-tuned rhythm guitars with enough upper-mid scrape for tremolo detail, audible distorted bass grind, dry articulate kick attack, cracking snare and chaotic cymbals. Avoid polished 2000s radio-metal sheen.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Female), extreme vocalist using cavernous false-cord gutturals, deep roars, feral mids and piercing black-metal shrieks.
  Vocal Style: No clean singing, no pop melody and no soft spoken interludes. Verses use rapid guttural attacks. Pre-choruses alternate lows and increasingly desperate shrieks. Choruses layer a deep primary roar with distant high screams while remaining musically extreme.
  Harmony/Backing Vocals: doubled gutturals and occasional distant shrieks only; no conventional sung harmony.
  Vocal FX: minimal dark room ambience and light saturation.
  Arrangement
  [intro] Immediate full-band assault: blast beats, continuous double-kick, tremolo dissonance and grinding bass.
  [verse] Alternate low chromatic death-metal figures with razor-thin tremolo movement; keep drums blasting.
  [pre-chorus] Raise harmonic tension through climbing diminished shapes and higher shrieks.
  [chorus] Stay at full tempo; use one recurring ugly riff motif only to identify the section, never a melodic rock hook.
  [post-chorus] Destroy the motif with frantic blast variations and dissonant chord movement.
  [bridge] Change riff vocabulary and cymbal pattern while remaining at maximum speed; no respite.
  [verse] Return denser, with counter-moving guitars and more violent vocal attacks.
  [pre-chorus] Increase tremolo density and snare aggression.
  [chorus] Repeat the brutal motif with thicker guitar layering and doubled extreme vocals.
  [verse] Push into the most chromatic, claustrophobic riff set yet.
  [bridge] Sustained blasts, tremolo unison bursts and alternating guttural/shriek attacks; absolutely no half-time.
  [pre-chorus] Maximum pressure and continuous double-kick.
  [chorus] Most violent statement of the recurring motif, still full-speed and dissonant.
  [outro] Final acceleration, prolonged scream, instantaneous full-band cutoff.
