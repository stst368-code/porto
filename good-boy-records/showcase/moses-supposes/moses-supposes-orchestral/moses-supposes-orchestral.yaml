caption: |-
  Global Metadata
  Dark Mountain / Ritual Balkan Folk. Keep the pulse near 68–70 BPM so the existing lyric phrasing still fits. Rebuild the song as a dark Balkan mountain performance: modal, spacious and ritualistic, but still recognisably the same composition rather than generic soundtrack music. Keep the source song’s exaggerated contrasts, vocal attitude and abrupt structural humour, but realise the shocks acoustically through ensemble cuts, shrill folk winds, percussion breaks and sudden massed voices. The emotional arc begins solitary and weathered, grows into a communal procession, then reaches a severe but cathartic final peak. Use gaida-style bagpipe drone, low bowed strings or gusle-like timbre, kaval, dark clarinet, frame drum, tapan, sparse hammered or plucked strings and low male or mixed folk voices where the source permits backing vocals. Favour natural modes, open fifths, drones and tense seconds over lush modern harmony. Production should be raw and dynamic, with natural stone-room or mountain-valley reflections. Avoid trailer percussion, glossy cinematic strings, synthesizer beds and modern metal guitars.
  Vocal Details
  Singer A (Female): retain the established source identity and register. Preserve the source cast exactly, but darken the performance through restrained folk ornament, stronger chest resonance and more exposed phrasing. Verses should feel close, serious and almost documentary in their directness. At emotional peaks, allow sustained notes, rough edges, narrow folk vibrato and antiphonal answers from a small distant group. Do not replace established melodic or spoken roles with a generic choir. If the source uses humour, keep the delivery straight-faced so the contrast survives. Effects remain acoustic: room reflections, distance and ensemble placement instead of obvious studio processing.
  Arrangement
  Section Timeline: [intro] to [verse] to [chorus] to [verse] to [chorus] to [verse] to [chorus] to [verse] to [chorus] to [bridge] to [outro]. Begin with drone alone or one exposed kaval, bowed string or clarinet phrase, leaving significant silence around the motif. The first vocal section adds only a low sustained foundation and occasional plucked accents. Introduce frame drum or tapan gradually, using weighty uneven accents and long gaps rather than a continuous modern beat. Repeated hooks gain a second drone voice, bowed counter-line or austere group response. Instrumental and solo passages should feel improvised and ancient, with breathy kaval, scraping bow texture, clarinet cries or bagpipe ornaments circling the melody. In a bridge, reduce almost to voice and drone before a processional drum pattern starts the rebuild. The final recurring section should be the largest point: layered acoustic drones, forceful tapan, high folk wind, low ensemble voices and the lead still clearly in front. Resolve with instruments dropping away one by one until only drone or a final unaccompanied cadence remains.
