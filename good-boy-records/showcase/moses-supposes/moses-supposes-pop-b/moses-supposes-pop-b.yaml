caption: |
  Global Metadata
  Basic Attributes: brisk, flowing tempo, roughly 120–145 BPM. Minimal Piano Singer-Songwriter. Minor-key, melancholic and highly melodic. The entire song is built exclusively around solo piano and female voice. The piano must provide both the harmonic progression and the rhythmic drive through continuous, fast-moving melodic patterns rather than slow sustained ballad chords.
  Global Emotional Progression: The song begins immediately with an exposed, repeating piano figure that already carries a sense of urgency and sadness. The verses feel intimate and emotionally restrained while the piano continues its restless forward motion beneath the voice. Choruses increase in emotional intensity primarily through stronger vocal delivery, higher melodic movement and slightly more forceful piano playing, not through additional instrumentation. The final section becomes the most emotionally exposed before ending simply and abruptly or allowing the final piano notes to ring naturally.
  Application Scenarios & Imagery: Sitting alone at a piano late at night, playing the same thought over and over because stopping would mean having to confront it. Melancholy, intimate and personal, but with constant forward movement rather than stillness.
  Sonics & Production Profile: Extremely sparse and natural. Close, detailed piano with clear hammer attack, resonant lower strings and audible room character. Preserve strong dynamics and human timing. Keep the vocal close and exposed. No drums, percussion, bass guitar, synthesizers, pads, orchestral strings, electronic beats or cinematic sound design.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Female), an intimate mezzo-soprano with a clear but slightly fragile tone, capable of moving from soft conversational singing into a rawer, emotionally strained upper register.
  Vocal Style: Verses use restrained, direct phrasing with clear diction and little ornamentation. The vocal should sit naturally against the rapid piano rather than trying to dominate it. Choruses become more urgent and emotionally open, with stronger projection and occasional roughness or strain allowed to remain audible.
  Harmony/Backing Vocals: Primarily a single exposed lead vocal. Very occasional subtle self-doubling may appear at an emotional peak, but avoid conventional stacked harmonies or choir-like backing vocals.
  Vocal FX: Minimal treatment. Natural room ambience, light compression and only enough reverb to blend the singer with the piano.
  Arrangement
  Instrument Lifecycle (Primary/Secondary): The piano is the sole instrumental foundation from beginning to end. Use continuous flowing right-hand melodic figures, repeating arpeggiated or broken-chord patterns and a firm left-hand pulse to create the impression of a complete rhythmic arrangement without percussion.
  Groove & Foundation Progression: The piano establishes the tempo immediately and rarely stops moving. Verses use lighter touch and slightly more open spacing. Choruses become denser through stronger octave movement, fuller chord voicings and greater attack while preserving the same underlying pattern. Any bridge should thin the piano briefly rather than introducing new instruments.
  Embellishments, Textures & Spatial FX: Musical interest comes from changing register, inversion, dynamics, rhythmic emphasis and melodic variation within the piano part itself. Avoid decorative production effects. The performance should feel like one pianist and one singer creating far more emotional momentum than the limited instrumentation should logically permit.
