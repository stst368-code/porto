caption: |
  Global Metadata
  Basic Attributes: roughly 210–240 BPM. Raw Second-Wave Black Metal / Extreme Black Metal. Relentless, primitive, hostile and violently fast from the first second to the final cutoff. The defining feature is an almost uninterrupted barrage of rapid double-kick bass drums and blast beats, with no breakdowns, no half-time sections, no slow passages and no atmospheric respite. Tremolo-picked guitars should remain thin, abrasive and vicious rather than thick modern death-metal chugging. Harmony is cold, dissonant and minor-key, with repeating malignant riff shapes and rapid chord movement rather than technical showcase playing.
  Global Emotional Progression: Begin at maximum hostility and remain there. Verses, choruses and bridge should change through riff shape, vocal phrasing and cymbal pattern rather than through reduced intensity. Every section should feel like another stage of the same uncontrolled attack. The final section becomes even more frantic through denser blasting, harsher tremolo movement and increasingly desperate vocals before ending abruptly.
  Application Scenarios & Imagery: A tiny underground venue, concrete walls, deafening amplifiers, sweat, feedback and a band performing with almost reckless physical intensity.
  Sonics & Production Profile: Raw, abrasive and close. Guitars are sharp and grainy, bass is dirty but audible, drums are fast and physical, and the kick remains clearly perceptible beneath the blast beats. Avoid polished modern metal production, cinematic layers, orchestration, electronic elements and spacious atmospheric passages.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Female), an extremely harsh female black-metal vocalist with piercing upper-register screams, torn rasps and occasional deeper throat-driven shrieks.
  Vocal Style: Continuous extreme screaming with no clean singing, whispering or melodic relief. Verses use frantic clipped phrases and savage sustained screams. Choruses become wider and more hysterical through doubled screams rather than melodic hooks. The bridge remains equally fast and violent, with prolonged desperate screams layered over uninterrupted blasting. The final passage should sound physically exhausted but increasingly ferocious.
  Harmony/Backing Vocals: Sparse doubled screams and occasional distant shriek layers only. No sung harmony or choir.
  Vocal FX: Minimal processing. Short dirty room reverb, light saturation and occasional raw doubling. Keep the voice painfully close and human.
  Arrangement
  Instrument Lifecycle: Tremolo-picked distorted guitars, distorted bass and full-speed acoustic drums enter almost immediately and remain active throughout. Do not remove the drums, guitars or bass for transitions.
  Groove & Foundation Progression: Maintain continuous high-speed double-kick and blast-beat propulsion across intro, verses, choruses, bridge and outro. Never drop into half-time. Never introduce a breakdown. Never reduce the pulse for dramatic contrast. Section changes come from alternating blast-beat patterns, snare emphasis, ride or crash changes, tremolo riff substitutions and short fills while preserving maximum forward momentum.
  Embellishments, Textures & Spatial FX: Brief amplifier feedback and cymbal wash may mark transitions, but never interrupt the attack. Avoid solos, clean guitar, acoustic passages, ambient interludes and extended instrumental pauses. Finish with either an instantaneous full-band cutoff or a final violent chord struck directly out of the ongoing blast.
