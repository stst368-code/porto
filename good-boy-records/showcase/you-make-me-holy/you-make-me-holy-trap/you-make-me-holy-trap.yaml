caption: |
  Global Metadata
  Basic Attributes: Raw Norwegian Second-Wave Black Metal / Primitive Black Metal, roughly 225–245 BPM, hostile and relentless with thin abrasive tremolo guitars and near-continuous blast-beat or rapid double-kick drive. Global Emotional Progression: Rebuild the supplied song completely inside this style while preserving its narrative identity: a playful devotional satire that treats everyday affection, prayer language and comic dog-like sounds with completely straight-faced conviction. Let repeated sections evolve through arrangement, register and intensity. Application Scenarios & Imagery: a small community performance that keeps becoming musically grander while the lyrics remain cheerfully literal and slightly absurd. Sonics & Production Profile: Cold, narrow and raw: trebly tremolo guitars, lean bass, natural but violent drums, cymbal wash and rough room ambience. Keep articulation despite the lo-fi edge. No breakdowns, no half-time release, no thick death-metal chug, no metalcore polish, no orchestral layers and no electronic drops.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male), a warm clear baritone-tenor with confident diction and sincere delivery; male ensemble responses may support large hooks. Vocal Style: Use a high, ragged extreme-metal rasp or scream with desperate projection. Keep phrasing urgent and continuous; any lower layer should be secondary and brief. Harmony/Backing Vocals: Backing vocals are rare: use only occasional distant scream doubles or group barks at the most severe peaks. Role Continuity: Keep the principal male singer stable. Choir or group layers should support the devotional framing without obscuring the comic clarity of the text. Vocal FX: Short grim room ambience, light saturation and raw compression; avoid glossy vocal widening or clean-pop effects.
  Arrangement
  Section Timeline: [intro] to [verse] to [pre-chorus] to [chorus] to [verse] to [chorus] to [pre-chorus] to [outro]. Instrument Lifecycle: Tremolo-picked guitars and blasting drums begin almost immediately and remain the engine. Section contrast comes from riff shape, chord movement, cymbal pattern and vocal density rather than reduced intensity. Section Directives: [intro]: Use feedback or a malignant tremolo cell for only a moment before the full-speed attack arrives. [verse]: Maintain blasting drums and thin fast tremolo with constantly moving minor or dissonant chord shapes. [pre-chorus]: Increase harmonic tension and cymbal violence without dropping tempo. [chorus]: Change to a broader repeating tremolo figure and more sustained vocal lines while intensity stays maximal. [outro]: Make the final passage even denser and cut off hard rather than fading into atmosphere. Groove & Foundation Progression: All transitions must remain native to the stated genre. Preserve recognisable motifs across repeated sections while changing density, register, voicing or articulation. Keep the target genre dominant throughout.
