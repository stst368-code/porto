caption: |
  Global Metadata
  Basic Attributes: slow nocturnal swing, roughly 58–72 BPM. Film Noir Vocal Jazz / Torch Ballad. Transform the song into an intimate late-night club performance built around piano, upright bass and brushed drums. Begin almost alone, let verses breathe with conversational rubato, and allow choruses to swell through richer harmony and brass colour rather than volume. The bridge should become the emotional low point, nearly suspended in time, before the final chorus returns with bittersweet composure. Imagine a nearly empty basement club after midnight, rain on the street and one warm spotlight. Production should be organic, close and dynamically open, with rich mid-range and natural room reflections. Avoid pop drums, electronic synths, country twang, orchestral bombast and rock distortion.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male), a smoky male baritone with intimate breath detail, relaxed jazz diction and restrained vibrato. Vocal Style: Verses should sit slightly behind the beat with flexible phrasing and careful consonants. Choruses can open into fuller chest voice but remain elegant and controlled. Use little or no backing vocal; if needed, add only a quiet unison or one close harmony in the final return. The bridge should feel almost spoken at its quietest. Use warm plate reverb and gentle compression, preserving breath and room sound. Keep the same lead identity across repeated sections so the performance feels continuous rather than recast between verses.
  Arrangement
  Section Timeline: [intro] to [verse] to [pre-chorus] to [chorus] to [verse] to [pre-chorus] to [outro]. Instrument Lifecycle / Groove / Texture: Grand piano establishes the intro with sparse voicings. Upright bass enters in the first verse, followed by brushed drums once the pulse settles. Pre-choruses add slightly denser piano harmony. Choruses introduce muted trumpet or flugelhorn counterlines and fuller bass movement. Instrumental sections feature a lyrical piano or muted-brass solo, never a flashy break. The bridge removes drums and leaves piano, bass and voice with long rests. Final chorus restores brushes and brass with the warmest voicings of the track. Outro returns to piano alone or a final quiet ensemble chord. Establish the signature texture immediately and leave clear room for the first vocal entrance. Keep the lead intelligible and let the core groove carry the narrative without unnecessary density. Increase tension through register, harmony or rhythmic density while withholding the full release. Deliver the clearest Keep transitions connected so changes in density, register and instrumentation clearly serve the section change.
