caption: |
  Global Metadata
  Basic Attributes: bpm is 91. key is Ab, and scale is major. Neo-Soul / Contemporary R&B.
  Global Emotional Progression: The track opens with a vulnerable, intimate atmosphere that gradually builds into a resilient and anthemic declaration during the choruses.
  Application Scenarios & Imagery: Ideal for late-night contemplation, scenes of emotional reconciliation in film, or moments of personal reflection during a quiet winter evening.
  Sonics & Production Profile: The mix features a warm, organic soundstage with a slightly vintage character. The low end is rounded and prominent, while the mid-range frequencies are rich to accommodate the vocal texture.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Female), a clear expressive mezzo-soprano with crisp diction, playful bite and enough power for emphatic refrains; supporting responses should remain secondary.
  Vocal Style: The delivery begins with a soft, conversational intimacy in the verses, utilizing subtle melisma and breathy phrasing.
  Harmony/Backing Vocals: Rich, multi-tracked self-harmonies appear prominently in the choruses and the bridge, creating a choir-like thickness.
  Vocal FX: The lead vocal is treated with a tasteful plate reverb that adds space without washing out the clarity.
  Arrangement
  Instrument Lifecycle (Primary/Secondary): Primary: A warm electric piano (Rhodes-style) serves as the harmonic backbone, playing lush, extended chords from the intro through to the outro, providing the song's soulful foundation. Secondary: A clean, round-toned electric bass enters immediately, locking in with the drums to drive the groove.
  Groove & Foundation Progression: The rhythm section is anchored by a laid-back, live-sounding drum kit featuring a crisp snare on beats 2 and 4 and a steady kick pattern. In the verses, the percussion is stripped back to just kick, snare, and light hi-hats.
  Embellishments, Textures & Spatial FX: Occasional finger snaps and soft shaker textures add rhythmic nuance in the background. Reverse reverb swells are used subtly as transitional effects leading into the choruses.
  Section Continuity: Follow the lyric macro structure in order ([intro] → [verse] → [chorus] → [instrumental] → [verse] → [outro]). Keep the target genre active in every sung section; use changes in density, register, articulation and groove for contrast rather than switching to a different style.
