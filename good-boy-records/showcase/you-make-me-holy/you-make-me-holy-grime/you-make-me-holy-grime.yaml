caption: |
  Global Metadata
  Basic Attributes: 138–144 BPM with a heavy half-time feel. UK grime / dark UK drill hybrid. Convert you-make-me-holy! into a sparse, cold, rhythm-dominant track built from sliding sub-bass, clipped kick patterns, sharp snares, skittering hats and a small number of eerie melodic tones. Keep the production British and minimal rather than American trap-pop. Source character to retain: Aggressive alternative rap, industrial trap and nu-metal crossover with a dark, abrasive early-2020s sound. Around 80 BPM with a heavy half-time pulse and rapid double-time vocal possibilities.
  Global Emotional Progression: Open with exposed atmosphere and a short vocal pickup, then let the first verse enter over minimal sub and percussion. Verses should carry most of the detail through cadence and lyric rhythm rather than thick instrumentation. Pre-choruses increase tension with rising sub movement, hat density or a repeated two-note motif. Choruses/hooks should become heavier and more repetitive, not brighter: larger sub drops, doubled vocal phrases and stronger rhythmic punctuation. Bridges may remove the drums almost completely before the final hook lands with maximum low-end weight.
  Application Scenarios & Imagery: Wet pavement at night, sodium streetlights, concrete underpasses, car interiors and close-mic vocals cutting through a cold urban mix.
  Sonics & Production Profile: Very sparse and dark. Deep controlled 808/sub-bass with deliberate slides, dry snare or clap, tight kick, crisp hats and occasional metallic or detuned keys. Leave significant negative space around the vocal. Avoid EDM risers, glossy pop chords, American melodic-trap crooning and over-busy orchestration.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male) and Singer B (Female), retaining the source song's contrasting character roles where they exist.
  Vocal Style: Verses use precise, speech-led rhythmic delivery with internal accents, short pauses and hard consonants. Keep the source lyric understandable; redistribute long lines across bars rather than rushing them. Hooks may use a lower, more repetitive chant or doubled phrase. Character dialogue can become dry ad-libs or short response lines.
  Harmony/Backing Vocals: Minimal. Use occasional low octave doubles, whispered tails or terse call-and-response. No lush harmony stacks.
  Vocal FX: Close and dry with firm compression, subtle saturation and occasional short delay throws on line endings. Keep reverb very restrained.
  Arrangement
  Instrument Lifecycle: [intro] begins with a bare minor-key motif, filtered ambience or isolated sub tone. [verse] uses sparse kick/snare, hat detail and sliding bass with large gaps. [pre-chorus] raises tension through denser hats, pitch movement and clipped vocal doubles. [chorus] drops into the heaviest sub pattern and strongest repeated hook while remaining sparse above the low end. [post-chorus] removes elements rapidly. [bridge] can fall to voice plus ambience before an abrupt final drop. [outro] should decay into the core motif rather than resolve like a pop song.
  Groove & Foundation Progression: 140 BPM framework, half-time snare placement, syncopated kick gaps, triplet or stuttering hat details and gliding sub-bass. Do not turn this into four-on-the-floor dance music.
  Embellishments, Textures & Spatial FX: Short reversed tones, metallic ticks, distant vocal fragments and occasional sub drops. Every effect should leave room for the lyric.
