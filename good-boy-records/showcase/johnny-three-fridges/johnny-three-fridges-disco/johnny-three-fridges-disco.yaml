caption: |
  Global Metadata
  Basic Attributes: 1970s Soul-Funk / Disco-Funk with an extended live-band vamp, roughly 108–118 BPM, playful, seductive and driven by stop-start rhythmic precision. Global Emotional Progression: Rebuild the supplied song completely inside this style while preserving its narrative identity: a darkly comic Minnesota folk tale about an apparently friendly man, three refrigerators and the suspicious mystery of the third one. Let repeated sections evolve through arrangement, register and intensity. Application Scenarios & Imagery: a warm small-town kitchen whose cheerful hospitality becomes gradually more ominous every time the refrigerator motor hums. Sonics & Production Profile: Deep syncopated electric bass, tight live drums, wah-wah guitar, clavinet, hand percussion, brass punches and warm analogue tape saturation. Use phaser colour and real ensemble dynamics. Avoid EDM synth drops, modern trap percussion and sterile quantisation.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male), a very deep resonant baritone with dry humour, crisp storytelling diction and a slightly rough edge. Vocal Style: Lead phrasing should sit inside the pocket with confident rhythmic control. Verses are conversational and sly; choruses open into stronger soul projection without losing the groove. Harmony/Backing Vocals: Use stacked soul backing vocals, short crowd responses and male/female call-and-response where appropriate; keep responses rhythmically disciplined. Role Continuity: Keep the narrator dominant. Group vocals, if used, should act as short responses or hook reinforcement rather than become a second narrator. Vocal FX: Warm plate reverb, tape saturation and occasional slap delay; spoken or character lines may be drier for contrast.
  Arrangement
  Section Timeline: [intro] → [verse] → [pre-chorus] → [chorus] → [post-chorus] → [verse] → [pre-chorus] → [chorus] → [post-chorus] → [verse] → [instrumental] → [chorus] → [post-chorus] → [outro]. Instrument Lifecycle: Bass, drums, clavinet and wah guitar establish the permanent pocket. Horns and strings enter as punctuation, disappear during tighter verses and return in larger blocks for choruses and final vamps. Section Directives: [intro]: Establish bass, clavinet and wah guitar first, with a short stop-start gesture before the vocal. [verse]: Keep the pocket bass-led and leave rhythmic holes for the singer to exploit. [pre-chorus]: Bring in horn or string accents and tighten the drum fills without increasing tempo. [chorus]: Add full backing harmonies, brass hits and wider guitar/clavinet interaction while the bass remains dominant. [post-chorus]: Use a compact call-and-response vamp over the same groove. [outro]: Ride the groove into an ensemble vamp and finish with a decisive band hit or natural fade. Groove & Foundation Progression: All transitions must remain native to the stated genre. Preserve recognisable motifs across repeated sections while changing density, register, voicing or articulation. Keep the target genre dominant throughout.
