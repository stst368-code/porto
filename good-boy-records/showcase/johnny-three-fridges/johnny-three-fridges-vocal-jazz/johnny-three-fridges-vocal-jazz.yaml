caption: |
  Global Metadata
  Basic Attributes: Late-Romantic / Expressionist Orchestral Horror, roughly 102–116 BPM with unstable local pacing, chromatic semitone pressure, tritone tension and psychologically abrupt dynamic shifts. Global Emotional Progression: Rebuild the supplied song completely inside this style while preserving its narrative identity: a darkly comic Minnesota folk tale about an apparently friendly man, three refrigerators and the suspicious mystery of the third one. Let repeated sections evolve through arrangement, register and intensity. Application Scenarios & Imagery: a warm small-town kitchen whose cheerful hospitality becomes gradually more ominous every time the refrigerator motor hums. Sonics & Production Profile: Full acoustic orchestra with sul ponticello strings, low woodwinds, E-flat clarinet, bass trombone, timpani, tam-tam and selective pipe organ. Preserve terrifying dynamic range and dry exposed chamber moments. No trailer drums, synth sub-bass, guitars or electronic texture.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male), a very deep resonant baritone with dry humour, crisp storytelling diction and a slightly rough edge. Vocal Style: Use dramatic classical phrasing capable of moving from intimate recitative to sudden operatic attack. Keep character changes in articulation, register and dynamics rather than distortion or novelty effects. Harmony/Backing Vocals: Choir or ensemble responses should appear only at major confrontations, often in clustered or severe harmonic voicings rather than comforting triads. Role Continuity: Keep the narrator dominant. Group vocals, if used, should act as short responses or hook reinforcement rather than become a second narrator. Vocal FX: Natural but variable hall perspective: relatively dry and forward in recitative, suddenly enormous at orchestral eruptions.
  Arrangement
  Section Timeline: [intro] to [verse] to [pre-chorus] to [chorus] to [post-chorus] to [verse] to [pre-chorus] to [instrumental] to [chorus] to [post-chorus] to [verse] to [outro]. Instrument Lifecycle: A jagged chromatic motif should recur across strings, woodwinds, brass and organ. Verses remain unstable and chamber-like; climaxes erupt into full orchestral mass with deliberate gaps afterward. Section Directives: [intro]: Reveal an incomplete chromatic motif through exposed strings and low woodwind, leaving uneasy silence around it. [verse]: Use irregular chamber attacks, tremolo or col legno strings and unstable counter-lines under the voice. [pre-chorus]: Compress the harmony through semitone motion and add low brass or timpani pressure. [chorus]: Erupt into brass clusters, aggressive strings and percussion, then create sudden holes rather than a continuous wall of sound. [post-chorus]: Leave a short dissonant afterimage in strings or organ before the next section. [outro]: Deny easy major-key release; finish on an unresolved, frightening acoustic sonority or abrupt cutoff. Groove & Foundation Progression: All transitions must remain native to the stated genre. Preserve recognisable motifs across repeated sections while changing density, register, voicing or articulation. Keep the target genre dominant throughout.
lyrics: |
  [intro]
  they call him Johnny
  ...
  Johnny, Three Fridges
  a name enough to chill the bone
  once you've heard my story
  i'll let you judge if you're safe at home
  [verse]
  so, what's a man to do with three whole fridges
  one for food, one for beer
  third one you'll never get near
  he'll have you over, n' cook you dinner
  delicious to eat, calories for a sinner
  hear it hum, hear it shiver
  go near fridge three and you'll hear him snigger
  [pre-chorus]
  so what he heck is going down
  in that sweet ol' minnesota town?
  well keep on 'a listenin'
  cuz I know the story, i wrote it down
  [chorus]
  ol' Johnny Three Fridges, sinister by name
  livin' the dream, playin' his all American game
  what's he got in 'em?
  day to day, never the same
  don't get nosey, don't go pryin'
  else you'll be the one runnin' away cryin'
  [post-chorus]
  so, listen up and listen real close
  won't be long before i'm gone ghost
  i'm spillin' the beans
  on ol Johnny Three Fridges dreams
  [verse]
  see, ain't nothin' sinister
  ain't nothin' chillin'
  except a white tailed deer
  and some ruffed grouse dead from killin'
  that's it that's all
  least that's all he'll tell ya' he got chilling'
  [pre-chorus]
  so, listen again, listen well
  my song my story should ring a bell
  what's in fridge number three ain' nobody around to tell
  [instrumental]
  [chorus]
  ol' Johnny Three Fridges, sinister by name
  livin' the dream, playin' his all American game
  what's he got in 'em?
  day to day, never the same
  don't get nosey, don't go pryin'
  else you'll be the one runnin' away cryin'
  [post-chorus]
  family man, family man
  ol' Johnny Three Fridges got a big family, man
  mouths to feed from dawn till eve
  maybe three fridges ain't so hard to believe
  [verse]
  bet with that revelation
  you're startin' to relax now but hear my hesitation
  one's in the kitchen, ordinary as can be
  second in the garage, nothin' hauntin' there still
  but when you find that third fridge
  tucked behind the basement door
  you'll see why Johnny told me
  I ain't welcome anymore
  [outro]
  so dear friend
  time's now for this here song to end
  hear my message, understand my warnin'
  maybe you'll wake to a delicious breakfast in the mornin'