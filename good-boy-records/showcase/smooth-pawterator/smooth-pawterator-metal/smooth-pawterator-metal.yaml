caption: |-
  Global Metadata
  Basic Attributes: Atmospheric Black Metal / Blackened Heavy Metal, roughly 168–180 BPM, cold and wind-driven with tremolo-picked guitars, rapid live drums and broad bleak harmonic space. Global Emotional Progression: Rebuild the supplied song completely inside this style while preserving its narrative identity: a relaxed portrait of two goldens, one regal and cool, the other affectionate and chaotic, held together by domestic warmth. Let repeated sections evolve through arrangement, register and intensity. Application Scenarios & Imagery: late-evening lamplight, polished wood and two golden retrievers occupying the room as if they commissioned the furniture. Sonics & Production Profile: Sharp tremolo guitar presence, lean bass, natural drum aggression, dark room tails and clear stereo depth. Keep the atmosphere cold rather than muddy. Avoid djent precision, glossy arena-rock production, electronic pads and metalcore breakdown grammar.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Female), a sultry breathy mezzo-soprano with intimate close-miked delivery and effortless phrasing. Vocal Style: Use a controlled harsh rasp layered onto a recognisable lead identity. Narrative verses can retain clearer diction; major hooks may add sustained screams or rough doubles without erasing the melody. Harmony/Backing Vocals: Use distant group responses or octave doubles sparingly at structural peaks; let guitars provide most of the harmonic breadth. Role Continuity: Keep the female lead understated and continuous; harmonies should support warmth rather than create a giant chorus unless the target genre explicitly calls for it. Vocal FX: Dark natural ambience and restrained saturation; long tails may widen major sections but should never obscure the lyric.
  Arrangement
  Section Timeline: [intro] → [verse] → [chorus] → [verse] → [bridge] → [outro]. Instrument Lifecycle: Fast tremolo guitars and live drums form the core. Open-string or ringing chord shapes widen choruses; quieter passages use exposed guitar resonance rather than synthetic atmosphere. Section Directives: [intro]: Begin distant and ominous with ringing guitar or wind-like amp texture before drums gather speed. [verse]: Drive with rapid tremolo and lean bass while preserving enough space for narrative clarity. [chorus]: Broaden into open tremolo voicings and sustained harsh vocals over a clear recurring hook. [bridge]: Hollow the arrangement to exposed guitar resonance and sparse drum pulse, then rebuild without becoming ambient post-rock. [outro]: Return to the broadest bleak riff and let the final chord decay naturally or cut with the full band. Groove & Foundation Progression: All transitions must remain native to the stated genre. Preserve recognisable motifs across repeated sections while changing density, register, voicing or articulation. Keep the target genre dominant throughout.
