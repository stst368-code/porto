caption: |
  Global Metadata
  Basic Attributes: Upbeat Americana / Modern Folk-Country / Acoustic Singer-Songwriter, roughly 104–114 BPM, warm, organic and road-driven with a steady acoustic pulse. Global Emotional Progression: Rebuild the supplied song completely inside this style while preserving its narrative identity: a relaxed portrait of two goldens, one regal and cool, the other affectionate and chaotic, held together by domestic warmth. Let repeated sections evolve through arrangement, register and intensity. Application Scenarios & Imagery: late-evening lamplight, polished wood and two golden retrievers occupying the room as if they commissioned the furniture. Sonics & Production Profile: Steel-string acoustic guitar, restrained live drums, electric or upright bass, pedal steel, mandolin and occasional organ/piano. Keep the production natural, warm and moderately wide with believable room sound. Avoid pop synths, disco kick patterns, metal guitars and arena-country bombast.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Female), a sultry breathy mezzo-soprano with intimate close-miked delivery and effortless phrasing. Vocal Style: Use clear storytelling phrasing with natural conversational timing. Verses stay close and grounded; choruses open into stronger sustained melody without excessive vocal theatrics. Harmony/Backing Vocals: Use simple close harmonies or low/high partner vocals in choruses; keep verses mostly solo. Role Continuity: Keep the female lead understated and continuous; harmonies should support warmth rather than create a giant chorus unless the target genre explicitly calls for it. Vocal FX: Short plate or room reverb, light compression and subtle tape warmth; preserve breath and consonant detail.
  Arrangement
  Section Timeline: [intro] to [verse] to [chorus] to [verse] to [chorus] to [bridge] to [outro]. Instrument Lifecycle: Acoustic guitar provides continuous rhythmic identity. Bass and light drums enter early; pedal steel or mandolin answers vocal phrases; later choruses add fuller strumming and harmony without losing the intimate roots character. Section Directives: [intro]: Begin with acoustic picking or strumming and one memorable pedal-steel, fiddle or mandolin response. [verse]: Keep the groove light and narrative, with acoustic guitar, bass and restrained drums. [chorus]: Open into fuller strumming, stronger backbeat and simple vocal harmony while keeping the acoustic core dominant. [bridge]: Reduce to acoustic guitar and one secondary instrument, then rebuild naturally. [outro]: Return to a simpler acoustic texture and end with a warm natural cadence. Groove & Foundation Progression: All transitions must remain native to the stated genre. Preserve recognisable motifs across repeated sections while changing density, register, voicing or articulation. Keep the target genre dominant throughout.
