caption: |-
  Global Metadata
  Basic Attributes: 1970s Soul-Funk / Disco-Funk with an extended live-band vamp, roughly 108–118 BPM, playful, seductive and driven by stop-start rhythmic precision. Global Emotional Progression: Rebuild the supplied song completely inside this style while preserving its narrative identity: an affectionate, overblown declaration that the small town of New Mills is the centre of the universe and the obvious place to conquer life. Let repeated sections evolve through arrangement, register and intensity. Application Scenarios & Imagery: a local high street presented with the glamour of a giant theatre marquee and the confidence of a world-capital anthem. Sonics & Production Profile: Deep syncopated electric bass, tight live drums, wah-wah guitar, clavinet, hand percussion, brass punches and warm analogue tape saturation. Use phaser colour and real ensemble dynamics. Avoid EDM synth drops, modern trap percussion and sterile quantisation.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male), a rich baritone crooner with relaxed confidence, clean consonants and theatrical timing. Vocal Style: Lead phrasing should sit inside the pocket with confident rhythmic control. Verses are conversational and sly; choruses open into stronger soul projection without losing the groove. Harmony/Backing Vocals: Use stacked soul backing vocals, short crowd responses and male/female call-and-response where appropriate; keep responses rhythmically disciplined. Role Continuity: Keep the principal male singer recognisable across all genre changes; ensembles may enlarge the hook without turning the song into anonymous group vocals. Vocal FX: Warm plate reverb, tape saturation and occasional slap delay; spoken or character lines may be drier for contrast.
  Arrangement
  Section Timeline: [intro] → [verse] → [verse] → [chorus] → [verse] → [chorus] → [verse] → [verse] → [bridge] → [chorus] → [outro]. Instrument Lifecycle: Bass, drums, clavinet and wah guitar establish the permanent pocket. Horns and strings enter as punctuation, disappear during tighter verses and return in larger blocks for choruses and final vamps. Section Directives: [intro]: Establish bass, clavinet and wah guitar first, with a short stop-start gesture before the vocal. [verse]: Keep the pocket bass-led and leave rhythmic holes for the singer to exploit. [chorus]: Add full backing harmonies, brass hits and wider guitar/clavinet interaction while the bass remains dominant. [bridge]: Break the band into smaller rhythmic fragments, briefly spotlighting bass, drums or spoken vocal before the full return. [outro]: Ride the groove into an ensemble vamp and finish with a decisive band hit or natural fade. Groove & Foundation Progression: All transitions must remain native to the stated genre. Preserve recognisable motifs across repeated sections while changing density, register, voicing or articulation. Keep the target genre dominant throughout.
