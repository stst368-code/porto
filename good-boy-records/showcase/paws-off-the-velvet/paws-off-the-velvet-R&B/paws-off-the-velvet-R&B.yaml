caption: |
  Global Metadata
  Basic Attributes: 1980s Sophisti-Soul / Quiet Storm / Sophisti-Pop, roughly 96–104 BPM, understated, elegant and cool with restrained romantic momentum. Global Emotional Progression: Rebuild the supplied song completely inside this style while preserving its narrative identity: a witty character duet led by regal, possessive Doja and repeatedly disrupted by enthusiastic Bam Bam and his complete lack of spatial awareness. Let repeated sections evolve through arrangement, register and intensity. Application Scenarios & Imagery: a velvet chair, a sunlit room and a princess trying to maintain standards while a large golden retriever arrives sideways with a tennis ball. Sonics & Production Profile: Jazzy electric piano, warm electric bass, soft brushed or gated-but-gentle drums, smooth saxophone, subtle clean guitar and polished analogue-digital studio sheen. Avoid disco four-on-the-floor, slap-funk excess, synthwave bombast, trap and rock distortion.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Female) is a silky, confident lead for Doja; Singer B (Male) is a warm, enthusiastic character voice for Bam Bam; supporting voices provide short responses. Vocal Style: Keep the lead close, breathy and unforced. Verses should feel conversational and poised; hooks become slightly more melodic and warm without aggressive belting. Harmony/Backing Vocals: Use soft close harmonies in choruses, mixed low enough to preserve intimacy. Character duets should remain distinct and gentle. Role Continuity: Preserve the female/male character split indicated by the supplied role tags. Do not collapse the duet into one generic lead. Vocal FX: Warm plate reverb, subtle chorus or delay and smooth compression; no extreme processing.
  Arrangement
  Section Timeline: [intro] to [verse] to [pre-chorus] to [chorus] to [verse] to [verse] to [chorus] to [instrumental] to [bridge] to [instrumental] to [chorus] to [outro]. Instrument Lifecycle: Electric piano and bass establish the harmonic pocket. Gentle drums enter early; saxophone appears as a melodic response and becomes the main instrumental voice in bridge/solo sections. Additional pads or clean guitar remain understated. Section Directives: [intro]: Open with electric piano, soft bass and a restrained saxophone motif. [verse]: Keep the pocket low-density and leave generous space around the intimate vocal. [pre-chorus]: Raise harmony and add a little percussion or sax response without turning the track into disco. [chorus]: Broaden electric-piano voicings and harmony vocals while the groove remains smooth and controlled. [instrumental]: Maintain the soft pocket while electric piano, bass and sax trade gentle motifs. [bridge]: Pull the vocal back and give saxophone or electric piano a sultry, harmonically rich spotlight. [outro]: Fade or resolve with the original sax/electric-piano motif and a soft final vocal phrase. Groove & Foundation Progression: All transitions must remain native to the stated genre. Preserve recognisable motifs across repeated sections while changing density, register, voicing or articulation. Keep the target genre dominant throughout.
