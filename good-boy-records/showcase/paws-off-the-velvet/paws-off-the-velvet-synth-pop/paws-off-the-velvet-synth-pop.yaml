caption: |-
  Global Metadata
  Basic Attributes: Melodic Death Metal / Extreme Heavy Metal, roughly 170–190 BPM, fast and aggressive but built around clearly shaped twin-guitar melody rather than breakdown-heavy metalcore. Global Emotional Progression: Recast a witty character duet led by regal, possessive Doja and repeatedly disrupted by enthusiastic Bam Bam and his complete lack of spatial awareness as a coherent extreme-metal performance with one recognisable riff identity running through the song. Begin decisively, keep the verses rhythmically aggressive, and let pre-choruses increase tension through denser riffing and drum pressure rather than slowing down. Choruses should recur as brutal, memorable motifs rather than pop hooks. Use bridges for colder harmony, counter-riffs or rhythmic mutation, not a genre-breaking soft section or metalcore breakdown. The final return should be the densest and most ferocious statement of the established material. Application Scenarios & Imagery: a velvet chair, a sunlit room and a princess trying to maintain standards while a large golden retriever arrives sideways with a tennis ball. Sonics & Production Profile: Tight live drums with sustained double-kick drive, distorted but articulate rhythm guitars, audible bass grind and bright harmonised lead-guitar lines. Production should be modern enough for detail without becoming sterile. Avoid pop-rock choruses, electronic drops and half-time breakdown dependence.
  Vocal Details
  Vocal Gender & Timbre: Keep the established character roles but translate them into distinct melodic-death-metal voices: female roles use a fierce mid/high rasp, male roles use deep growls and rough barked projection, and ensemble responses use harsh unison shouts. No clean singing.
  Vocal Style: Verses use rhythmically precise harsh phrasing locked tightly to the riff; choruses lengthen into sustained growls or rasps while the guitars carry the melodic identity. Increase intensity with layering and register changes, not clean-sung choruses, half-time breakdowns or metalcore phrasing.
  Harmony/Backing Vocals: Use occasional low group shouts or a second harsh layer at peaks; no glossy clean choir unless the supplied character roles require contrast. Role Continuity: Preserve the female/male character split indicated by the supplied role tags. Do not collapse the duet into one generic lead. Vocal FX: Compact room, saturation and firm compression; keep consonants and attack clear.
  Arrangement
  Section Timeline: [intro] → [verse] → [pre-chorus] → [chorus] → [verse] → [verse] → [chorus] → [instrumental] → [bridge] → [instrumental] → [chorus] → [outro]. Instrument Lifecycle: Twin guitars establish a recurring harmonised motif over bass and double-kick drums. Verses alternate tight rhythm figures with melodic runs; choruses simplify the chord foundation so lead harmonies can become memorable. Section Directives: [intro]: Open with the central harmonised guitar motif and immediate drum urgency. [verse]: Drive with tightly articulated riffing and sustained double-kick, leaving small gaps around vocal attacks. [pre-chorus]: Climb harmonically and increase cymbal density without slowing down. [chorus]: Broaden into a memorable twin-guitar line over a simpler crushing rhythm foundation. [instrumental]: Let harmonised guitars carry the narrative over relentless drums. [bridge]: Change riff contour and harmonic colour but keep momentum; avoid a lazy half-time breakdown. [outro]: Accelerate or intensify the main motif and end with a decisive final hit. Groove & Foundation Progression:
