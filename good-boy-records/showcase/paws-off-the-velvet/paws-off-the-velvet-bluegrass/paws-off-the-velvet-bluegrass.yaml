caption: |
  Global Metadata
  Basic Attributes: bpm is 128. key is Bb, and scale is major. Country / Bluegrass.
  Global Emotional Progression: The piece opens with an energetic, driving instrumental introduction that immediately establishes a lively and rustic atmosphere.
  Application Scenarios & Imagery: A bustling barn dance, a road trip through rolling countryside landscapes, or a lively gathering around a campfire under a starry sky.
  Sonics & Production Profile: The soundstage is wide and well-defined, allowing each acoustic instrument distinct placement within the stereo field. The frequency response is bright and crisp, highlighting the attack of the plucked strings and the clarity of the bowed instruments, while the low end remains tight and supportive.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Female), a silky, confident lead for Doja; Singer B (Male), a warm, enthusiastic character voice for Bam Bam; short ensemble responses may support them. Preserve the contrast between the two roles.
  Vocal Style: The performance is rooted in traditional country storytelling, featuring a relaxed yet rhythmic delivery in the verses that shifts to a more open, anthemic projection during the choruses. The phrasing is precise, emphasizing the narrative flow without excessive ornamentation.
  Harmony/Backing Vocals: Tight, three-part male harmony layers enter prominently during the choruses, providing a rich, full-bodied texture that supports the lead vocal.
  Vocal FX: The vocals are treated with a modest amount of plate reverb to add spatial depth without obscuring clarity, and a subtle compression ensures consistent presence throughout the dynamic shifts of the arrangement.
  Arrangement
  Instrument Lifecycle (Primary/Secondary): Primary: A bright, percussive banjo playing rapid, rolling arpeggios serves as the primary melodic and rhythmic driver, present from the Intro through to the Outro. An acoustic guitar provides the core harmonic strumming pattern, anchoring the rhythm section continuously. Secondary: A fiddle (bowed string) weaves melodic counter-lines and fills, entering prominently in the intro, interludes, and soaring over the choruses.
  Groove & Foundation Progression: The rhythm is propelled by a live acoustic drum kit featuring a crisp snare backbeat and a steady kick drum pattern that locks tightly with the upright bass.
  Embellishments, Textures & Spatial FX: Occasional fiddle slides and banjo rolls act as transitional embellishments between sections.
  Section Continuity: Follow the lyric macro structure in order ([intro] → [verse] → [pre-chorus] → [chorus] → [solo] → [verse] → [chorus] → [bridge] → [chorus] → [outro]). Keep the target genre active in every sung section; use changes in density, register, articulation and groove for contrast rather than switching to a different style.
