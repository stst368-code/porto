caption: |
  Global Metadata
  Basic Attributes: grave, processional and driving, roughly 82–98 BPM. Gothic Oratorio / Cathedral Organ Symphony / Dark Ceremonial Opera. Build a severe, menacing acoustic work dominated by real pipe organ, low strings, low brass, timpani and male choir. The entire performance should feel like an ancient royal proclamation concerning the pursuit, seizure and divine possession of a sacred Orb. Prince Chunk is not merely chasing an object; he is declaring hereditary right over it before court, clergy and kingdom.
  Begin in oppressive stone-hall stillness, as though a royal herald is opening a decree before a vast medieval court. Gradually develop into an inexorable ceremonial procession, increasing weight through organ pedal, low strings, brass and choral responses. The largest passages should reach overwhelming architectural force without becoming trailer music, rock or symphonic metal. Imagine torchlight against vaulted masonry, banners hanging above a cathedral nave, carved stone beasts overlooking the procession, and Prince Chunk advancing through his realm while proclaiming dominion over the Orb.
  The tone must remain utterly serious. Do not play the archaic language or subject matter for comedy. The grandeur itself should create the absurdity. Preserve broad natural dynamics, deep low-frequency organ energy, heavy acoustic percussion and long cathedral decay. Strictly acoustic and orchestral: no drum kit, electric guitar, synthesizer, electronic risers, modern pop percussion or cinematic electronic sound design.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male), a commanding dramatic bass-baritone with dark chest resonance, aristocratic authority, precise diction and controlled operatic projection.
  Vocal Style: Perform the lyrics as ceremonial proclamation, operatic recitative and royal judgement. The singer should sound like a medieval prince issuing binding law before his court, with every reference to the Orb treated as an object of immense symbolic importance.
  Emphasise archaic constructions such as “thou,” “thy,” “thine,” “shall,” “nay,” “behold,” “ere” and “Anno Domini.” Deliver them naturally rather than theatrically exaggerated. Prince Chunk should sound completely convinced of his sovereign authority.
  Verses should favour strongly articulated recitative with deliberate pauses, rhetorical weight and occasional sustained endings. Statements such as “That Orb is mine,” “Possession is law,” “retrieval divine,” and “Then farewell to thy wall” should land like formal legal decrees.
  The repeated “Orb. Orb. Where lies the Orb?” passages should become dark ritual invocations. The soloist asks the question while low male voices answer, sustain or echo selected words. Treat “Orb” almost as a sacred liturgical term rather than an ordinary noun.
  Use a low male choir sparingly for proclamations, ritual responses and moments of increasing authority. Gregorian-like unison, open fifths and severe block harmony are appropriate. At major declarations, the choir may repeat or sustain the final word beneath Prince Chunk.
  Maintain one continuous lead identity throughout. Apply only natural cathedral reverberation. No pop tuning, slap delay, distortion or modern vocal processing.
  Arrangement
  Section Timeline: [intro] to [verse] to [verse] to [verse] to [verse] to [verse] to [verse] to [verse] to [verse] to [verse] to [outro].
  Instrument Lifecycle / Groove / Texture: Open with an enormous low pipe-organ pedal beneath distant contrabasses and cellos, leaving substantial empty space around “Prince Chunk Production / Know thy hedge / Attend me now, and make thy pledge.” Treat this opening as the formal commencement of a royal decree.
  Early verses should remain controlled and processional. Use low strings, bassoons, contrabassoon and restrained organ registrations beneath clearly intelligible declamatory vocals. Establish a slow ceremonial pulse through timpani, pizzicato bass or repeated low-string figures rather than a modern beat.
  As Prince Chunk's claims become more absolute, progressively introduce horns, bass trombones, tuba, heavier timpani and thicker organ registrations. Let orchestral responses act as punctuation: brass after a threat, timpani beneath a judgement, or organ flourishes after declarations of ownership.
  For “That Orb is mine,” expand into the first major royal proclamation. Full low brass, organ and male choir should reinforce the sense that an irreversible decree has been issued.
  For “Thou throwest it once / and the covenant is sealed,” shift briefly toward solemn legal ceremony. Let the orchestra become measured and deliberate, as though terms of ancient law are being pronounced. “Possession is law / and retrieval divine” should receive especially heavy harmonic emphasis.
  For the fence, gate and mortal sequence, make each question increasingly ominous. Follow each answer with short orchestral judgement chords. Leave a brief silence before “Well... thou knowest the rest,” and deliver the line quietly, with restrained menace.
  For the repeated “Orb. Orb. Where lies the Orb?” passage, transform the piece into a ritual search litany. Each isolated “Orb” should strike like an invocation, separated by organ, timpani or low choral responses. Intensify each cycle through register and orchestral mass without greatly increasing tempo.
  The later pursuit verses should introduce more active low-string ostinato and contrapuntal organ movement, creating unstoppable forward motion while remaining unmistakably acoustic and ceremonial.
  For “Hear Prince Chunk roar,” allow a dark brass fanfare and greater rhythmic drive, suggesting the sovereign himself entering the procession. Keep the fanfare heavy and martial rather than heroic.
  For “Orb in my jaws / now behold my procession,” reach the largest ceremonial scale of the entire work. Full organ pleno, massed low strings, horns, trombones, tuba, timpani and imposing male choir should turn the recovery of the Orb into a royal triumphal procession.
  “Thou didst begin this game / now thou shalt not have it back” should function as the final judgement: broad, slow, monumental and completely definitive.
  The outro should abruptly return to ceremonial restraint. Withdraw percussion, brass and choir around “And thus am I done.” Allow “Chunk Lion” to stand almost alone as a formal declaration of identity.
  Treat “Anno Domini / Two Thousand and Twenty-Six” like the dating of an ancient royal charter, supported by solemn organ chords and distant low choir.
  “Peace be upon thee” should be delivered with grave composure after all preceding threats, creating a final moment of absurdly sincere royal benevolence. Resolve with one enormous organ-and-orchestra cadence and allow the cathedral reverberation to decay fully into silence.
  Keep the lead intelligible at all times. The orchestration must support the language and authority of Prince Chunk rather than bury the text beneath continuous density. Transitions should feel like changes in ceremonial rank, law, pursuit and possession, achieved through register, choir, organ registration and acoustic orchestral weight.
lyrics: |
  [intro]
  Prince Chunk Production
  Know thy hedge
  Attend me now, and make thy pledge
  [verse]
  Take thou thy Orb
  I shall take it straight back
  I shall not cease
  I am sworn to attack
  Through thine ends
  thy yard
  thy garden
  I charge without pardon
  [verse]
  I cannot be stayed
  nor shall I beg pardon
  Not for a treat
  when an Orb lies before me
  My purpose retreats not
  my focus stands true
  Four paws to the earth
  and I thunder straight through
  [verse]
  Mine skull is of titanium
  as hard as these walls
  I smash through all before me
  beneath moon and stars
  With mine own cranium
  hear how Prince Chunk roars
  Think not this matter difficult
  that Orb shall be yours no more
  That Orb is mine
  care I not where
  care I not when
  care I not who
  nor care I why
  From morning till night
  when the Orb toucheth ground
  I am ready to fight
  [verse]
  Thou throwest it once
  and the covenant is sealed
  Thou didst think it thine?
  Nay, thy claim must now yield
  The Orb leaves thy hand
  and the title is mine
  Possession is law
  and retrieval divine
  [verse]
  A fence in my path?
  Then the fence shall come down
  A gate bolted fast?
  I shall cast it to ground
  A mortal in my way?
  Well...
  thou knowest the rest
  [verse]
  Bush unto hedge
  hedge unto flowerbed
  Flowerbed unto thy head
  and behold, thou art dead
  Straight through the whole lot
  with singular devotion
  Thou thinkest me mad?
  Nay, behold my locomotion
  [verse]
  Orb.
  Orb.
  Where lies the Orb?
  Beyond yonder wall?
  Then farewell to thy wall.
  Orb.
  Orb.
  Where lies the Orb?
  Within thy hand?
  How exceedingly grand.
  Orb.
  Orb.
  Where lies the Orb?
  Drifting downriver?
  Fortune smiles,
  for I am a swimmer.
  [verse]
  No pause for reflection
  no counsel nor plan
  My course is determined
  by thy throwing hand
  Mine eyes on the prize
  I reckon its flight
  One bounce to the left
  then I cut to the right
  Wouldst thou reach down first?
  I counsel reconsideration
  I am built like a cupboard
  of formidable construction
  Yet like mine lyrical current
  I flow as the river
  Stand thou before me
  and through thee I shall thunder
  [verse]
  Hear Prince Chunk roar
  as I enter the race
  Mine ears cast behind me
  with the wind on my face
  Shoulder through shrubbery
  the branches divide
  Ere thou criest out "Bam!"
  I am gone from thy side
  Orb in my jaws
  now behold my procession
  Wouldst thou have it returned?
  Come challenge possession
  Take one little step
  and I spring to attack
  Thou didst begin this game
  now thou shalt not have it back
  [outro]
  And thus am I done
  Chunk Lion
  Anno Domini
  Two Thousand and Twenty-Six
  And permit me to declare...
  Peace be upon thee