caption: |
  Global Metadata
  Basic Attributes: French House / Filter Disco, roughly 122–128 BPM, tightly looped, physical and hypnotic with sample-like chord stabs and an unwavering club pulse. Global Emotional Progression: Rebuild the supplied song completely inside this style while preserving its narrative identity: an archaic royal proclamation in which Prince Chunk declares absolute legal and spiritual ownership of the Orb and any route required to retrieve it. Let repeated sections evolve through arrangement, register and intensity. Application Scenarios & Imagery: a medieval decree delivered while a massive golden retriever charges through hedges, walls and every obstacle between him and a tennis ball. Sonics & Production Profile: Solid four-on-the-floor kick, rubbery bass, filtered disco-chord loop, bright open hi-hats, compressed drum bus and sweeping low-pass/high-pass movement. The mix should pump rhythmically and feel tactile. Avoid trance leads, festival EDM drops and unrelated cinematic layers.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male), a commanding bass-baritone with dark chest resonance, precise diction and unshakeable aristocratic certainty. Vocal Style: Keep vocals rhythmically precise and comparatively dry. Verses may be more clipped and loop-aware; hooks should become memorable through repetition and doubling rather than huge melodic ornament. Harmony/Backing Vocals: Use short doubles, filtered backing fragments and selective stacked phrases in choruses; do not bury the lead in a choir. Role Continuity: Keep the same sovereign male lead throughout; backing voices should function as court, crowd or ritual response rather than competing characters. Vocal FX: Firm compression, subtle saturation and tempo-synced delay; occasional filter or telephone treatment can mark transitions, but intelligibility remains primary.
  Arrangement
  Section Timeline: [intro] → [verse] → [verse] → [verse] → [verse] → [verse] → [verse] → [chorus] → [post-chorus] → [verse] → [verse] → [chorus] → [post-chorus] → [instrumental] → [chorus] → [post-chorus] → [outro]. Instrument Lifecycle: A filtered chord loop, kick, bass and hi-hat are the permanent engine. Arrangement evolution comes from opening filters, muting layers, changing sample register and adding short percussion accents rather than introducing many new instruments. Section Directives: [intro]: Begin with the chord loop heavily filtered, then introduce kick and bass in stages before the vocal settles. [verse]: Hold a constrained loop with strong negative space and small filter motion under the vocal. [outro]: Close the filter progressively and leave the core loop disappearing into compression and room tone. Groove & Foundation Progression: All transitions must remain native to the stated genre. Preserve recognisable motifs across repeated sections while changing density, register, voicing or articulation. Keep the target genre dominant throughout.
