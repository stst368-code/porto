story:
caption: |
  Global Metadata
  Basic Attributes: extreme double-kick drive, roughly 190–225 BPM. Brutal Death Metal / Technical Death Metal. Rebuild the song as a dense, low-tuned assault with precise double-kick drumming, violent syncopation and sharply articulated riff changes. Verses should feel claustrophobic and rhythmically intricate, choruses lock into memorable crushing motifs, and the bridge should slow into a massive but brief half-time section before the final acceleration. Imagine a concrete underground venue with the band almost physically on top of the listener. Production should be modern enough for riff definition but not sterile: huge kick attack, dense guitars, audible bass grind and controlled cymbal detail. Avoid black-metal lo-fi haze, symphonic strings, electronic drops, nu-metal bounce and melodic hard-rock choruses.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male), a deep male guttural growl with powerful low-mid resonance and occasional higher bark accents. Vocal Style: Verses use compact guttural phrasing that locks to riff accents. Choruses can stretch into longer roars with a second higher extreme-vocal layer for contrast. Keep clean singing absent. The bridge uses slower, heavier sustained growls, then the final return restores rapid articulation. Apply very short room ambience and compression only; no lush reverb or melodic tuning. Keep the same lead identity across repeated sections so the performance feels continuous rather than recast between verses.
  Arrangement
  Section Timeline: [intro] to [verse] to [verse] to [verse] to [verse] to [verse] to [verse] to [verse] to [verse] to [verse] to [outro]. Instrument Lifecycle / Groove / Texture: Down-tuned guitars, distorted bass and double-kick drums enter immediately after any brief intro noise. Verses cycle through palm-muted chromatic riffs, fast tremolo bursts and abrupt metric accents. Pre-choruses tighten around ascending riff sequences. Choruses use a simpler, heavier central riff with wider cymbal crashes. Instrumental sections introduce technical guitar or bass figures but remain riff-first, not shred showcases. The bridge drops to half-time kick, floor toms and dissonant sustained chords, then a snare pickup launches the final high-speed section. End on a coordinated full-band cutoff or one massive low chord. Establish the signature texture immediately and leave clear room for the first vocal entrance. Keep the lead intelligible and let the core groove carry the narrative without unnecessary density. Resolve by subtracting layers or using a decisive cadence that belongs to the established sound world. Keep transitions connected so changes in density, register and instrumentation clearly serve the section change.
