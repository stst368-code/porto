story: A relentless ball-pursuit song about charging through obstacles, refusing restraint and attacking the game at full speed. The music should feel physically unstoppable rather than heroic.
caption: |-
  Global Metadata
  Basic Attributes: 218–238 BPM. Raw second-wave black metal fused with blackened death metal. Primitive, malignant and frantic, never melodic metalcore, nu-metal, deathcore, arena metal or polished 2000s heavy rock. A relentless ball-pursuit song about charging through obstacles, refusing restraint and attacking the game at full speed. The music should feel physically unstoppable rather than heroic.
  Global Emotional Progression: Start under attack with amplifier hiss, dissonant tremolo and immediate full-speed drums. Verses remain breathless; choruses become wider and more ritualistic without becoming melodic. Bridges change harmony or register rather than dropping into a breakdown. End at maximum instability with an abrupt cutoff or feedback collapse.
  Application Scenarios & Imagery: freezing night air, wet stone, scorched timber, candle smoke and a rehearsal room that feels more like a forbidden rite than a concert.
  Sonics & Production Profile: thin abrasive guitars with hard pick attack, dirty audible bass and natural frantic drums. Blast beats and rapid double-kick dominate. Allow cymbals and room spill to create controlled chaos. No glossy master, giant sub-bass, radio-metal guitars, orchestral layers, synth drops, heroic harmony or clean pop chorus.

  Vocal Details
  Vocal Gender & Timbre: Singer A (Female), piercing black-metal rasp, torn upper-register shrieks and occasional throat-driven lower screams. A secondary low death growl may reinforce isolated words.
  Vocal Style: no clean singing. Verses use clipped rapid screaming locked to the riff; choruses use sustained cracked shrieks and doubled ritual phrases; bridges stay extreme rather than whispered or melodic. Keep enough diction for the lyric rhythm to remain audible.
  Harmony/Backing Vocals: sparse doubled shrieks, distant hostile responses and occasional low growl reinforcement only.
  Vocal FX: short filthy room reverb, restrained saturation and minimal compression.

  Arrangement
  Section Timeline: intro → verse → verse → verse → verse → verse → verse → verse → verse → verse → outro.
  Instrument Lifecycle: two thin high-gain guitars, dirty bass and live drums remain the permanent core. One guitar carries malignant tremolo or dissonant chord motion while the second answers with related lines. Song-specific motif: keep a motoric pursuit riff almost constantly moving, changing accents rather than stopping for impact.
  Groove & Foundation Progression: blasts and rapid double-kick dominate. Verses may alternate blast patterns with violent straight-ahead propulsion; choruses broaden through longer tremolo shapes and cymbal wash while staying fast. A bridge may briefly use stalking dissonant chords, but never half-time breakdown language. Solos should be chaotic, atonal or tremolo-led, not hard-rock showcases.
  Embellishments, Textures & Spatial FX: feedback, pick scrape, stick count and room bleed are welcome. Every transition must remain attached to the same hostile ensemble so the track never mutates into modern alternative metal.
