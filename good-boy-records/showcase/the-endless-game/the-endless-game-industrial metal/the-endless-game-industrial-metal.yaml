caption: |
  Global Metadata
  Basic Attributes: Dark Theatrical Alternative Pop with hyperpop detail and trap-informed rhythm, roughly 112–132 BPM, combining sinister synthetic texture with a strong song-led chorus. Global Emotional Progression: Rebuild the supplied song completely inside this style while preserving its narrative identity: a bleakly comic cycle of balls lost to water, trapped in jaws and swallowed by forces far larger than the dog pursuing them. Let repeated sections evolve through arrangement, register and intensity. Application Scenarios & Imagery: an absurd apocalyptic landscape where every tennis ball is doomed and the chase begins again anyway. Sonics & Production Profile: Tight low-end, clipped modern drums, distorted or glassy synth accents, occasional live-guitar bite and deliberate contrast between intimate verses and enlarged hooks. Keep the mix polished but slightly abrasive. Avoid EDM festival drops, retro disco grooves and generic pop-rock drumming.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male), a dark low register with strong rhythmic articulation and enough range to move from restrained narration to violent emphasis. Vocal Style: Keep the performance character-led and sharply articulated. Verses should feel close, dry and almost spoken at moments; choruses expand into a confident melodic line with controlled aggression rather than conventional power-pop belting. Harmony/Backing Vocals: Use selective octave doubles, whispered or pitched shadows and wider stacks only in choruses or final returns. Role Continuity: Maintain one male identity; use doubles or group shouts only at structural peaks. Vocal FX: Close compression, short dark reverb, occasional filtered delay and brief saturation on emphatic phrases; no constant vocal gimmickry.
  Arrangement
  Section Timeline: [intro] to [verse] to [chorus] to [verse] to [bridge] to [chorus] to [post-chorus] to [verse] to [chorus] to [post-chorus] to [outro]. Instrument Lifecycle: A synthetic bass pulse, tight kick/snare and one recurring warped melodic motif form the spine. Guitars or piano can appear as contrast, while choruses add wider synth layers without washing out the rhythm. Section Directives: [intro]: Begin with one unsettling hook, dry percussion or a filtered texture and expose the vocal quickly. [verse]: Keep the arrangement lean, syncopated and slightly claustrophobic; let lyrical character dominate. [chorus]: Hit with a larger bass image, stronger drums and a clear melodic hook while retaining the darker palette. [bridge]: Fracture the groove, thin the harmony and create a brief uncanny vacuum before the final rebuild. [post-chorus]: Use a short chopped or repeated motif as a punctuation mark, not a new section of maximal production. [outro]: Drop back to the strange opening texture and let the final vocal or motif end abruptly. Groove & Foundation Progression: All transitions must remain native to the stated genre. Preserve recognisable motifs across repeated sections while changing density, register, voicing or articulation. Keep the target genre dominant throughout.
