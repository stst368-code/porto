story:
caption: |-
  Global Metadata
  Basic Attributes: French House / Filter Disco, roughly 122–128 BPM, tightly looped, physical and hypnotic with sample-like chord stabs and an unwavering club pulse. Global Emotional Progression: Present a bleakly comic cycle of balls lost to water, trapped in jaws and swallowed by forces far larger than the dog pursuing them as a groove-led dance-floor narrative. Establish the bass-and-drum pulse immediately, keep verses lean enough for the words to remain intelligible, and use pre-choruses to create unmistakable harmonic and rhythmic lift. Choruses should open into wider harmony, stronger bass movement and more communal vocal energy while preserving the same central hook. Any bridge or instrumental section should thin to the essential groove before rebuilding. The final chorus reaches maximum density without changing genre or turning into a festival-style drop. Application Scenarios & Imagery: an absurd apocalyptic landscape where every tennis ball is doomed and the chase begins again anyway. Sonics & Production Profile: Solid four-on-the-floor kick, rubbery bass, filtered disco-chord loop, bright open hi-hats, compressed drum bus and sweeping low-pass/high-pass movement. The mix should pump rhythmically and feel tactile. Avoid trance leads, festival EDM drops and unrelated cinematic layers.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male), a dark low register with strong rhythmic articulation and enough range to move from restrained narration to violent emphasis. Vocal Style: Keep vocals rhythmically precise and comparatively dry. Verses may be more clipped and loop-aware; hooks should become memorable through repetition and doubling rather than huge melodic ornament. Harmony/Backing Vocals: Use short doubles, filtered backing fragments and selective stacked phrases in choruses; do not bury the lead in a choir. Role Continuity: Maintain one male identity; use doubles or group shouts only at structural peaks. Vocal FX: Firm compression, subtle saturation and tempo-synced delay; occasional filter or telephone treatment can mark transitions, but intelligibility remains primary.
  Arrangement
  Section Timeline: [intro] → [verse] → [chorus] → [post-chorus] → [verse] → [bridge] → [chorus] → [post-chorus] → [verse] → [instrumental] → [chorus] → [post-chorus] → [outro]. Instrument Lifecycle: A filtered chord loop, kick, bass and hi-hat are the permanent engine. Arrangement evolution comes from opening filters, muting layers, changing sample register and adding short percussion accents rather than introducing many new instruments. Section Directives: [intro]: Begin with the chord loop heavily filtered, then introduce kick and bass in stages before the vocal settles. [verse]: Hold a constrained loop with strong negative space and small filter motion under the vocal. [chorus]: Fully open the chord loop, widen the vocal doubles and let the pumping mix reach maximum brightness. [bridge]: Drop the kick or heavily low-pass the entire mix to create a vacuum, then rebuild mechanically. [post-chorus]: Repeat one hook over the open groove, then close the filter to reset. [outro]: Close the filter progressively and leave the core loop disappearing into compression and room tone. Groove & Foundation Progression:
