caption: |
  Global Metadata
  Basic Attributes: Late-Romantic / Expressionist Orchestral Horror, roughly 102–116 BPM with unstable local pacing, chromatic semitone pressure, tritone tension and psychologically abrupt dynamic shifts. Global Emotional Progression: Rebuild the supplied song completely inside this style while preserving its narrative identity: a bleakly comic cycle of balls lost to water, trapped in jaws and swallowed by forces far larger than the dog pursuing them. Let repeated sections evolve through arrangement, register and intensity. Application Scenarios & Imagery: an absurd apocalyptic landscape where every tennis ball is doomed and the chase begins again anyway. Sonics & Production Profile: Full acoustic orchestra with sul ponticello strings, low woodwinds, E-flat clarinet, bass trombone, timpani, tam-tam and selective pipe organ. Preserve terrifying dynamic range and dry exposed chamber moments. No trailer drums, synth sub-bass, guitars or electronic texture.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male), a dark low register with strong rhythmic articulation and enough range to move from restrained narration to violent emphasis. Vocal Style: Use dramatic classical phrasing capable of moving from intimate recitative to sudden operatic attack. Keep character changes in articulation, register and dynamics rather than distortion or novelty effects. Harmony/Backing Vocals: Choir or ensemble responses should appear only at major confrontations, often in clustered or severe harmonic voicings rather than comforting triads. Role Continuity: Maintain one male identity; use doubles or group shouts only at structural peaks. Vocal FX: Natural but variable hall perspective: relatively dry and forward in recitative, suddenly enormous at orchestral eruptions.
  Arrangement
  Section Timeline: [intro] to [verse] to [chorus] to [verse] to [bridge] to [chorus] to [post-chorus] to [verse] to [instrumental] to [chorus] to [outro]. Instrument Lifecycle: A jagged chromatic motif should recur across strings, woodwinds, brass and organ. Verses remain unstable and chamber-like; climaxes erupt into full orchestral mass with deliberate gaps afterward. Section Directives: [intro]: Reveal an incomplete chromatic motif through exposed strings and low woodwind, leaving uneasy silence around it. [verse]: Use irregular chamber attacks, tremolo or col legno strings and unstable counter-lines under the voice. [chorus]: Erupt into brass clusters, aggressive strings and percussion, then create sudden holes rather than a continuous wall of sound. [bridge]: Fracture pacing with free recitative, exposed intervals and unexpected orchestral interruptions. [post-chorus]: Leave a short dissonant afterimage in strings or organ before the next section. [outro]: Deny easy major-key release; finish on an unresolved, frightening acoustic sonority or abrupt cutoff. Groove & Foundation Progression: All transitions must remain native to the stated genre. Preserve recognisable motifs across repeated sections while changing density, register, voicing or articulation. Keep the target genre dominant throughout.
