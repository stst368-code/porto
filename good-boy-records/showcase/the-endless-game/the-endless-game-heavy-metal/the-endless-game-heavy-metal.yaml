caption: |-
  [Global Metadata]
  Genre: Heavy Death Metal, Technical Death Metal
  BPM: 240
  Key: C Minor
  Mood: Aggressive, dark, chaotic, brutal, apocalyptic
  Production Profile: Raw, heavy, wall of sound, modern high-fidelity metal production
  [Vocal Details]
  Vocal Gender & Timbre: Male, guttural, deep growls
  Vocal Style: Low-register guttural death growls, intense rhythmic delivery, piercing high-pitched shrieks for accentuation and peak emotional impact, rapid-fire aggressive pacing
  Harmony/Backing Vocals: Dual-vocal attack, layered deep growls with high-pitched shrieks in the chorus, demonic background echoes and reverb, distortion
