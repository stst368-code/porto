caption: |
  Global Metadata
  Basic Attributes: Golden-Era East Coast Hardcore Hip-Hop / Jazz-Funk Sample Aesthetic, roughly 150–156 BPM or a heavy half-time feel, urgent, swaggering and breakbeat-driven. Global Emotional Progression: Rebuild the supplied song completely inside this style while preserving its narrative identity: a bleakly comic cycle of balls lost to water, trapped in jaws and swallowed by forces far larger than the dog pursuing them. Let repeated sections evolve through arrangement, register and intensity. Application Scenarios & Imagery: an absurd apocalyptic landscape where every tennis ball is doomed and the chase begins again anyway. Sonics & Production Profile: Hard chopped breakbeat, thick sampled kick/snare, gritty bass loop, dark jazz-funk or brass sample fragments, turntable-style cuts and restrained vinyl texture. Keep the production punchy and sample-led. Avoid glossy trap hi-hats, EDM synths and modern pop chord washes.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male), a dark low register with strong rhythmic articulation and enough range to move from restrained narration to violent emphasis. Vocal Style: Use controlled, rhythmically exact rap delivery with strong consonants and confidence. Hooks should become more collective or chant-like, not conventionally sung unless the supplied song already requires melody. Harmony/Backing Vocals: Use short gang responses, doubled final words and occasional sampled vocal stabs. Keep the lead dominant. Role Continuity: Maintain one male identity; use doubles or group shouts only at structural peaks. Vocal FX: Dry compression, subtle saturation and very short room; occasional filtered or telephone effect for a transition only.
  Arrangement
  Section Timeline: [intro] to [verse] to [chorus] to [verse] to [bridge] to [chorus] to [post-chorus] to [verse] to [chorus] to [post-chorus] to [outro]. Instrument Lifecycle: A breakbeat and bass loop form the permanent spine. One or two chopped jazz/funk motifs recur as identity markers; arrangement growth comes from sample mutes, drum fills and added response layers rather than harmonic overproduction. Section Directives: [intro]: Open with a chopped sample, spoken fragment or filtered beat tease before the full break lands. [verse]: Keep the beat hard and repetitive so the vocal cadence creates most of the variation. [chorus]: Add gang vocals, stronger bass and the fullest sample stack while retaining the same breakbeat identity. [bridge]: Reduce to drums and bass or a single ominous sample, then rebuild through cuts and response shouts. [post-chorus]: Use a short cut, scratch-like punctuation or repeated phrase over the beat. [outro]: Strip samples away until the break or one final vocal cut ends the track abruptly. Groove & Foundation Progression: All transitions must remain native to the stated genre. Preserve recognisable motifs across repeated sections while changing density, register, voicing or articulation. Keep the target genre dominant throughout.
