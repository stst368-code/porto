story:
caption: |-
  Global Metadata
Basic Attributes: locked club groove, roughly 122–128 BPM. French House / Filter Disco. Build a tightly looped electronic dance track around filtered chord samples, rubbery bass and an unwavering four-on-the-floor kick. The song should feel playful, physical and hypnotic: verses ride a deliberately constrained loop, choruses open the filter and widen the harmonic field, the bridge drops into a low-pass vacuum, and the final return arrives with maximum brightness. Imagine a small club at 2 a.m., strobes catching haze and hands in the air. Production should be compressed, saturated and rhythmically exact, with strong sidechain movement and tactile filter automation. Avoid live-rock drumming, country textures, orchestral scoring, trap hats and 1970s pastiche strings.
Vocal Details
Vocal Gender & Timbre: Singer A (Male), a smooth light tenor with rhythmic pop precision and a slightly detached club-era coolness. Vocal Style: Keep lead phrases concise and groove-locked. Verses stay dry and close; choruses can use doubled lead and a small vocoder-like supporting layer without obscuring words. Repeated phrases may be rhythmically chopped only between sung lines, not in place of them. Use short plate reverb, filtered delay and subtle saturation; avoid giant vocal stacks. Keep the same lead identity across repeated sections so the performance feels continuous rather than recast between verses.
Arrangement
Section Timeline: [intro] to [verse] to [instrumental] to [verse] to [solo] to [verse] to [instrumental] to [bridge] to [instrumental] to [outro]. Instrument Lifecycle / Groove / Texture: Start with filtered chord loop, kick and a small percussion tick. Verses add bass, clap and short guitar-like or sample-like rhythmic chops. Pre-choruses automate filter resonance upward while reducing low-end momentarily. Choruses fully open the harmonic loop, strengthen bass, add wider claps and bright high-frequency percussion. Instrumental sections become controlled filter rides and bass variations rather than melodic solos. The bridge low-passes nearly everything, leaving kick pulse and a distant vocal texture, then reintroduces bass and chords in stages. Final chorus maintains the full open spectrum before a DJ-friendly reduction or hard stop. Establish the signature texture immediately and leave clear room for the first vocal entrance. Keep the lead intelligible and let the core groove carry the narrative without unnecessary density. Develop an existing motif using the featured instruments of this style instead of inserting an unrelated Keep transitions connected so changes in density, register and instrumentation clearly serve the section change.
