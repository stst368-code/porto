caption: |-
  Global Metadata
  Dark theatrical alternative pop with hyperpop detail, trap-informed rhythm and sinister bubblegum contrast, while retaining its live-guitar momentum, band energy and direct chorus lift. Preserve the song’s recognisable melodic shape and personality while rebuilding it around synthetic aggression and exaggerated pop contrast. Open intimate and almost playful, allowing the song’s humour, menace or vulnerability to read clearly. Make the verses feel character-led and conversational, then enlarge the choruses into dramatic pop set-pieces. The bridge should expose a stranger or more vulnerable colour before the final chorus returns with exaggerated confidence and a slightly unhinged celebratory finish. Use deep but controlled sub-bass, punchy hybrid acoustic/electronic drums, detuned keys, glassy synth details, occasional distorted guitar or bass accents and deliberately artificial ear-candy. Keep the central vocal dry enough to feel physically close while the choruses widen around it. Prefer unusual transitions, reversed breaths and small pitch-warped details over constant maximalism.
  Vocal Details
  Singer A (Male): a low-to-mid male rapper-singer with dry rhythmic precision and a controlled melodic edge.. Keep recurring performers distinct. Treat the performance as character acting inside a pop song. Verses can move between conversational speech, melodic rap and intimate singing; choruses should reveal a stronger sustained melodic voice. Backing vocals may become sugary, taunting, whispered or childlike in texture, but they must support rather than replace the lead. Keep effects selective: doubles, short delays, pitch-shifted replies and occasional saturated peaks. Preserve established singer or character hand-offs; performer identity must remain stable. Keep verse backing sparse and chorus harmonies wider.
  Arrangement
  Section Timeline: [intro] to [verse] to [instrumental] to [verse] to [solo] to [verse] to [instrumental] to [bridge] to [instrumental] to [outro]. Begin with a memorable miniature motif, then let the first verse remain lean enough for personality to dominate. Build each subsequent section by adding one clear colour at a time: bass movement, percussion detail, backing voice, distorted texture or bright synth layer. Choruses should feel hook-heavy rather than merely louder. Instrumental or solo passages reinterpret the motif with warped synths or processed source-style instruments. The bridge creates contrast through a half-time, drumless or harmonically exposed passage, followed by a final chorus that combines the sweetest backing textures with the hardest rhythm section before a concise theatrical outro. Retain at least one audible fingerprint from the song’s existing rock palette, processed to belong inside the new electronic production.
