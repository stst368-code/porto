caption: |
  Global Metadata
  Basic Attributes: roughly 68–92 BPM with flexible accelerations. Dark Balkan Mountain Folk / Ritual Folk. Build a dark Balkan-rooted folk arrangement from bowed strings, frame drum, tapan-like bass drum, accordion, clarinet and raw ensemble voices. Keep the harmony modal, spacious and slightly ritualistic. The groove may begin heavy and measured, then accelerate through asymmetric-feeling subdivisions or denser ornamentation without turning into modern folk-rock. Production should feel like a live room or stone hall. Avoid synth bass, EDM effects, country twang and orchestral-film-score gloss.
  Global Emotional Progression: Build the treatment around a deliberately oversized theatrical dog rhapsody that jumps between confession, melodrama, comedy and defiant release. Establish the character clearly at the start, increase scale or rhythmic pressure as the lyric develops, and make the final major section the earned peak.
  Application Scenarios & Imagery: A tiny domestic crisis performed as though it belongs on the largest stage imaginable, with sudden shifts between intimacy and ridiculous grandeur.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male), an agile dramatic tenor with a resonant lower register, clear diction, strong sustained upper notes and convincing character-acting ability.
  Vocal Style: Treat each movement as a new dramatic colour while keeping the same singer recognisable. Early lines are intimate and vulnerable; later ensemble-like exchanges become quicker and more theatrical; the bridge turns openly defiant before the final release. Keep the established lead recognisable but allow stronger folk projection, ornamented turns and rhythmic declamation. Fast or comic phrases should remain text-clear. Use small-group unison, drone harmony or antiphonal replies at structural peaks rather than lush pop stacks.
  Harmony/Backing Vocals: Use supporting voices only where the lyric already implies replies or ensemble reactions. They may become elaborate at the central theatrical peak but must remain clearly separated from the lead.
  Arrangement
  Section and Energy Progression: The song is through-composed rather than chorus-led: intro, narrative verses, instrumental links, a solo, a dense theatrical middle movement, bridge, final instrumental release and outro. Preserve that changing-movement logic.
  Instrument Lifecycle / Groove / Texture: Open with a lone bowed or reed motif and low drum. Add accordion drone and plucked or bowed rhythmic support under the first section. Increase percussion and ensemble replies as the lyric intensifies. Instrumental moments should trade clarinet, fiddle and accordion phrases. Pull to a low vocal drone and frame drum for one contrast point, then return with the full folk ensemble, heavier tapan pulse and the widest group response.
  Keep transitions native to the chosen genre and derived from the existing instruments. Preserve clear space around dense words, jokes, named characters and narrative turns. Do not let cross-genre decoration blur the style.
