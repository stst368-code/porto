caption: |-
  Global Metadata
  Basic Attributes: broad lyrical tempo, roughly 68–84 BPM. Late-Romantic Symphony / Operatic Ballad. Build the song as a sweeping nineteenth-century-style dramatic scena with long melodic arcs, rich chromatic harmony and a full symphonic palette. Open in private, fragile introspection, expand through increasingly passionate verses, and allow choruses to surge into broad emotional release rather than rhythmic aggression. The bridge should suspend time with exposed harmony before the final chorus becomes the grandest statement. Imagine an opera house at dusk, deep velvet, warm wood and a full orchestra breathing with the singer. Preserve wide natural dynamics and detailed orchestral depth. Avoid modern pop drums, electronic textures, trailer percussion, metal guitars and Baroque motor rhythm.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male), a resonant romantic tenor with rounded vowels, expressive legato and a strong but elegant upper register. Vocal Style: Shape verses with legato storytelling and restrained vibrato, allowing rubato around emotionally important phrases. Choruses broaden into full supported tone with longer sustained notes. Backing voices, if used, should be a small operatic ensemble entering only at the largest returns. The bridge should feature the most intimate dynamic. Use only concert-hall ambience and natural vocal bloom. Keep the same lead identity across repeated sections so the performance feels continuous rather than recast between verses.
  Arrangement
  Section Timeline: [intro] to [verse] to [pre-chorus] to [chorus] to [post-chorus] to [verse] to [pre-chorus] to [chorus] to [solo] to [instrumental] to [bridge] to [instrumental] to [chorus] to [outro]. Instrument Lifecycle / Groove / Texture: Begin with divided strings and a single woodwind colour. Verses grow through clarinet, oboe, horn and warm lower strings, keeping percussion absent or extremely light. Pre-choruses increase harmonic tension with tremolo strings and rising inner voices. Choruses release into full strings, horns, restrained trumpets, timpani and sweeping woodwind counterlines. Instrumental passages should hand the melody between solo cello, violin and woodwinds. The bridge reduces to harp, low strings and one solo instrument, then the orchestra rebuilds in long crescendos. Reserve full brass and cymbal weight for the final chorus. The outro resolves with a slow orchestral cadence and lingering strings. Establish the signature texture immediately and leave clear room for the first vocal entrance. Keep the lead intelligible and let the core groove carry the narrative without unnecessary density. Increase tension through register, harmony or rhythmic density while withholding the full release. Deliver the clearest Keep transitions connected so changes in density, register and instrumentation clearly serve the section change.
lyrics: |
  [intro]
  Beyond the garden...
  Beyond the gate...
  There lies...
  The ball.
  [verse]
  At first light she rises
  Golden fire upon her crown
  Doja surveys her kingdom
  Not a pawprint goes unfound
  From the fortress of the sofa
  To the borders of the lawn
  Every treat belongs unto her
  By the ancient golden law
  But a shadow shakes the hallway
  Something mighty has awoke
  Bam Bam comes like rolling thunder
  Through a table made of oak
  BAM! BAM!
  One thought burns within him
  One command controls his fate
  [pre-chorus]
  He has heard the sacred bouncing
  From somewhere beyond the gate!
  [chorus]
  THE BALL BEYOND THE GATE!
  He can hear it calling!
  THE BALL BEYOND THE GATE!
  Through the darkness falling!
  Rain and thunder!
  Wind and flame!
  Throw it once
  He'll run again!
  No wall can hold him!
  No law can wait!
  BAM BAM RIDES
  FOR THE BALL BEYOND THE GATE!
  [post-chorus]
  Woah-oh-oh!
  Woah-oh-oh!
  [verse]
  Doja watches from her kingdom
  With contempt upon her face
  "Have some dignity, you creature,
  There are standards in this place."
  Bam Bam hears but does not answer
  For his destiny is clear
  There are tennis balls in peril
  And a retriever knows no fear
  Then a name comes through the darkness
  And the music falls away
  Teddy...
  Bam Bam freezes
  Doja rises
  Someone's gonna pay
  [pre-chorus]
  Golden fur stands in the moonlight
  Ancient rivals meet once more
  Doja sighs and shows her daggers
  Boys are such a fucking chore.
  [chorus]
  THE BALL BEYOND THE GATE!
  He can hear it calling!
  THE BALL BEYOND THE GATE!
  Through the darkness falling!
  Rain and thunder!
  Wind and flame!
  Lose the ball
  He'll find again!
  No wall can hold him!
  No law can wait!
  BAM BAM RIDES
  FOR THE BALL BEYOND THE GATE!
  [solo]
  [instrumental]
  Do-ja...
  Do-ja...
  [bridge]
  I need no prophecy
  I need no throne
  Every chair within this house
  Is already mine alone
  I do not beg for glory
  I do not chase or wait
  But Mama has the treat bag...
  So open up the gate.
  OPEN THE GATE!
  [instrumental]
  [chorus]
  THE BALL BEYOND THE GATE!
  NOW THE GOLDENS ARE RUNNING!
  THE BALL BEYOND THE GATE!
  AND THE MORNING IS COMING!
  Golden thunder!
  Flying mane!
  Throw it once!
  THROW IT AGAIN!
  Doja leads them!
  Bam won't wait!
  TWO GOLDENS RIDE
  FOR THE BALL BEYOND THE GATE!
  THROW!
  IT!
  AGAIN!
  THROW!
  IT!
  AGAIN!
  [outro]
  Bam Bam, bring it back.
  BALL!
  Woof.