caption: |-
  Global Metadata
  Basic Attributes: Atmospheric Black Metal / metal fusion. Retain approximately 172 BPM, 4/4. The song must remain recognisably descended from its metal arrangement. Use atmospheric black metal: tremolo-picked guitars, cold open voicings, rapid live drums with blast-beat or double-time passages, lean bass and stark spatial depth. Keep the source chord movement or lead contour traceable beneath the colder surface. Global Emotional Progression: Begin distant and ominous, let the verses become wind-driven and severe, then make the major hooks broader rather than merely faster. Hollow out the bridge or middle passage before the final bleak full-band return. Sonics & Production Profile: Use colder, rougher production with sharp guitar presence, natural drum aggression and long dark room tails. Preserve articulation; avoid unusable lo-fi murk, djent precision and glossy arena sheen.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male), retaining the source role with a resonant tenor/baritone core and controlled grit. Retain the source tenor lift on melodic peaks. Keep spoken and character roles clearly distinct from sung or harsh layers. Retain recognisable backing-response behaviour where the source uses ensemble vocals. Vocal Style: Allow a harsh rasp or high scream as an added delivery layer while preserving source gender, roles and melodic identity. Important hooks may retain clean singing or clean doubles. Verses should preserve the source rhythmic or narrative delivery and recurring performers must remain stable. Harmony/Backing Vocals: Use doubles, harmony, gang responses or harsh layers only at clear structural peaks. Vocal FX: restrained saturation, compression and section-appropriate room or hall ambience.
  Arrangement
  Section Timeline: [intro] to [verse] to [pre-chorus] to [chorus] to [post-chorus] to [verse] to [pre-chorus] to [chorus] to [solo] to [instrumental] to [bridge] to [instrumental] to [chorus] to [outro]. Instrument Lifecycle: Preserve the original rap cadence, negative space and low-end swagger; riffs should behave like a live-band translation of the beat rather than burying the rhythmic vocal identity under constant guitar density. Let guitar, bass and live drums progressively assume more of the foundation without erasing the source motif. Build verses from interlocking tremolo figures and fast percussion with gaps around the vocal. Widen choruses with sustained second-guitar harmony and cymbal wash. Use existing instrumental sections for bleak melodic leads or exposed source instruments; reduce drums and guitar density sharply in the bridge. Groove & Foundation Progression: Preserve the underlying pulse through double-time or blast subdivisions. Change riff articulation and density between sections instead of holding one wall of sound throughout. Embellishments, Textures & Spatial FX: Use feedback, cymbal swells, reverb tails and source-specific colour for transitions; avoid unrelated electronic risers or impacts.
lyrics: |
  [intro]
  Beyond the garden...
  Beyond the gate...
  There lies...
  The ball.
  [verse]
  At first light she rises
  Golden fire upon her crown
  Doja surveys her kingdom
  Not a pawprint goes unfound
  From the fortress of the sofa
  To the borders of the lawn
  Every treat belongs unto her
  By the ancient golden law
  But a shadow shakes the hallway
  Something mighty has awoke
  Bam Bam comes like rolling thunder
  Through a table made of oak
  BAM! BAM!
  One thought burns within him
  One command controls his fate
  [pre-chorus]
  He has heard the sacred bouncing
  From somewhere beyond the gate!
  [chorus]
  THE BALL BEYOND THE GATE!
  He can hear it calling!
  THE BALL BEYOND THE GATE!
  Through the darkness falling!
  Rain and thunder!
  Wind and flame!
  Throw it once
  He'll run again!
  No wall can hold him!
  No law can wait!
  BAM BAM RIDES
  FOR THE BALL BEYOND THE GATE!
  [post-chorus]
  Woah-oh-oh!
  Woah-oh-oh!
  [verse]
  Doja watches from her kingdom
  With contempt upon her face
  "Have some dignity, you creature,
  There are standards in this place."
  Bam Bam hears but does not answer
  For his destiny is clear
  There are tennis balls in peril
  And a retriever knows no fear
  Then a name comes through the darkness
  And the music falls away
  Teddy...
  Bam Bam freezes
  Doja rises
  Someone's gonna pay
  [pre-chorus]
  Golden fur stands in the moonlight
  Ancient rivals meet once more
  Doja sighs and shows her daggers
  Boys are such a fucking chore.
  [chorus]
  THE BALL BEYOND THE GATE!
  He can hear it calling!
  THE BALL BEYOND THE GATE!
  Through the darkness falling!
  Rain and thunder!
  Wind and flame!
  Lose the ball
  He'll find again!
  No wall can hold him!
  No law can wait!
  BAM BAM RIDES
  FOR THE BALL BEYOND THE GATE!
  [solo]
  [instrumental]
  Do-ja...
  Do-ja...
  [bridge]
  I need no prophecy
  I need no throne
  Every chair within this house
  Is already mine alone
  I do not beg for glory
  I do not chase or wait
  But Mama has the treat bag...
  So open up the gate.
  OPEN THE GATE!
  [instrumental]
  [chorus]
  THE BALL BEYOND THE GATE!
  NOW THE GOLDENS ARE RUNNING!
  THE BALL BEYOND THE GATE!
  AND THE MORNING IS COMING!
  Golden thunder!
  Flying mane!
  Throw it once!
  THROW IT AGAIN!
  Doja leads them!
  Bam won't wait!
  TWO GOLDENS RIDE
  FOR THE BALL BEYOND THE GATE!
  THROW!
  IT!
  AGAIN!
  THROW!
  IT!
  AGAIN!
  [outro]
  Bam Bam, bring it back.
  BALL!
  Woof.
