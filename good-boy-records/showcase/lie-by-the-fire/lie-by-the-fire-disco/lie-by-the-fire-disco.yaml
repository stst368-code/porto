caption: |
  Global Metadata
  Basic Attributes: Late-1970s Scandinavian Disco-Pop, roughly 116–124 BPM in 4/4, urgent minor-key verses opening into bright bittersweet choruses with unmistakable dance-floor lift. Global Emotional Progression: Rebuild the supplied song completely inside this style while preserving its narrative identity: a warm fireside song about Doja and Bam Bam finally resting after their adventures, affectionate rather than sentimental. Let repeated sections evolve through arrangement, register and intensity. Application Scenarios & Imagery: two golden retrievers asleep beside a low fire while the house becomes quiet and tomorrow can wait. Sonics & Production Profile: Polished period studio sound: four-on-the-floor kick, crisp hi-hat, warm melodic bass, piano, bright rhythm guitar, string ensemble and selective synth colour. Keep the groove elegant and propulsive; avoid modern EDM drops, trap drums and aggressive funk slap.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male), an intimate warm baritone-tenor with natural storytelling phrasing and gentle dynamic control. Vocal Style: Use highly melodic, emotionally direct phrasing. Verses should carry a touch of dramatic tension; choruses become broad, bright and immediately singable without losing lyrical clarity. Harmony/Backing Vocals: Use rich stacked harmonies in choruses and concise call-and-response around post-chorus moments; verses remain comparatively exposed. Role Continuity: Keep the lead close and human. Harmonies should appear only where the target style benefits from communal warmth. Vocal FX: Period-appropriate plate reverb, clean compression and modest tape saturation; keep the lead centred and harmonies spread wide.
  Arrangement
  Section Timeline: [verse] to [verse] to [chorus] to [post-chorus] to [instrumental] to [verse] to [chorus] to [post-chorus] to [bridge] to [instrumental] to [verse] to [chorus] to [post-chorus] to [outro]. Instrument Lifecycle: Four-on-the-floor drums and melodic bass run almost continuously. Piano and guitar establish the pulse; strings and bright synths arrive progressively, with the largest harmonic spread saved for choruses. Section Directives: [intro]: Start with the disco pulse, bass hook and a short piano or string figure; establish movement immediately. [verse]: Keep kick steady, bass melodic and arrangement relatively lean so tension sits in the vocal. [instrumental]: Keep the dance pulse and let strings or synths restate the hook instrumentally. [bridge]: Strip to bass, kick and filtered keys for contrast, then rebuild with a string rise. [outro]: Sustain the groove while layers peel away or finish with a confident full-band cadence. Groove & Foundation Progression: All transitions must remain native to the stated genre. Preserve recognisable motifs across repeated sections while changing density, register, voicing or articulation. Keep the target genre dominant throughout.
