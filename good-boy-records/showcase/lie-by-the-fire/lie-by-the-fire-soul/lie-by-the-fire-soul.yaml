story: An evening song, about putting the ball down and taking some rest.
caption: |
  Global Metadata: Target tempo: approximately 64 BPM. Target tonal centre: D minor. Target metre: 6/8. Genre and sonic identity: medieval bardcore, English medieval folk ballad, Dorian mode, acoustic chamber arrangement, historically inspired instrumentation, and natural unprocessed performance. Emotional arc: warm tavern ambience, pastoral storytelling, and solemn but affectionate atmosphere. Rhythmic character: gentle 6/8 rhythm should define the pocket and motion. Production profile: keep the sound stylistically coherent, dynamically believable, and free of unnecessary modernisation. Vocal Details: Base the lead and supporting vocal treatment on intimate bard vocals, modal harmony, and rustic ensemble vocals. Treat lyric control tags such as Soft Vocal as explicit performer or delivery changes; recurring named or gendered voices should remain recognisably stable. Keep lead, backing, choir, spoken, and character roles clearly separated, and use vocal effects only where they serve the stated style. Arrangement: Follow the lyric-section timeline Intro → Verse 1 → Verse 2 → Refrain → Instrumental → Verse 3 → Refrain → Bridge → Instrumental → Refrain → Outro. Section directives: Intro: solo lute; Verse 1: gentle bard vocal; Verse 2: vielle enters; Refrain: soft harmony; Instrumental: lute and recorder; Refrain: additional voices; Bridge: hurdy-gurdy drone enters; Instrumental: build frame drum, lute, vielle, recorder; Final Refrain: tavern ensemble harmonies; Outro: instruments gradually disappear; Outro: Quiet lute cadence. Instrument lifecycle: lute, vielle, recorder, hurdy-gurdy drone, medieval harp, frame drum, and hand percussion should enter, recede, and return as one evolving arrangement rather than remain as a static stack. Shape transitions through changes in density, register, articulation, percussion, and ambience so the energy curve remains clearly audible. Explicit exclusions: avoid modern cinematic orchestra, folk rock, power metal, symphonic metal, synthesizers, piano, modern drum kit, electric guitar, modern pop vocals, glossy studio production.
lyrics: |-
  [intro]
  [verse]
  Lay down beside me
  The daylight is done
  Rest now your paws
  By the fire, everyone
  No need for kingdoms
  No battles tonight
  Only two goldens
  Asleep by the light
  [verse]
  Doja, my lady
  So watchful and wise
  Firelight dancing
  Like stars in your eyes
  Bam Bam, brave hunter
  Your quest is complete
  The ball has been captured
  Now rest at my feet
  [verse]
  Stay by the fire
  Stay here awhile
  Dream of the meadows
  And morning's first mile
  Wherever we wander
  Whatever we see
  Home is wherever
  You both are with me
  [instrumental]
  [verse]
  Tomorrow the pathway
  Will call us once more
  Bam will stand waiting
  Beside the old door
  Doja will linger
  And judge us all first
  Then follow behind us
  When curiosity wins
  [verse]
  Stay by the fire
  Stay here awhile
  Dream of the meadows
  And morning's first mile
  Wherever we wander
  Whatever we see
  Home is wherever
  You both are with me
  [bridge]
  No gold from the mountain
  No jewel from the sea
  Could purchase the hours
  You've given to me
  So sleep without worry
  The watch I shall keep
  While two golden guardians
  Lie dreaming in sleep
  [instrumental]
  [verse]
  Stay by the fire
  Stay here awhile
  Tomorrow we'll wander
  Another good mile
  Through forest and meadows
  Wherever we roam
  Two golden companions
  Will always come home
  [outro]
  Rest now, Doja
  Rest, Bam Bam
  The fire burns low
  And morning will come
  Woof
