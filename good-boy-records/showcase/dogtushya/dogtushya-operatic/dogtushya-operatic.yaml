caption: |
  Global Metadata
  Basic Attributes: roughly 58–76 BPM. Gothic Sacred Organ / Dark Cathedral Organ. Minor-key, ancient, sinister and deeply unsettling. Entirely instrumental. The complete composition must be performed by one enormous cathedral pipe organ and absolutely nothing else.
  Global Emotional Progression: Begin almost motionless and ominous, with isolated low organ tones and sparse minor harmonies hanging in the darkness. Gradually introduce crawling contrapuntal movement and increasingly dissonant chord voicings. The middle sections become more obsessive and ritualistic, with repeating chromatic figures, uneasy harmonic suspensions and slow-moving pedal tones. Build toward a terrifying final passage where the organ expands into its full registration: enormous low pedal notes, dense minor chords, shrieking upper pipes and violent harmonic tension. After the climax, suddenly collapse back to a few hollow notes before ending on a deeply unresolved low chord.
  Application Scenarios & Imagery: An abandoned Gothic cathedral at midnight; immense stone columns disappearing into darkness, moonlight through broken stained glass, dust suspended in the air, and an unseen organist playing somewhere beyond the nave. The atmosphere should feel sacred but corrupted, solemn rather than theatrical, genuinely disturbing rather than campy Halloween horror.
  Sonics & Production Profile: Natural cathedral acoustics with a huge, long reverberation tail. Preserve the physical scale of a real pipe organ: subterranean pedal frequencies, woody and breathy middle registers, piercing upper ranks and audible interaction with the enormous stone space. Wide dynamic range. No cinematic sound design and no artificial horror effects.
  Vocal Details
  Instrumental: absolutely no lead vocal, spoken voice, whispering, chanting, choir, backing vocals or human vocal textures of any kind. The cathedral pipe organ alone carries melody, harmony, rhythm, bass and all dramatic development.
  Arrangement
  Instrument Lifecycle: Pipe organ only from first note to final decay. No piano, strings, brass, percussion, bells, synthesizers, pads, drones, orchestra or additional instruments. Begin using sparse low pedal stops and restrained dark registrations. Introduce increasingly complex manuals through the verses, using chromatic counterpoint, diminished intervals, tritones and unresolved suspensions. Allow occasional high-register pipe figures to emerge above the sustained lower voices like distant screams, but they must remain recognisably acoustic organ pipes.
  Groove & Foundation Progression: No drums and no conventional rhythmic section. Momentum comes entirely from organ phrasing: repeating pedal figures, increasingly active contrapuntal lines, accelerating chord changes and changes of registration. Avoid cheerful Baroque virtuosity. The performance should feel deliberate, oppressive and ritualistic.
  Embellishments, Textures & Spatial FX: All texture must originate naturally from the pipe organ and cathedral itself: mechanical attack, pipe breath, overlapping reverberation, enormous pedal resonance and registration changes. The climax should use near-full organ registration for overwhelming physical weight before abruptly withdrawing into sparse low pipes and one final unresolved cathedral-sized chord.
lyrics: |
  [verse]
  From the throne upon the sofa,
  She surveys the land once more.
  Every hallway,
  Every doorway,
  Every rug from wall to wall.
  [verse]
  None may question,
  None oppose her,
  All rejoice beneath her reign.
  Princess Beauts,
  Great Gremlin Leader,
  Guardian of treats and praise.
  [chorus]
  Glory! Glory!
  Great Doja!
  Leader of the Pack Union!
  Strongest heart and clever mind,
  Guide us through these peaceful times!
  [chorus]
  Glory! Glory!
  Great Doja!
  Every tail now wags as one!
  Long may Princess Doja command,
  Brightest dog in all the land!
  [verse]
  When brave Chunk returns with treasure,
  Bearing forth the sacred ball,
  She accepts his humble offering,
  For the good and joy of all.
  Then with wisdom
  Beyond measure,
  She declares the royal fee:
  "One Dentastick...
  Many scratches...
  Then perhaps this ball goes free."
  Wise is Doja!
  Strong is Doja!
  Nothing happens by mistake!
  Every scheme already planned,
  Before the humans even wake!
  [bridge]
  Wise is Doja!
  Strong is Doja!
  Opossum Face forever reigns!
  Every victory was foretold,
  Inside her magnificent brain!
  [verse]
  Once there stood a mighty ladder,
  Built for humans, tall and steep.
  Others searched
  For little dog doors...
  But not Doja
  She climbed the ladder.
  The people watched in silent wonder.
  The birds forgot their songs.
  Even the Chunk looked up in awe.
  The Princess simply carried on.
  [bridge]
  Raise the banner!
  Sound the brass!
  Let the mighty chorus sing!
  [verse]
  She who conquered
  Walls at Lyme,
  She who made the Gremlin spring!
  River waters cannot tame her!
  Rain awakens glorious might!
  Digging, charging,
  Leading chaos,
  Victory in every fight!
  Should the Chunk commit misfortune,
  She need never bark or shout.
  Just one gentle nudge upon your arm...
  Justice finds him.
  [chorus]
  Glory! Glory!
  Great Doja!
  Supreme Leader of the Pack!
  Every cushion,
  Every blanket,
  Every sunny patch is hers!
  Treats are hers!
  Scratches hers!
  Walks begin upon command!
  [outro]
  Long live Princess Doja forever!
  Long live Gremlin Leader!
  Long live Doja!
  (DOJA!)
  Long live Doja!
  (DOJA!)
  Long live Doja!
  (DOJA!)