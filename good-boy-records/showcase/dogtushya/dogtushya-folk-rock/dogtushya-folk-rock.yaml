caption: |
  Global Metadata
  Basic Attributes: Late-1970s Scandinavian Disco-Pop, roughly 116–124 BPM in 4/4, urgent minor-key verses opening into bright bittersweet choruses with unmistakable dance-floor lift. Global Emotional Progression: Rebuild the supplied song completely inside this style while preserving its narrative identity: a satirical authoritarian pageant centred on Doja, balancing absurd grandeur with genuine forward momentum. Let repeated sections evolve through arrangement, register and intensity. Application Scenarios & Imagery: a vast ceremonial square gradually revealing that the supreme ruler is a very self-satisfied golden retriever. Sonics & Production Profile: Polished period studio sound: four-on-the-floor kick, crisp hi-hat, warm melodic bass, piano, bright rhythm guitar, string ensemble and selective synth colour. Keep the groove elegant and propulsive; avoid modern EDM drops, trap drums and aggressive funk slap.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male), a firm mid-range voice with clear diction and enough grit for comic authority; ensemble responses should sound disciplined rather than cartoonish. Vocal Style: Use highly melodic, emotionally direct phrasing. Verses should carry a touch of dramatic tension; choruses become broad, bright and immediately singable without losing lyrical clarity. Harmony/Backing Vocals: Use rich stacked harmonies in choruses and concise call-and-response around post-chorus moments; verses remain comparatively exposed. Role Continuity: Keep the same male lead identity across sections; when group responses appear, use a compact male ensemble rather than changing the principal singer. Vocal FX: Period-appropriate plate reverb, clean compression and modest tape saturation; keep the lead centred and harmonies spread wide.
  Arrangement
  Section Timeline: [verse] to [verse] to [chorus] to [post-chorus] to [chorus] to [post-chorus] to [verse] to [bridge] to [verse] to [bridge] to [verse] to [instrumental] to [chorus] to [post-chorus] to [outro]. Instrument Lifecycle: Four-on-the-floor drums and melodic bass run almost continuously. Piano and guitar establish the pulse; strings and bright synths arrive progressively, with the largest harmonic spread saved for choruses. Section Directives: [verse]: Keep kick steady, bass melodic and arrangement relatively lean so tension sits in the vocal. [chorus]: Bring full strings, wider harmonies and brighter piano/guitar while the four-on-the-floor groove stays locked. [bridge]: Strip to bass, kick and filtered keys for contrast, then rebuild with a string rise. [outro]: Sustain the groove while layers peel away or finish with a confident full-band cadence. Groove & Foundation Progression: All transitions must remain native to the stated genre. Preserve recognisable motifs across repeated sections while changing density, register, voicing or articulation. Keep the target genre dominant throughout.
lyrics: |
  [verse]
  From the throne upon the sofa,
  She surveys the land once more.
  Every hallway,
  Every doorway,
  Every rug from wall to wall.
  [verse]
  None may question,
  None oppose her,
  All rejoice beneath her reign.
  Princess Beauts,
  Great Gremlin Leader,
  Guardian of treats and praise.
  [chorus]
  Glory! Glory!
  Great Doja!
  Leader of the Pack Union!
  Strongest heart and clever mind,
  Guide us through these peaceful times!
  [post-chorus]
  Glory! Glory!
  Great Doja!
  [chorus]
  Glory! Glory!
  Great Doja!
  Every tail now wags as one!
  Long may Princess Doja command,
  Brightest dog in all the land!
  [post-chorus]
  Glory! Glory!
  Great Doja!
  [verse]
  When brave Chunk returns with treasure,
  Bearing forth the sacred ball,
  She accepts his humble offering,
  For the good and joy of all.
  Then with wisdom
  Beyond measure,
  She declares the royal fee:
  "One Dentastick...
  Many scratches...
  Then perhaps this ball goes free."
  Wise is Doja!
  Strong is Doja!
  Nothing happens by mistake!
  Every scheme already planned,
  Before the humans even wake!
  [bridge]
  Wise is Doja!
  Strong is Doja!
  Opossum Face forever reigns!
  Every victory was foretold,
  Inside her magnificent brain!
  [verse]
  Once there stood a mighty ladder,
  Built for humans, tall and steep.
  Others searched
  For little dog doors...
  But not Doja
  She climbed the ladder.
  The people watched in silent wonder.
  The birds forgot their songs.
  Even the Chunk looked up in awe.
  The Princess simply carried on.
  [bridge]
  Raise the banner!
  Sound the brass!
  Let the mighty chorus sing!
  [verse]
  She who conquered
  Walls at Lyme,
  She who made the Gremlin spring!
  River waters cannot tame her!
  Rain awakens glorious might!
  Digging, charging,
  Leading chaos,
  Victory in every fight!
  Should the Chunk commit misfortune,
  She need never bark or shout.
  Just one gentle nudge upon your arm...
  Justice finds him.
  [instrumental]
  [chorus]
  Glory! Glory!
  Great Doja!
  Supreme Leader of the Pack!
  Every cushion,
  Every blanket,
  Every sunny patch is hers!
  Treats are hers!
  Scratches hers!
  Walks begin upon command!
  [post-chorus]
  Glory! Glory!
  Great Doja!
  [outro]
  Long live Princess Doja forever!
  Long live Gremlin Leader!
  Long live Doja!
  (DOJA!)
  Long live Doja!
  (DOJA!)
  Long live Doja!
  (DOJA!)
