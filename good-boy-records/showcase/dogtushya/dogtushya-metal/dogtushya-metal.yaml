story:
caption: |
  Global Metadata
  Basic Attributes: fast driving metal pulse, roughly 160–190 BPM. Melodic Death Metal / Extreme Heavy Metal. Combine aggressive riffing and double-kick energy with clearly shaped twin-guitar melody. Verses should be sharp and forward-driving, choruses broaden into memorable harmonised guitar lines and a stronger vocal contour, while the bridge creates a dramatic slower contrast before the final accelerated return. Imagine a cold open-air stage, hard wind and a tightly drilled band performing with precision. Production should be dense and modern but retain real drum dynamics and audible pick attack. Keep melodic content dark and minor-key, never cheerful or power-metal triumphant. Avoid orchestral layers, electronic drops, metalcore breakdown clichés and black-metal lo-fi production.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male), a forceful male mid-range death growl with clear attack and occasional higher rasp for emphasis. Vocal Style: Verses use tightly phrased harsh vocals that follow the riff rhythm. Choruses can extend into more sustained growls with a distant low harmony or shouted group accent, but no clean pop chorus. The bridge should use the lowest and most deliberate delivery before the final return. Keep vocal processing compact: short ambience, saturation and firm compression. Keep the same lead identity across repeated sections so the performance feels continuous rather than recast between verses.
  Arrangement
  Section Timeline: [verse] → [verse] → [chorus] → [chorus] → [verse] → [bridge] → [verse] → [bridge] → [verse] → [chorus] → [outro]. Instrument Lifecycle / Groove / Texture: Twin distorted guitars introduce a harmonised melodic riff over bass and driving drums. Verses alternate palm-muted rhythmic figures with fast melodic runs. Pre-choruses raise tension through climbing harmony and denser double-kick. Choruses open into broad twin-guitar counterlines over a simpler chord foundation. Instrumental sections feature a composed dual-guitar melody or concise solo exchange. The bridge slows to tom-led half-time with sustained minor chords and exposed bass, then a rising guitar figure launches the final chorus. Finish with a harmonised terminal riff and decisive full-band stop. Keep the lead intelligible and let the core groove carry the narrative without unnecessary density. Deliver the clearest dynamic and melodic release, using the style-defining ensemble at full confidence. Create the strongest contrast in density and emotional temperature, then reconnect directly to the established motif. Keep transitions connected so changes in density, register and instrumentation clearly serve the section change.
lyrics: |
  [verse]
  From the throne upon the sofa,
  She surveys the land once more.
  Every hallway,
  Every doorway,
  Every rug from wall to wall.
  [verse]
  None may question,
  None oppose her,
  All rejoice beneath her reign.
  Princess Beauts,
  Great Gremlin Leader,
  Guardian of treats and praise.
  [chorus]
  Glory! Glory!
  Great Doja!
  Leader of the Pack Union!
  Strongest heart and clever mind,
  Guide us through these peaceful times!
  [chorus]
  Glory! Glory!
  Great Doja!
  Every tail now wags as one!
  Long may Princess Doja command,
  Brightest dog in all the land!
  [verse]
  When brave Chunk returns with treasure,
  Bearing forth the sacred ball,
  She accepts his humble offering,
  For the good and joy of all.
  Then with wisdom
  Beyond measure,
  She declares the royal fee:
  "One Dentastick...
  Many scratches...
  Then perhaps this ball goes free."
  Wise is Doja!
  Strong is Doja!
  Nothing happens by mistake!
  Every scheme already planned,
  Before the humans even wake!
  [bridge]
  Wise is Doja!
  Strong is Doja!
  Opossum Face forever reigns!
  Every victory was foretold,
  Inside her magnificent brain!
  [verse]
  Once there stood a mighty ladder,
  Built for humans, tall and steep.
  Others searched
  For little dog doors...
  But not Doja
  She climbed the ladder.
  The people watched in silent wonder.
  The birds forgot their songs.
  Even the Chunk looked up in awe.
  The Princess simply carried on.
  [bridge]
  Raise the banner!
  Sound the brass!
  Let the mighty chorus sing!
  [verse]
  She who conquered
  Walls at Lyme,
  She who made the Gremlin spring!
  River waters cannot tame her!
  Rain awakens glorious might!
  Digging, charging,
  Leading chaos,
  Victory in every fight!
  Should the Chunk commit misfortune,
  She need never bark or shout.
  Just one gentle nudge upon your arm...
  Justice finds him.
  [chorus]
  Glory! Glory!
  Great Doja!
  Supreme Leader of the Pack!
  Every cushion,
  Every blanket,
  Every sunny patch is hers!
  Treats are hers!
  Scratches hers!
  Walks begin upon command!
  [outro]
  Long live Princess Doja forever!
  Long live Gremlin Leader!
  Long live Doja!
  (DOJA!)
  Long live Doja!
  (DOJA!)
  Long live Doja!
  (DOJA!)
