caption: |
  Global Metadata
  Basic Attributes: Gothic Horror Classical / Pipe Organ. Slow-to-moderate dramatic tempo, minor and chromatic harmony, tritone tension and severe classical phrasing. The pipe organ is the defining centre of gravity, supported by chamber orchestra and dark choir; avoid metal, rock, synthwave or generic trailer scoring.
  Global Emotional Progression: The song reframes an exaggerated celebratory portrait of a clever, devious and gloriously self-important dog, with comic grandeur rather than genuine solemnity as gothic chamber horror. Begin with a restrained organ shadow, let verses accumulate chromatic unease, make refrains physically larger through pedals and choir, drive the organ solo toward the peak of tension, then finish with a severe cadential release rather than a modern cinematic boom.
  Application Scenarios & Imagery: A decaying cathedral at midnight, with pipe chambers overhead, shadowed strings and tolling bells.
  Sonics & Production Profile: Huge cathedral depth: close strings and voice against towering organ pipes and distant choir. Preserve wide dynamics from near-silence to full tuttis. Low pedals stay acoustic and physical; percussion remains sparse.
  Vocal Details
  Vocal Gender & Timbre: Lead: Singer A (Male), a firm mid-range baritone with clear diction, dry comic authority and a controlled upper edge; ensemble responses may reinforce major refrains.. Add a distant low mixed choir only at major structural peaks.
  Vocal Style: Retain the source lead identity but move the performance toward controlled classical/theatrical diction: restrained and intimate over sparse passages, then forceful and sustained at climaxes without pop runs or modern vocal processing.
  Harmony/Backing Vocals: A low mixed or male choir enters only at major peaks, using sustained minor clusters, open fifths and ominous syllabic support rather than pop harmony.
  Vocal FX: Natural cathedral reverb dominates. Lead voice remains intelligible in front of the space; organ and choir bloom into long tails. No tempo-synced delay or obvious tuning effects.
  Arrangement
  Instrument Lifecycle (Primary/Secondary): Primary: pipe organ with deep pedals, dark diapasons, reed stops and occasional bright mixtures. Secondary: low strings, bassoons, horns, timpani and tubular bell. A small dark choir appears selectively.
  Groove & Foundation Progression: Open with a sparse organ motif or pedal point. Verses use thin registrations and low strings. Choruses expand into full manuals, pedals and choir. The solo becomes a contrapuntal or toccata-like escalation, drops for the bridge, then rebuilds into the final cadence.
  Embellishments, Textures & Spatial FX: Use suspensions, chromatic inner voices, bell tolls, tremolo strings and abrupt silences. Avoid electronic drones, rock drums and distorted guitar.
  Section Continuity: The pipe organ remains the harmonic anchor throughout; quieter sections thin the registration, while climaxes add manuals, pedal, strings and choir without switching to rock or trailer music.
lyrics: |
  [verse]
  From the throne upon the sofa,
  She surveys the land once more.
  Every hallway,
  Every doorway,
  Every rug from wall to wall.
  [verse]
  None may question,
  None oppose her,
  All rejoice beneath her reign.
  Princess Beauts,
  Great Gremlin Leader,
  Guardian of treats and praise.
  [chorus]
  Glory! Glory!
  Great Doja!
  Leader of the Pack Union!
  Strongest heart and clever mind,
  Guide us through these peaceful times!
  [instrumental]
  [chorus]
  Glory! Glory!
  Great Doja!
  Every tail now wags as one!
  Long may Princess Doja command,
  Brightest dog in all the land!
  [verse]
  When brave Chunk returns with treasure,
  Bearing forth the sacred ball,
  She accepts his humble offering,
  For the good and joy of all.
  Then with wisdom
  Beyond measure,
  She declares the royal fee:
  "One Dentastick...
  Many scratches...
  Then perhaps this ball goes free."
  Wise is Doja!
  Strong is Doja!
  Nothing happens by mistake!
  Every scheme already planned,
  Before the humans even wake!
  [solo]
  [bridge]
  Wise is Doja!
  Strong is Doja!
  Opossum Face forever reigns!
  Every victory was foretold,
  Inside her magnificent brain!
  [verse]
  Once there stood a mighty ladder,
  Built for humans, tall and steep.
  Others searched
  For little dog doors...
  But not Doja
  She climbed the ladder.
  The people watched in silent wonder.
  The birds forgot their songs.
  Even the Chunk looked up in awe.
  The Princess simply carried on.
  [bridge]
  Raise the banner!
  Sound the brass!
  Let the mighty chorus sing!
  [verse]
  She who conquered
  Walls at Lyme,
  She who made the Gremlin spring!
  River waters cannot tame her!
  Rain awakens glorious might!
  Digging, charging,
  Leading chaos,
  Victory in every fight!
  Should the Chunk commit misfortune,
  She need never bark or shout.
  Just one gentle nudge upon your arm...
  Justice finds him.
  [chorus]
  Glory! Glory!
  Great Doja!
  Supreme Leader of the Pack!
  Every cushion,
  Every blanket,
  Every sunny patch is hers!
  Treats are hers!
  Scratches hers!
  Walks begin upon command!
  [outro]
  Long live Princess Doja forever!
  Long live Gremlin Leader!
  Long live Doja!
  (DOJA!)
  Long live Doja!
  (DOJA!)
  Long live Doja!
  (DOJA!)