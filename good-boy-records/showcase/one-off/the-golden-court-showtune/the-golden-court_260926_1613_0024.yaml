story:
caption: |
  Global Metadata
  Basic Attributes: bpm is 146. key is Eb, and scale is major. Industrial Techno / Cinematic Electronic.
  Global Emotional Progression: The piece opens with a foreboding, narrative-driven tension that feels cinematic and ominous. This atmosphere abruptly shatters into a high-energy, aggressive assault characterized by relentless rhythmic drive and distorted textures.
  Application Scenarios & Imagery: Ideal for dark fantasy video game trailers, cyberpunk action sequences, or immersive audio experiences depicting dystopian warfare and ancient magical breaches.
  Sonics & Production Profile: The soundstage is expansive yet heavily focused on the center channel for maximum impact, featuring a "wall of sound" aesthetic.
  Vocal Details
  Vocal Gender & Timbre: A stable theatrical ensemble: a commanding male baritone, a bright male tenor, a soaring female soprano and a mixed choir. Keep each recurring role recognisably distinct.
  Vocal Style: The delivery is strictly spoken-word, utilizing a slow, deliberate cadence with dramatic pauses to emphasize gravity. The performance remains consistent in its narrative tone throughout the intro but is treated with increasing spatial depth as the track progresses.
  Harmony/Backing Vocals: No harmonic or backing vocals are present; the vocal line stands alone as a solitary narrative element.
  Vocal FX: The voice is processed with a long-tail hall reverb and subtle delay to create a cavernous, epic atmosphere.
  Arrangement
  Instrument Lifecycle (Primary/Secondary): Primary: A massive, distorted saw-wave synthesizer bass serves as the core melodic and rhythmic driver, entering forcefully after the spoken intro and sustaining through the main drop with a repetitive, grinding motif. Secondary: Atmospheric drone pads provide the harmonic bed during the intro, fading out as the beat kicks in. Sharp, metallic synth stabs appear intermittently during the main section to accentuate the rhythm and add textural complexity.
  Groove & Foundation Progression: The track begins without percussion, relying solely on the vocal and ambient drones. Upon the transition, a hard-hitting industrial drum pattern erupts, featuring a punchy, distorted kick drum on every beat and a crisp, metallic snare/clap on the off-beats.
  Embellishments, Textures & Spatial FX: Rising white-noise sweeps and reverse cymbal effects are utilized extensively during the build-up to bridge the gap between the spoken word and the drop.
  Section Continuity: Follow the lyric macro structure in order ([intro] → [verse] → [chorus] → [instrumental] → [verse] → [bridge] → [chorus]). Keep the target genre active in every sung section; use changes in density, register, articulation and groove for contrast rather than switching to a different style.
lyrics: |
  [intro]
  Golden...
  Golden...
  [verse]
  Within these halls of crimson and gold
  A tale of two companions shall be told
  One walks in splendour, sovereign and serene
  Doja the Golden, magnificent queen
  She raises her head
  The whole court stands
  No crown is required
  She already commands
  Her eyes survey the kingdom
  Her judgment swift and true
  And should you cease the scratching...
  God have mercy upon you
  [verse]
  But hark!
  What thunder shakes the palace floor?
  What golden beast comes charging through the door?
  Bam Bam!
  Great champion!
  Defender of the ball!
  A heart as vast as England
  And scarcely thoughts at all!
  BAM BAM!
  BAM BAM!
  Cast forth the sacred tennis ball
  Across the royal green
  No knight has ever travelled
  With such velocity!
  [chorus]
  GLORY TO THE GOLDEN COURT!
  LET EVERY VOICE PROCLAIM!
  DOJA HOLDS THE GOLDEN CROWN!
  AND BAM BAM CHASES AGAIN!
  One rules with grace!
  One runs with joy!
  Golden lady!
  Golden boy!
  Let trumpets sound from wall to wall
  For Doja and for Bam Bam
  Beloved above them all!
  [instrumental]
  [verse]
  I ask for little from this world
  A comfortable throne
  A human hand to scratch my ears
  And time to sleep alone
  Yet everywhere I wander
  That creature follows me
  BALL!
  Precisely.
  Could somebody remove him, please?
  [verse]
  I love the rain!
  I love the snow!
  I heard somebody shout, "Let's go!"
  I love my Mama!
  I love my friends!
  I bring the ball
  And then...
  AGAIN!
  AGAIN!
  AGAIN!
  AGAIN!
  There is but one upon this Earth
  Whose friendship I decline...
  Teddy.
  Teddy...
  Fluff Teddy.
  [bridge]
  Two golden hearts
  Two different souls
  Together they make one home whole
  One quiet flame
  One blazing sun
  Two lives entwined
  Forever one
  Through every year
  Through every day
  May golden paws still lead the way
  [chorus]
  GLORY TO THE GOLDEN COURT!
  LET BELLS AND TRUMPETS RING!
  DOJA, QUEEN OF EVERYTHING!
  BAM BAM, FETCHING FOR THE KING!
  One rules with grace!
  One runs with joy!
  Golden lady!
  Golden boy!
  From New Mills unto Albert Hall
  Let every voice proclaim them:
  THE GREATEST GOLDENS OF THEM ALL!
  DO-JA!
  BAM-BAM!
  Woof.