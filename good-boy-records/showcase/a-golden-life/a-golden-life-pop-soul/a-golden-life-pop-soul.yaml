caption: |
  Global Metadata
  Basic Attributes: bpm is 76. key is Bb, and scale is major. Contemporary Classical / Ambient Ballad.
  Global Emotional Progression: The piece opens with a solitary, reflective atmosphere that gradually deepens into a poignant sense of longing as the string section swells.
  Application Scenarios & Imagery: Ideal for cinematic scenes depicting farewell, solitary reflection by a riverside at dusk, or moments of quiet grief and memory in a period drama.
  Sonics & Production Profile: The soundstage is intimate yet spacious, utilizing a wide stereo field for the strings while keeping the piano and vocals centered.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male), a low, rhythmically precise baritone/rap lead; Singer B (Female), a breathy melodic supporting voice. Keep both identities stable when they alternate or overlap.
  Vocal Style: The performance is characterized by a restrained, storytelling delivery that relies heavily on breath control and subtle dynamic shifts rather than power.
  Harmony/Backing Vocals: No distinct backing vocals or harmonic layers are present; the vocal line remains a singular, unaccompanied melody against the instrumental bed, reinforcing the theme of solitude.
  Vocal FX: The vocal is treated with a lush, long-tail hall reverb that blends the voice into the ambient space created by the strings, creating an ethereal, distant effect.
  Arrangement
  Instrument Lifecycle (Primary/Secondary): Primary: A grand piano with a felted, soft tone serves as the harmonic backbone, playing arpeggiated figures and sustained chords from the very beginning to the end. Secondary: A solo cello enters shortly after the intro, providing a mournful counter-melody that weaves around the piano.
  Groove & Foundation Progression: There is no percussive groove or rhythmic foundation; the tempo is driven entirely by the rubato phrasing of the piano and the expressive bowing of the strings, creating a free-flowing, timeless feel.
  Embellishments, Textures & Spatial FX: Subtle atmospheric synth pads underpin the arrangement, adding a low-frequency warmth and depth that is felt more than heard.
  Section Continuity: Follow the lyric macro structure in order ([verse] → [chorus] → [instrumental] → [verse] → [chorus] → [bridge] → [outro]). Keep the target genre active in every sung section; use changes in density, register, articulation and groove for contrast rather than switching to a different style.
