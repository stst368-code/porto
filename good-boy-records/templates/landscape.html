<style>

.stage{position:relative;min-height:0;overflow:hidden;border-bottom:2px solid #312116;cursor:grab}.stage.is-panning{cursor:grabbing}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;inset:0;pointer-events:none}.brand{position:absolute;left:18px;top:14px;color:#bfa98b;font:800 10px/1.3 "Courier New",monospace;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 1px #000}.axis-guide{position:absolute;left:18px;top:40px;z-index:18;padding:6px 8px;border:1px solid #ffffff12;background:#050505a8;color:#8d806f;font:800 7px/1.45 "Courier New",monospace;letter-spacing:.08em;text-transform:uppercase;pointer-events:none;backdrop-filter:blur(5px)}.axis-guide b{color:#d8c5a7;font-weight:900}.axis-guide span{display:block}.genre-label{position:absolute;right:18px;top:14px;text-align:right}.genre-strip{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;gap:4px;max-width:70vw;overflow-x:auto;padding:2px;pointer-events:auto;scrollbar-width:none}.genre-strip::-webkit-scrollbar{display:none}.genre-chip{border:1px solid #ffffff16;background:#090a09cc;color:#968672;padding:5px 7px;border-radius:2px;font:800 7px/1 "Courier New",monospace;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap}.genre-chip:hover,.genre-chip.active{color:#f0dfc5;border-color:var(--accent);box-shadow:inset 0 0 12px rgba(var(--accent-rgb),.16)}.map-tip{position:absolute;z-index:20;display:none;pointer-events:none;max-width:250px;padding:8px 10px;border:1px solid #6c5037;background:#060504ec;box-shadow:0 12px 28px #000b;color:#e9dece;font:700 12px/1.1 Georgia,serif}.map-tip small{display:block;margin-top:4px;color:var(--accent);font:800 8px/1.2 "Courier New",monospace;letter-spacing:.08em;text-transform:uppercase}.genre-label strong{display:block;color:#eadfce;font:700 13px/1.1 Georgia,serif}.genre-label small{display:block;margin-top:4px;color:var(--accent);font:800 9px/1 "Courier New",monospace;letter-spacing:.13em;text-transform:uppercase}

.lyrics{width:100%;padding:12px 18px 11px;background:rgba(3,3,3,.74);border:1px solid rgba(var(--accent-rgb),.34);border-radius:4px;text-align:center;color:#e8dbc8;font:700 clamp(20px,2.05vw,31px)/1.22 Georgia,serif;white-space:normal;overflow:visible;backdrop-filter:blur(8px);text-shadow:0 2px 8px #000;box-shadow:0 0 0 1px rgba(255,255,255,.04),0 0 26px rgba(var(--accent-rgb),.12)}.lyrics .karaoke-current{display:block}.lyrics .karaoke-next{display:block;margin-top:6px;color:rgba(var(--accent-rgb),.72);font-size:.52em;font-weight:600;min-height:1.2em}.lyrics .word{transition:color .08s ease,text-shadow .08s ease,opacity .08s ease}.lyrics .word.current{color:rgb(var(--accent-rgb));text-shadow:0 0 14px rgba(var(--accent-rgb),.50),0 2px 6px #000}.lyrics .word.past{color:#efe3ce}.lyrics .word.future{color:#b8ab98;opacity:.92}

.hardware{display:grid;grid-template-columns:120px 122px 170px minmax(170px,.7fr) minmax(220px,1fr) auto;gap:8px;align-items:stretch;padding:7px 10px calc(7px + env(safe-area-inset-bottom));background:linear-gradient(#20201e,#0e0f0e 46%,#080909);box-shadow:inset 0 1px #4a4035,inset 0 -1px #000;border-top:1px solid #6b4b31}
.module{position:relative;min-width:0;border:1px solid #3d352d;background:linear-gradient(180deg,#191a18,#0b0c0b);box-shadow:inset 0 1px rgba(255,255,255,.035),0 2px 8px #0008;padding:6px}.legend{position:absolute;left:7px;top:5px;color:#806e5a;font:800 7px/1 "Courier New",monospace;letter-spacing:.14em;text-transform:uppercase}
.power-module{display:flex;align-items:center;justify-content:center;padding-top:15px}.power{width:78px;height:42px;border:1px solid #6d543d;border-radius:3px;background:linear-gradient(#262621,#11120f);box-shadow:inset 0 0 0 2px #080907,0 3px 7px #000;color:#9d8b73;font:900 10px/1 "Courier New",monospace;letter-spacing:.1em;cursor:pointer}.power[aria-pressed="true"]{color:#ffb24e;text-shadow:0 0 8px #ff8a22;box-shadow:inset 0 0 0 2px #080907,inset 0 0 18px #a54f0b66,0 3px 7px #000}.power:active{transform:translateY(1px)}
.knob-module{display:flex;gap:14px;align-items:end;justify-content:center;padding-top:12px}.knob-wrap{text-align:center}.knob{--v:.5;position:relative;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#777066,#3b3934 32%,#171815 70%,#090a09);border:1px solid #82715f;box-shadow:inset 0 0 0 3px #161714,0 3px 7px #000;cursor:ns-resize;touch-action:none}.knob::before{content:"";position:absolute;left:50%;top:5px;width:2px;height:15px;background:#e0c59e;transform-origin:50% 19px;transform:translateX(-50%) rotate(calc(-135deg + var(--v) * 270deg));box-shadow:0 0 3px #000}.knob-wrap small{display:block;margin-top:5px;color:#a08c73;font:800 7px/1 "Courier New",monospace;letter-spacing:.09em}.knob-value{display:none}
.vu-module{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding-top:15px}.vu{position:relative;height:64px;border:1px solid #66533e;background:linear-gradient(#d3c3a3,#b9aa8d);box-shadow:inset 0 0 12px #634b2d66}.vu::before{content:"-20   -10    -3    0   +3";position:absolute;left:5px;right:5px;top:6px;color:#4b4033;font:700 6px/1 "Courier New",monospace;word-spacing:1px;white-space:pre}.needle{position:absolute;left:50%;bottom:7px;width:1px;height:39px;background:#c0241b;transform-origin:50% 100%;transform:rotate(-43deg);transition:transform .045s linear;box-shadow:0 0 1px #000}.vu small{position:absolute;bottom:3px;left:0;right:0;text-align:center;color:#5b4b3b;font:800 6px/1 "Courier New",monospace;letter-spacing:.12em}
.transport-module{display:grid;grid-template-columns:auto minmax(130px,1fr);grid-template-rows:1fr auto;gap:4px 9px;padding-top:14px}.transport{display:flex;align-items:center;gap:5px}.hw-button{min-width:40px;height:38px;border:1px solid #685039;border-radius:3px;background:linear-gradient(#34322d,#171816);box-shadow:inset 0 1px #5c564d,0 2px 4px #000;color:#cbbb9f;cursor:pointer;font:900 13px/1 Arial}.hw-button.main{width:50px;height:44px;color:#f4dfbd}.hw-button.active{color:#ffb24e;box-shadow:inset 0 0 12px #b45a1555,0 2px 4px #000}.hw-button:active{transform:translateY(1px)}.meta{min-width:0;align-self:center}.meta strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e6d9c7;font:700 13px/1.1 Georgia,serif}.meta span{display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#947f64;font:800 8px/1 "Courier New",monospace;letter-spacing:.08em}.seek{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.spectrum-module{position:relative;padding:15px 5px 4px}.spectrum-module canvas{display:block;width:100%;height:68px;background:linear-gradient(#050706,#020303);border:1px solid #332b24;box-shadow:inset 0 0 12px #000}.time-module{display:flex;align-items:center;gap:8px;padding:18px 9px 5px}.time{color:#baa88e;font:800 9px/1 "Courier New",monospace;white-space:nowrap}.status-led{width:8px;height:8px;border-radius:50%;background:#2c1a12;box-shadow:inset 0 0 2px #000}.status-led.on{background:#e07428;box-shadow:0 0 8px #f27a2f}
body[data-power="off"] .stage,body[data-power="off"] .hardware .module:not(.power-module){filter:brightness(.18) saturate(.25)}
@media(max-width:900px){.app{grid-template-rows:minmax(0,1fr) 152px}.hardware{grid-template-columns:92px 112px 1fr;grid-template-rows:72px 64px}.vu-module{grid-column:3;grid-row:1}.spectrum-module{display:none}.transport-module{grid-column:1/-1;grid-row:2}.time-module{display:none}.genre-strip{max-width:62vw;left:12px;transform:none}.center-stack{width:min(94vw,620px);top:46%}.center-card{width:min(260px,50vw,31vh)}.lyrics{font-size:clamp(16px,4vw,22px);padding:9px 12px}.zoom-controls{bottom:10px;right:10px}}
</style>

<body data-power="on">
<div class="app">
  <main class="stage" id="stage" tabindex="0">
    <canvas id="canvas"></canvas>
    <div class="hud">
      <div class="brand">Good Boy Records / Sonic Landscape</div><div class="axis-guide"><span><b>← →</b> parent genre · colour order</span><span><b>↑ ↓</b> child genre · colour order</span></div>
      <div class="genre-label"><strong id="genreParent">Loading</strong><small id="genreChild">—</small></div><div class="genre-strip" id="genreStrip"></div><div class="map-tip" id="mapTip"><strong></strong><small></small></div>
      <div class="center-stack" id="centerStack">
        <div class="center-card" id="centerCard"><img id="cover" alt=""><div class="center-copy"><strong id="title">Loading…</strong><small id="variant">—</small></div></div>
        <div class="lyrics" id="lyric"><span class="karaoke-current">Select a track from the landscape</span><span class="karaoke-next"></span></div>
      </div>
      <div class="zoom-controls" aria-label="Map zoom controls"><button id="zoomOut" title="Zoom out">−</button><output id="zoomLevel">100%</output><button id="zoomIn" title="Zoom in">+</button><button id="zoomReset" title="Fit map">⌂</button></div>
    </div>
    <div class="loading" id="loading">Building sonic landscape…</div>
  </main>
  <footer class="hardware">
    <section class="module power-module"><span class="legend">Master</span><button class="power" id="power" aria-pressed="true">POWER</button></section>
    <section class="module knob-module"><span class="legend">Controls</span><div class="knob-wrap"><div class="knob" id="volumeKnob" role="slider" aria-label="Volume" tabindex="0"></div><small>VOLUME</small></div><div class="knob-wrap"><div class="knob" id="lampKnob" role="slider" aria-label="Lights" tabindex="0"></div><small>LIGHTS</small></div></section>
    <section class="module vu-module"><span class="legend">Output level</span><div class="vu"><div class="needle" id="vuL"></div><small>LEFT</small></div><div class="vu"><div class="needle" id="vuR"></div><small>RIGHT</small></div></section>
    <section class="module spectrum-module"><span class="legend">Live EQ spectrum</span><canvas id="spectrum"></canvas></section>
    <section class="module transport-module"><span class="legend">Transport</span><div class="transport"><button class="hw-button" id="prev" title="Previous">◀</button><button class="hw-button main" id="play" title="Play / Pause">▶</button><button class="hw-button" id="next" title="Next">▶</button><button class="hw-button" id="shuffle" title="Shuffle">S</button></div><div class="meta"><strong id="metaTitle">—</strong><span id="metaSub">—</span></div><input class="seek" id="seek" type="range" min="0" max="1" step="0.001" value="0"></section>
    <section class="module time-module"><span class="status-led on" id="statusLed"></span><span class="time" id="time">0:00 / 0:00</span></section>
  </footer>
</div>
<audio id="audio" preload="metadata"></audio>
<script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),audio=$('audio');
const ui={stage:$('stage'),loading:$('loading'),title:$('title'),variant:$('variant'),genreParent:$('genreParent'),genreChild:$('genreChild'),cover:$('cover'),centerCard:$('centerCard'),lyric:$('lyric'),metaTitle:$('metaTitle'),metaSub:$('metaSub'),play:$('play'),prev:$('prev'),next:$('next'),shuffle:$('shuffle'),seek:$('seek'),time:$('time'),power:$('power'),volumeKnob:$('volumeKnob'),lampKnob:$('lampKnob'),vuL:$('vuL'),vuR:$('vuR'),statusLed:$('statusLed'),genreStrip:$('genreStrip'),mapTip:$('mapTip'),spectrum:$('spectrum'),zoomIn:$('zoomIn'),zoomOut:$('zoomOut'),zoomReset:$('zoomReset'),zoomLevel:$('zoomLevel')};
let tracks=[],index=0,shuffle=false,power=true,nodes=[],dpr=1,ac=null,analyser=null,source=null,freq=null,timeData=null,phase=0,volume=.5,lamp=.5,parentLanes=[],hoverIndex=-1,activeParent=null,lyricLines=[],coverImages=new Map(),spectrumCtx=null;let world={w:1800,h:1100},camera={x:900,y:550,zoom:1,targetX:900,targetY:550,targetZoom:1},pointer={down:false,id:null,startX:0,startY:0,camX:0,camY:0,moved:false},touches=new Map(),pinch=null;
function rgb(hex){const m=/^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i.exec(hex||'');return m?{r:parseInt(m[1],16),g:parseInt(m[2],16),b:parseInt(m[3],16)}:{r:208,g:128,b:47}}
function srgbLinear(v){v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)}
function oklch(hex){const c=rgb(hex),r=srgbLinear(c.r),g=srgbLinear(c.g),b=srgbLinear(c.b),l=.4122214708*r+.5363325363*g+.0514459929*b,m=.2119034982*r+.6806995451*g+.1073969566*b,s=.0883024619*r+.2817188376*g+.6299787005*b,L_=Math.cbrt(l),M_=Math.cbrt(m),S_=Math.cbrt(s),L=.2104542553*L_+.793617785*M_-.0040720468*S_,A=1.9779984951*L_-2.428592205*M_+.4505937099*S_,B=.0259040371*L_+.7827717662*M_-.808675766*S_,C=Math.hypot(A,B),H=(Math.atan2(B,A)*180/Math.PI+360)%360;return{l:L,c:C,h:H}}
function colourCompare(a,b){const ca=oklch(a||'#808080'),cb=oklch(b||'#808080');return ca.h-cb.h||ca.l-cb.l||ca.c-cb.c}
function accent(track){const c=track?.genre?.child_colour||'#d0802f',v=rgb(c);document.documentElement.style.setProperty('--accent',c);document.documentElement.style.setProperty('--accent-rgb',`${v.r},${v.g},${v.b}`);return v}
function titleOf(t){return t?.displayTitle||t?.composition||t?.title||t?.id||'Untitled'}
function variantOf(t){return t?.variant||t?.version||t?.genre?.child_genre||'—'}
function audioOf(t){return t?.audio_url||t?.audio?.url||t?.audio?.src||t?.audio?.sources?.lossless||t?.audio?.sources?.stream||t?.audio?.sources?.mp3||t?.audio?.sources?.flac||''}
function artOf(t){if(t?.artwork_url)return t.artwork_url;const a=t?.artwork;if(typeof a==='string')return a;if(a?.url||a?.src)return a.url||a.src;if(a?.base)return`assets/img/sleeves/${a.base}-1280.webp`;return'assets/img/sleeves/gbr-placeholder-1280.webp'}
function lyricOf(t){const l=t?.lyrics,raw=typeof l==='string'?l:l?.raw||t?.lyric||'';if(!raw)return' ';return raw.split(/\r?\n/).map(x=>x.trim()).find(x=>x&&!x.startsWith('['))||' '}
async function loadLyrics(t){lyricLines=[];ui.lyric.textContent='…';const src=t?.lyrics_url||t?.lyrics?.wordTiming?.src||'';if(src){try{const r=await fetch(src,{cache:'no-store'});if(r.ok){const data=await r.json();if(Array.isArray(data?.lines))lyricLines=data.lines}}catch(e){console.warn('Live lyrics unavailable',src,e)}}if(!lyricLines.length){const raw=String(t?.lyrics?.raw||t?.lyrics||'');const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(x=>x&&!/^\[[^\]]+\]$/.test(x));const dur=Number(audio.duration)||Number(t?.duration)||Math.max(60,lines.length*5);const step=dur/Math.max(1,lines.length);lyricLines=lines.map((text,i)=>{const words=text.split(/\s+/);const ws=step/Math.max(1,words.length);return{text,start:i*step,end:(i+1)*step,words:words.map((word,j)=>({text:word,start:i*step+j*ws,end:i*step+(j+1)*ws}))}})}updateLyrics()}
function updateLyrics(){if(!lyricLines.length){ui.lyric.textContent=' ';return}const now=audio.currentTime||0;let line=lyricLines.find(l=>now>=Number(l.start||0)&&now<Number(l.end??1e12));if(!line)line=lyricLines.find(l=>Number(l.start||0)>now)||lyricLines[lyricLines.length-1];const words=Array.isArray(line?.words)?line.words:[];if(!words.length){ui.lyric.textContent=line?.text||'';return}ui.lyric.replaceChildren(...words.map(w=>{const span=document.createElement('span');span.textContent=(w.text||'')+' ';if(now>=Number(w.start||0)&&now<Number(w.end??1e12)){span.style.color='#fff1d2';span.style.textShadow='0 0 8px var(--accent)'}return span}))}
function imageFor(t){const src=artOf(t);let im=coverImages.get(src);if(!im){im=new Image();im.decoding='async';im.src=src;coverImages.set(src,im)}return im}
function buildGenreStrip(){ui.genreStrip.replaceChildren();for(const p of parentLanes){const b=document.createElement('button');b.className='genre-chip';b.textContent=p.name;b.onclick=()=>{clickSound();activeParent=activeParent===p.name?null:p.name;for(const n of nodes){if(n.t.genre?.parent_genre===p.name){select(n.i,false);break}}buildGenreStrip()};if(activeParent===p.name)b.classList.add('active');ui.genreStrip.appendChild(b)}}
function fmt(v){if(!Number.isFinite(v))return'0:00';const m=Math.floor(v/60),s=Math.floor(v%60);return`${m}:${String(s).padStart(2,'0')}`}
function clickSound(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=680;g.gain.setValueAtTime(.018,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.018);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.02)}catch{}}
async function graph(){if(analyser)return;if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();analyser=ac.createAnalyser();analyser.fftSize=512;analyser.smoothingTimeConstant=.78;source=ac.createMediaElementSource(audio);source.connect(analyser);analyser.connect(ac.destination);freq=new Uint8Array(analyser.frequencyBinCount);timeData=new Uint8Array(analyser.fftSize)}
function setKnob(el,val){val=Math.max(0,Math.min(1,val));el.style.setProperty('--v',val);el.setAttribute('aria-valuenow',String(Math.round(val*100)));return val}
function bindKnob(el,get,set){let drag=null;const apply=(v,sound=true)=>{set(Math.max(0,Math.min(1,v)));if(sound)clickSound()};el.addEventListener('wheel',e=>{e.preventDefault();apply(get()+(e.deltaY<0?.04:-.04))},{passive:false});el.addEventListener('pointerdown',e=>{drag={id:e.pointerId,y:e.clientY,v:get()};el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;set(Math.max(0,Math.min(1,drag.v+(drag.y-e.clientY)/140)))});el.addEventListener('pointerup',e=>{if(drag&&drag.id===e.pointerId){drag=null;clickSound()}});el.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowRight'){e.preventDefault();apply(get()+.03)}else if(e.key==='ArrowDown'||e.key==='ArrowLeft'){e.preventDefault();apply(get()-.03)}})}
function setVolume(v){volume=setKnob(ui.volumeKnob,v);audio.volume=volume}
function setLamp(v){lamp=setKnob(ui.lampKnob,v);document.documentElement.style.setProperty('--lamp',lamp)}
function viewToScreen(wx,wy){const w=ui.stage.clientWidth,h=ui.stage.clientHeight;return{x:(wx-camera.x)*camera.zoom+w/2,y:(wy-camera.y)*camera.zoom+h/2}}
function screenToWorld(sx,sy){const w=ui.stage.clientWidth,h=ui.stage.clientHeight;return{x:(sx-w/2)/camera.zoom+camera.x,y:(sy-h/2)/camera.zoom+camera.y}}
