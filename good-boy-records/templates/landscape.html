<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Good Boy Records — Sonic Landscape</title>
<style>
:root{--accent:#d0802f;--accent-rgb:208,128,47;--lamp:.5;--bg:#050606;--metal:#181817;--metal2:#0c0d0d;--line:#67452c;--text:#e8dfd1;--muted:#9c8d79}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020303;color:var(--text);font-family:Arial,Helvetica,sans-serif}button,input{font:inherit}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:rgba(0,0,0,calc((1 - var(--lamp)) * .72));z-index:500;transition:background .15s ease}body[data-power="off"]::after{background:rgba(0,0,0,.94)}
.app{height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) 104px;background:radial-gradient(circle at 50% 42%,rgba(var(--accent-rgb),.10),transparent 34%),linear-gradient(#080909,#020303)}
.stage{position:relative;min-height:0;overflow:hidden;border-bottom:2px solid #312116}.stage canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:0;pointer-events:none}.brand{position:absolute;left:18px;top:14px;color:#bfa98b;font:800 10px/1.3 "Courier New",monospace;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 1px #000}.genre-label{position:absolute;right:18px;top:14px;text-align:right}.genre-label strong{display:block;color:#eadfce;font:700 13px/1.1 Georgia,serif}.genre-label small{display:block;margin-top:4px;color:var(--accent);font:800 9px/1 "Courier New",monospace;letter-spacing:.13em;text-transform:uppercase}
.center-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(330px,31vw,38vh);aspect-ratio:1;border:1px solid #6a4d34;background:#090908;box-shadow:0 24px 70px #000d,0 0 28px rgba(var(--accent-rgb),.16);overflow:hidden;pointer-events:none}.center-card img{display:block;width:100%;height:100%;object-fit:cover;background:#090908}.center-card::after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.94))}.center-copy{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:22px 16px 15px;text-align:center}.center-copy strong{display:block;color:#f3eadf;font:700 clamp(18px,1.8vw,27px)/1.04 Georgia,serif;text-shadow:0 2px 8px #000}.center-copy small{display:block;margin-top:7px;color:var(--accent);font:800 9px/1.2 "Courier New",monospace;letter-spacing:.14em;text-transform:uppercase}
.lyrics{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:min(920px,calc(100% - 40px));padding:7px 12px;background:rgba(3,3,3,.70);border:1px solid #ffffff10;text-align:center;color:#cabca8;font:600 clamp(12px,1.15vw,17px)/1.3 Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(8px)}
.loading{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:#050606;color:#ad9b84;font:700 11px/1 "Courier New",monospace;letter-spacing:.12em;text-transform:uppercase}.loading[hidden]{display:none}
.hardware{display:grid;grid-template-columns:120px 122px 170px minmax(220px,1fr) auto;gap:8px;align-items:stretch;padding:7px 10px calc(7px + env(safe-area-inset-bottom));background:linear-gradient(#20201e,#0e0f0e 46%,#080909);box-shadow:inset 0 1px #4a4035,inset 0 -1px #000;border-top:1px solid #6b4b31}
.module{position:relative;min-width:0;border:1px solid #3d352d;background:linear-gradient(180deg,#191a18,#0b0c0b);box-shadow:inset 0 1px rgba(255,255,255,.035),0 2px 8px #0008;padding:6px}.legend{position:absolute;left:7px;top:5px;color:#806e5a;font:800 7px/1 "Courier New",monospace;letter-spacing:.14em;text-transform:uppercase}
.power-module{display:flex;align-items:center;justify-content:center;padding-top:15px}.power{width:78px;height:42px;border:1px solid #6d543d;border-radius:3px;background:linear-gradient(#262621,#11120f);box-shadow:inset 0 0 0 2px #080907,0 3px 7px #000;color:#9d8b73;font:900 10px/1 "Courier New",monospace;letter-spacing:.1em;cursor:pointer}.power[aria-pressed="true"]{color:#ffb24e;text-shadow:0 0 8px #ff8a22;box-shadow:inset 0 0 0 2px #080907,inset 0 0 18px #a54f0b66,0 3px 7px #000}.power:active{transform:translateY(1px)}
.knob-module{display:flex;gap:14px;align-items:end;justify-content:center;padding-top:12px}.knob-wrap{text-align:center}.knob{--v:.5;position:relative;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#777066,#3b3934 32%,#171815 70%,#090a09);border:1px solid #82715f;box-shadow:inset 0 0 0 3px #161714,0 3px 7px #000;cursor:ns-resize;touch-action:none}.knob::before{content:"";position:absolute;left:50%;top:5px;width:2px;height:15px;background:#e0c59e;transform-origin:50% 19px;transform:translateX(-50%) rotate(calc(-135deg + var(--v) * 270deg));box-shadow:0 0 3px #000}.knob-wrap small{display:block;margin-top:5px;color:#a08c73;font:800 7px/1 "Courier New",monospace;letter-spacing:.09em}.knob-value{display:none}
.vu-module{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding-top:15px}.vu{position:relative;height:64px;border:1px solid #66533e;background:linear-gradient(#d3c3a3,#b9aa8d);box-shadow:inset 0 0 12px #634b2d66}.vu::before{content:"-20   -10    -3    0   +3";position:absolute;left:5px;right:5px;top:6px;color:#4b4033;font:700 6px/1 "Courier New",monospace;word-spacing:1px;white-space:pre}.needle{position:absolute;left:50%;bottom:7px;width:1px;height:39px;background:#c0241b;transform-origin:50% 100%;transform:rotate(-43deg);transition:transform .045s linear;box-shadow:0 0 1px #000}.vu small{position:absolute;bottom:3px;left:0;right:0;text-align:center;color:#5b4b3b;font:800 6px/1 "Courier New",monospace;letter-spacing:.12em}
.transport-module{display:grid;grid-template-columns:auto minmax(130px,1fr);grid-template-rows:1fr auto;gap:4px 9px;padding-top:14px}.transport{display:flex;align-items:center;gap:5px}.hw-button{min-width:40px;height:38px;border:1px solid #685039;border-radius:3px;background:linear-gradient(#34322d,#171816);box-shadow:inset 0 1px #5c564d,0 2px 4px #000;color:#cbbb9f;cursor:pointer;font:900 13px/1 Arial}.hw-button.main{width:50px;height:44px;color:#f4dfbd}.hw-button.active{color:#ffb24e;box-shadow:inset 0 0 12px #b45a1555,0 2px 4px #000}.hw-button:active{transform:translateY(1px)}.meta{min-width:0;align-self:center}.meta strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e6d9c7;font:700 13px/1.1 Georgia,serif}.meta span{display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#947f64;font:800 8px/1 "Courier New",monospace;letter-spacing:.08em}.seek{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.time-module{display:flex;align-items:center;gap:8px;padding:18px 9px 5px}.time{color:#baa88e;font:800 9px/1 "Courier New",monospace;white-space:nowrap}.status-led{width:8px;height:8px;border-radius:50%;background:#2c1a12;box-shadow:inset 0 0 2px #000}.status-led.on{background:#e07428;box-shadow:0 0 8px #f27a2f}
body[data-power="off"] .stage,body[data-power="off"] .hardware .module:not(.power-module){filter:brightness(.18) saturate(.25)}
@media(max-width:900px){.app{grid-template-rows:minmax(0,1fr) 152px}.hardware{grid-template-columns:92px 112px 1fr;grid-template-rows:72px 64px}.vu-module{grid-column:3;grid-row:1}.transport-module{grid-column:1/-1;grid-row:2}.time-module{display:none}.center-card{width:min(280px,53vw,34vh)}}
</style>
</head>
<body data-power="on">
<div class="app">
  <main class="stage" id="stage" tabindex="0">
    <canvas id="canvas"></canvas>
    <div class="hud">
      <div class="brand">Good Boy Records / Sonic Landscape</div>
      <div class="genre-label"><strong id="genreParent">Loading</strong><small id="genreChild">—</small></div>
      <div class="center-card" id="centerCard"><img id="cover" alt=""><div class="center-copy"><strong id="title">Loading…</strong><small id="variant">—</small></div></div>
      <div class="lyrics" id="lyric">Select a track from the landscape</div>
    </div>
    <div class="loading" id="loading">Building sonic landscape…</div>
  </main>
  <footer class="hardware">
    <section class="module power-module"><span class="legend">Master</span><button class="power" id="power" aria-pressed="true">POWER</button></section>
    <section class="module knob-module"><span class="legend">Controls</span><div class="knob-wrap"><div class="knob" id="volumeKnob" role="slider" aria-label="Volume" tabindex="0"></div><small>VOLUME</small></div><div class="knob-wrap"><div class="knob" id="lampKnob" role="slider" aria-label="Lights" tabindex="0"></div><small>LIGHTS</small></div></section>
    <section class="module vu-module"><span class="legend">Output level</span><div class="vu"><div class="needle" id="vuL"></div><small>LEFT</small></div><div class="vu"><div class="needle" id="vuR"></div><small>RIGHT</small></div></section>
    <section class="module transport-module"><span class="legend">Transport</span><div class="transport"><button class="hw-button" id="prev" title="Previous">◀</button><button class="hw-button main" id="play" title="Play / Pause">▶</button><button class="hw-button" id="next" title="Next">▶</button><button class="hw-button" id="shuffle" title="Shuffle">S</button></div><div class="meta"><strong id="metaTitle">—</strong><span id="metaSub">—</span></div><input class="seek" id="seek" type="range" min="0" max="1" step="0.001" value="0"></section>
    <section class="module time-module"><span class="status-led on" id="statusLed"></span><span class="time" id="time">0:00 / 0:00</span></section>
  </footer>
</div>
<audio id="audio" preload="metadata"></audio>
<script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),audio=$('audio');
const ui={stage:$('stage'),loading:$('loading'),title:$('title'),variant:$('variant'),genreParent:$('genreParent'),genreChild:$('genreChild'),cover:$('cover'),centerCard:$('centerCard'),lyric:$('lyric'),metaTitle:$('metaTitle'),metaSub:$('metaSub'),play:$('play'),prev:$('prev'),next:$('next'),shuffle:$('shuffle'),seek:$('seek'),time:$('time'),power:$('power'),volumeKnob:$('volumeKnob'),lampKnob:$('lampKnob'),vuL:$('vuL'),vuR:$('vuR'),statusLed:$('statusLed')};
let tracks=[],index=0,shuffle=false,power=true,nodes=[],dpr=1,ac=null,analyser=null,source=null,freq=null,timeData=null,phase=0,volume=.5,lamp=.5,parentLanes=[];
function rgb(hex){const m=/^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i.exec(hex||'');return m?{r:parseInt(m[1],16),g:parseInt(m[2],16),b:parseInt(m[3],16)}:{r:208,g:128,b:47}}
function accent(track){const c=track?.genre?.child_colour||'#d0802f',v=rgb(c);document.documentElement.style.setProperty('--accent',c);document.documentElement.style.setProperty('--accent-rgb',`${v.r},${v.g},${v.b}`);return v}
function titleOf(t){return t?.displayTitle||t?.composition||t?.title||t?.id||'Untitled'}
function variantOf(t){return t?.variant||t?.version||t?.genre?.child_genre||'—'}
function audioOf(t){return t?.audio_url||t?.audio?.url||t?.audio?.src||t?.audio?.sources?.lossless||t?.audio?.sources?.stream||t?.audio?.sources?.mp3||t?.audio?.sources?.flac||''}
function artOf(t){const a=t?.artwork;if(t?.artwork_url)return t.artwork_url;if(typeof a==='string')return a;if(a?.url||a?.src)return a.url||a.src;if(a?.base)return`assets/img/sleeves/${a.base}-1280.webp`;const id=t?.id||'';return id?`assets/img/sleeves/${id}-1280.webp`:'assets/img/sleeves/gbr-placeholder-1280.webp'}
function lyricOf(t){const l=t?.lyrics,raw=typeof l==='string'?l:l?.raw||t?.lyric||'';if(!raw)return' ';return raw.split(/\r?\n/).map(x=>x.trim()).find(x=>x&&!x.startsWith('['))||' '}
function fmt(v){if(!Number.isFinite(v))return'0:00';const m=Math.floor(v/60),s=Math.floor(v%60);return`${m}:${String(s).padStart(2,'0')}`}
function clickSound(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=680;g.gain.setValueAtTime(.018,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.018);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.02)}catch{}}
async function graph(){if(analyser)return;if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();analyser=ac.createAnalyser();analyser.fftSize=512;analyser.smoothingTimeConstant=.78;source=ac.createMediaElementSource(audio);source.connect(analyser);analyser.connect(ac.destination);freq=new Uint8Array(analyser.frequencyBinCount);timeData=new Uint8Array(analyser.fftSize)}
function setKnob(el,val){val=Math.max(0,Math.min(1,val));el.style.setProperty('--v',val);el.setAttribute('aria-valuenow',String(Math.round(val*100)));return val}
function bindKnob(el,get,set){let drag=null;const apply=(v,sound=true)=>{set(Math.max(0,Math.min(1,v)));if(sound)clickSound()};el.addEventListener('wheel',e=>{e.preventDefault();apply(get()+(e.deltaY<0?.04:-.04))},{passive:false});el.addEventListener('pointerdown',e=>{drag={id:e.pointerId,y:e.clientY,v:get()};el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;set(Math.max(0,Math.min(1,drag.v+(drag.y-e.clientY)/140)))});el.addEventListener('pointerup',e=>{if(drag&&drag.id===e.pointerId){drag=null;clickSound()}});el.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowRight'){e.preventDefault();apply(get()+.03)}else if(e.key==='ArrowDown'||e.key==='ArrowLeft'){e.preventDefault();apply(get()-.03)}})}
function setVolume(v){volume=setKnob(ui.volumeKnob,v);audio.volume=volume}
function setLamp(v){lamp=setKnob(ui.lampKnob,v);document.documentElement.style.setProperty('--lamp',lamp)}
async function load(){const candidates=['catalogue.json','data/catalogue.json','../data/catalogue.json'];let data=null;for(const url of candidates){try{const r=await fetch(url,{cache:'no-store'});if(r.ok){data=await r.json();break}}catch{}}tracks=Array.isArray(data)?data:(data?.tracks||[]);if(!tracks.length)throw new Error('No catalogue tracks found');tracks.sort((a,b)=>(a.genre?.taxonomy_order??1e9)-(b.genre?.taxonomy_order??1e9)||titleOf(a).localeCompare(titleOf(b)));const parents=[...new Map(tracks.map(t=>[t.genre?.parent_genre||'Unclassified',t])).entries()].map(([name,t])=>({name,order:t.genre?.parent_order??t.genre?.taxonomy_order??1e9})).sort((a,b)=>a.order-b.order);parentLanes=parents;ui.loading.hidden=true;setVolume(.5);setLamp(.5);select(0,false);resize()}
function select(i,autoplay=true){if(!tracks.length)return;index=(i%tracks.length+tracks.length)%tracks.length;const t=tracks[index],src=audioOf(t);accent(t);ui.title.textContent=titleOf(t);ui.variant.textContent=variantOf(t);ui.genreParent.textContent=t.genre?.parent_genre||'Unclassified';ui.genreChild.textContent=t.genre?.child_genre||variantOf(t);ui.metaTitle.textContent=titleOf(t);ui.metaSub.textContent=[variantOf(t),t.genre?.cluster].filter(Boolean).join(' · ');ui.lyric.textContent=lyricOf(t);ui.cover.onerror=()=>{if(!ui.cover.src.endsWith('gbr-placeholder-1280.webp'))ui.cover.src='assets/img/sleeves/gbr-placeholder-1280.webp'};ui.cover.src=artOf(t);ui.cover.alt=`Album artwork for ${titleOf(t)}`;if(src&&audio.src!==new URL(src,location.href).href){audio.src=src;audio.load()}if(autoplay&&src&&power){graph().then(()=>{ac.resume();audio.play().catch(()=>{})})}buildNodes()}
function buildNodes(){const w=ui.stage.clientWidth,h=ui.stage.clientHeight,padX=Math.max(74,w*.055),padY=48;const laneMap=new Map(parentLanes.map((p,i)=>[p.name,i]));const laneCount=Math.max(1,parentLanes.length),usableH=Math.max(40,h-padY*2),laneH=usableH/laneCount;const bucketCount=new Map();nodes=tracks.map((t,i)=>{const pos=Math.max(0,Math.min(1,Number(t.genre?.position??.5))),parent=t.genre?.parent_genre||'Unclassified',lane=laneMap.get(parent)??laneCount-1,key=`${parent}|${Math.round(pos*120)}`,dupe=bucketCount.get(key)||0;bucketCount.set(key,dupe+1);const x=padX+(w-padX*2)*pos,y=padY+laneH*((laneMap.get(parent)??laneCount-1)+.5)+(dupe%5-2)*4;return{x,y,r:i===index?8:4.2,i,t,lane:laneMap.get(parent)??0}})}
function resize(){dpr=Math.min(2,devicePixelRatio||1);const r=ui.stage.getBoundingClientRect();canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));canvas.style.width=`${r.width}px`;canvas.style.height=`${r.height}px`;ctx.setTransform(dpr,0,0,dpr,0,0);buildNodes()}
function draw(){const w=ui.stage.clientWidth,h=ui.stage.clientHeight,t=tracks[index],c=accent(t);ctx.clearRect(0,0,w,h);const grad=ctx.createRadialGradient(w/2,h/2,20,w/2,h/2,Math.max(w,h)*.7);grad.addColorStop(0,`rgba(${c.r},${c.g},${c.b},${.03+.08*lamp})`);grad.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);const laneCount=Math.max(1,parentLanes.length),padY=48,usableH=Math.max(40,h-padY*2),laneH=usableH/laneCount;ctx.font='700 8px Courier New';ctx.textBaseline='middle';for(let i=0;i<laneCount;i++){const y=padY+laneH*(i+.5);ctx.strokeStyle='rgba(255,255,255,.045)';ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();if(laneH>18){ctx.fillStyle='rgba(190,170,145,.38)';ctx.fillText(parentLanes[i].name.toUpperCase(),8,y-5)}}for(const n of nodes){const tc=rgb(n.t.genre?.child_colour),sel=n.i===index;ctx.fillStyle=sel?`rgb(${tc.r},${tc.g},${tc.b})`:`rgba(${tc.r},${tc.g},${tc.b},.55)`;ctx.beginPath();ctx.arc(n.x,n.y,sel?8:n.r,0,Math.PI*2);ctx.fill();if(sel){ctx.strokeStyle='rgba(255,240,210,.9)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(n.x,n.y,12,0,Math.PI*2);ctx.stroke()}}let l=.04,r=.04;if(analyser&&power&&!audio.paused){analyser.getByteFrequencyData(freq);analyser.getByteTimeDomainData(timeData);let sum=0;for(const v of timeData){const z=(v-128)/128;sum+=z*z}const rms=Math.min(1,Math.sqrt(sum/timeData.length)*2.6);l=rms;r=Math.min(1,rms*.92+((freq[12]||0)/255)*.08)}ui.vuL.style.transform=`rotate(${-43+l*86}deg)`;ui.vuR.style.transform=`rotate(${-43+r*86}deg)`;phase+=.016;requestAnimationFrame(draw)}
function next(){select(shuffle?Math.floor(Math.random()*tracks.length):index+1,true)}function prev(){select(index-1,true)}
function setPower(on){power=!!on;document.body.dataset.power=power?'on':'off';ui.power.setAttribute('aria-pressed',String(power));ui.statusLed.classList.toggle('on',power);clickSound();if(!power)audio.pause();else if(audio.src){graph().then(()=>ac.resume())}}
ui.power.onclick=()=>setPower(!power);ui.play.onclick=()=>{if(!power||!audio.src)return;clickSound();graph().then(()=>{ac.resume();audio.paused?audio.play():audio.pause()})};ui.next.onclick=()=>{if(power){clickSound();next()}};ui.prev.onclick=()=>{if(power){clickSound();prev()}};ui.shuffle.onclick=()=>{if(!power)return;clickSound();shuffle=!shuffle;ui.shuffle.classList.toggle('active',shuffle)};ui.seek.oninput=()=>{if(Number.isFinite(audio.duration))audio.currentTime=Number(ui.seek.value)*audio.duration};audio.onplay=()=>ui.play.textContent='❚❚';audio.onpause=()=>ui.play.textContent='▶';audio.onended=next;audio.ontimeupdate=()=>{ui.time.textContent=`${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;ui.seek.value=audio.duration?audio.currentTime/audio.duration:0};
bindKnob(ui.volumeKnob,()=>volume,setVolume);bindKnob(ui.lampKnob,()=>lamp,setLamp);
canvas.addEventListener('click',e=>{if(!power)return;const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let best=null;for(const n of nodes){const d=Math.hypot(x-n.x,y-n.y);if(d<18&&(!best||d<best.d))best={d,i:n.i}}if(best){clickSound();select(best.i,true)}});canvas.addEventListener('wheel',e=>{if(!power)return;e.preventDefault();clickSound();e.deltaY>0?next():prev()},{passive:false});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();else if(e.key===' '){e.preventDefault();ui.play.click()}else if(e.key.toLowerCase()==='s')ui.shuffle.click();else if(e.key.toLowerCase()==='p')ui.power.click()});new ResizeObserver(resize).observe(ui.stage);
load().then(()=>draw()).catch(err=>{ui.loading.textContent=`Landscape build error: ${err.message}`;console.error(err)});
</script>
</body>
</html>
