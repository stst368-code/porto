<style>

.knob-module{display:flex;gap:14px;align-items:end;justify-content:center;padding-top:12px}.knob-wrap{text-align:center}.knob{--v:.5;position:relative;width:clamp(38px,5.2vh,48px);height:clamp(38px,5.2vh,48px);border-radius:50%;background:radial-gradient(circle at 38% 32%,#777066,#3b3934 32%,#171815 70%,#090a09);border:1px solid #82715f;box-shadow:inset 0 0 0 3px #161714,0 3px 7px #000;cursor:ns-resize;touch-action:none}.knob::before{content:"";position:absolute;left:50%;top:5px;width:2px;height:15px;background:#e0c59e;transform-origin:50% 19px;transform:translateX(-50%) rotate(calc(-135deg + var(--v) * 270deg));box-shadow:0 0 3px #000}.knob-wrap small{display:block;margin-top:5px;color:#a08c73;font:800 7px/1 "Courier New",monospace;letter-spacing:.09em}.knob-value{display:none}
