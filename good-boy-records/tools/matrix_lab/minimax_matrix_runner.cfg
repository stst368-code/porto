# Good Boy Records - controlled MiniMax comparison matrices
# Bundled with Good Boy Records. RUN-MATRIX-LAB.bat supplies the site output path and prompts for the YAML source root.
#
# Relative paths are resolved from THIS CFG FILE.
# The output root below therefore maps directly onto the GBR repository layout
# requested for the website assets.

[global]
tracks_root = trackstemp
output_root = ..\..\content-source\otheraudio

# Baseline values. If the selected YAML contains equivalent generation metadata,
# prefer_yaml_baseline=true makes the runner use the YAML values instead. That is
# deliberate: a known-good song should remain the control while only one matrix
# axis is changed.
prefer_yaml_baseline = true
prefer_yaml_seeds = true

baseline_text_encoder = bf16
baseline_dit = fp16
baseline_vae = minimax_music3_dav.safetensors
baseline_encoder_cfg = 1.7
baseline_encoder_top_k = 50
baseline_sampler_cfg = 1.7
baseline_steps = 33
baseline_sampler = euler
baseline_scheduler = simple
denoise = 1.0

# Used only when the YAML does not contain BOTH encoder_seed and sampler_seed.
# Multiple pairs are supported as encoder/sampler,encoder/sampler,...
# With multiple seed sets the runner creates seed-01, seed-02, ... subfolders so
# the filename suffix contract remains unchanged inside each set.
seed_sets = 1234567890/9876543210

default_duration = 300

# Web comparison assets are deliberately MP3. 320k keeps encoding loss well below
# the much larger generative differences we are trying to demonstrate.
mp3_quality = 320k

use_tiled_decode = false
vae_tile_size = 512
vae_tile_overlap = 64

poll_seconds = 2
request_timeout_seconds = 120
retry_seconds = 10
max_attempts = 3
skip_existing = true

# Fail rather than silently produce an incomplete matrix if workers expose
# different model/sampler lists.
strict_worker_capabilities = true
shuffle_jobs = false


# -----------------------------------------------------------------------------
# MATRIX 1: sampler x scheduler
# -----------------------------------------------------------------------------
# '*' means every sampler/scheduler advertised by ComfyUI /object_info.
# This is the deliberately excessive one: every sampler crossed with every
# scheduler. The runner prints the exact generation count before it starts.

[experiment:samp_sched]
enabled = true
folder = samp_sched
samplers = *
schedulers = *


# -----------------------------------------------------------------------------
# MATRIX 2: sampler CFG x steps
# -----------------------------------------------------------------------------
# Includes tiny changes around the likely useful region plus deliberately large
# jumps, which is exactly what the GBR comparison is meant to expose.

[experiment:cfg_steps]
enabled = true
folder = cfg_steps
cfg_values = 1.0,1.2,1.4,1.6,1.7,1.8,2.0,2.5,3.0,4.0
step_values = 10,15,20,25,30,33,37,45,60


# -----------------------------------------------------------------------------
# MATRIX 3: DiT x text encoder
# -----------------------------------------------------------------------------
# '*' is filtered to MiniMax Music 3 files only, so unrelated models installed on
# the RunPod do not suddenly become part of the experiment.

[experiment:dit_textenc]
enabled = true
folder = dit_textenc
dits = *
text_encoders = *


# -----------------------------------------------------------------------------
# MATRIX 4: text-encoder CFG x Top-K
# -----------------------------------------------------------------------------
# Disabled by default because it adds another large set, but the runner already
# supports it. This is useful for demonstrating that some apparently meaningful
# knobs may have surprisingly little audible effect.

[experiment:encoder_cfg_topk]
enabled = false
folder = encoder_cfg_topk
encoder_cfg_values = 1.0,1.2,1.4,1.6,1.7,1.8,2.0,2.5
# Top-K must be accepted by the MiniMax encode node; these are sensible test points.
top_k_values = 10,25,50,75,100


