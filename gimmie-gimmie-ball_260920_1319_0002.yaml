caption: |
  Global Metadata
  Basic Attributes: Minimal Piano Singer-Songwriter, roughly 120–145 BPM, minor-key, melancholic and highly melodic, built exclusively around solo piano and voice. Global Emotional Progression: Rebuild the supplied song completely inside this style while preserving its narrative identity: a sleepless midnight obsession with obtaining the sacred ball, moving from private frustration into increasingly grand desperation. Let repeated sections evolve through arrangement, register and intensity. Application Scenarios & Imagery: a humid moonlit garden where one restless golden retriever treats a missing tennis ball like an existential crisis. Sonics & Production Profile: Close detailed acoustic piano with clear hammer attack, resonant low strings and audible room character. Strong natural dynamics and human timing. Absolutely no drums, percussion, bass, synths, pads, orchestral strings or cinematic sound design.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Female), a clear dramatic mezzo-soprano with strong diction, expressive lower phrases and a powerful upper register. Vocal Style: Use an intimate exposed performance that can move from conversational restraint to rawer melodic intensity. Emotional growth must come from phrasing, register and breath, not added production. Harmony/Backing Vocals: No conventional backing vocals unless a very quiet self-double is essential at the single largest moment; the dominant impression is one singer alone with piano. Role Continuity: Keep the female lead continuous; backing voices may expand at hooks but should never replace her narrative role. Vocal FX: Minimal natural room or short plate, gentle compression only; preserve breath and piano/vocal detail.
  Arrangement
  Section Timeline: [verse] → [pre-chorus] → [chorus] → [verse] → [pre-chorus] → [chorus] → [bridge] → [solo] → [chorus] → [outro]. Instrument Lifecycle: Piano carries rhythm, harmony and counter-melody continuously. Use fast-moving figures, repeated ostinati, octave motion and changing register so the track has forward motion without percussion. Section Directives: [intro]: Begin immediately with an exposed repeating piano figure that defines both pulse and harmony. [verse]: Keep the piano restless but dynamically restrained under close conversational singing. [pre-chorus]: Increase register, left-hand motion or harmonic tension without adding instruments. [chorus]: Use stronger piano attack, wider voicings and a more open vocal melody while remaining only piano and voice. [bridge]: Thin to exposed notes, unstable harmony or near-rubato, creating the most vulnerable moment. [solo]: Use a short piano interlude that develops the vocal motif rather than virtuosic display. [outro]: Return to the simplest figure and end naturally with ringing piano decay or a clean final chord. Groove & Foundation Progression: All transitions must remain native to the stated genre. Preserve recognisable motifs across repeated sections while changing density, register, voicing or articulation. Keep the target genre dominant throughout.
