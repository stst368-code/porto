name: Build and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GBR build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r good-boy-records/requirements.txt

      - name: Build GBR Pages payload
        working-directory: good-boy-records
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # showcase/ is authored locally and media is served from R2.
          # The Pages build therefore consumes the compact catalogue committed
          # by tools/launchers/build-site.bat. Never rebuild it from a stale or
          # partial showcase tree that may happen to exist in the Git checkout.
          test -f data/catalogue.json
          cp data/catalogue.json _site/catalogue.json

          if [ -d content-source/folders ]; then
            mkdir -p _site/content-source
            cp -R content-source/folders _site/content-source/folders
          fi
          python tools/build_knowledge_manifest.py _site/knowledge-manifest.json

          test -f showcase-host.js
          cp showcase-host.js _site/showcase-host.js

          test -f templates/landscape.html
          cp templates/landscape.html _site/landscape.html
          cp templates/landscape.html _site/index.html

          # Stage the Signal Observatory, including the Generation Simulator.
          # GitHub Actions rebuilds _site; local _site is intentionally ignored by Git.
          test -f analytics/index.html
          test -f analytics/analytics.js
          test -f analytics/analytics.css
          test -f data/analytics/generations.json
          test -f data/analytics/summary.json
          mkdir -p _site/analytics _site/data/analytics
          cp analytics/index.html analytics/analytics.js analytics/analytics.css _site/analytics/
          cp data/analytics/generations.json data/analytics/summary.json _site/data/analytics/
          if [ -f data/analytics/cost-analysis.json ]; then
            cp data/analytics/cost-analysis.json _site/data/analytics/
          fi

          # Same first-class Analytics navigation as the local Windows build.
          test -f tools/analytics/inject_link.py
          python tools/analytics/inject_link.py _site/index.html _site/landscape.html

          # Media is served by R2; Pages must stay small.
          rm -rf _site/showcase

          grep -q 'crossorigin="anonymous"' _site/index.html
          grep -q 'id="knowledgeButton"' _site/index.html
          grep -q 'knowledgeAddEdge' _site/index.html
          grep -q 'FALLBACK_ART' _site/index.html
          grep -q 'GBR_SHOWCASE_ROOT' _site/showcase-host.js
          test -f _site/catalogue.json
          test -f _site/knowledge-manifest.json
          test -f _site/analytics/index.html
          test -f _site/analytics/analytics.js
          test -f _site/analytics/analytics.css
          test -f _site/data/analytics/generations.json
          test -f _site/data/analytics/summary.json
          grep -q 'id="gbrAnalyticsButton"' _site/index.html
          grep -q 'data-view="simulator"' _site/analytics/index.html
          test ! -d _site/showcase

      - name: Assemble portfolio routes
        run: python .github/scripts/stage_portfolio.py

      - name: Verify staged GBR route
        shell: bash
        run: |
          set -euo pipefail
          test -f _pages/good-boy-records/index.html
          test -f _pages/good-boy-records/catalogue.json
          test -f _pages/good-boy-records/knowledge-manifest.json
          test -f _pages/good-boy-records/showcase-host.js
          test -f _pages/good-boy-records/analytics/index.html
          test -f _pages/good-boy-records/analytics/analytics.js
          test -f _pages/good-boy-records/analytics/analytics.css
          test -f _pages/good-boy-records/data/analytics/generations.json
          test -f _pages/good-boy-records/data/analytics/summary.json
          grep -q 'id="gbrAnalyticsButton"' _pages/good-boy-records/index.html
          grep -q 'data-view="simulator"' _pages/good-boy-records/analytics/index.html
          test ! -d _pages/good-boy-records/showcase

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
