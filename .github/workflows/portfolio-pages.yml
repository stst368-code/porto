name: Build and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GBR build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML Pillow

      - name: Prepare GBR catalogue source
        working-directory: good-boy-records
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Backwards-compatible path: if showcase/ is still checked out, refresh
          # the generated catalogue. Once showcase/ is R2-only this branch is skipped.
          if [ -d showcase ] && find showcase -type f -print -quit | grep -q .; then
            echo "Local showcase found; refreshing generated catalogue."
            if [ -f tools/import_showcase.py ]; then python tools/import_showcase.py; fi
            if [ -f tools/prepare_artwork.py ] && [ -d masters ]; then python tools/prepare_artwork.py masters assets/img/sleeves; fi
            if [ -f tools/build_catalogue.py ]; then python tools/build_catalogue.py; fi
          else
            echo "showcase/ is external; using committed data/catalogue.json."
            test -f data/catalogue.json
          fi

      - name: Find GBR catalogue input
        id: catalogue
        working-directory: good-boy-records
        shell: bash
        run: |
          for f in data/catalogue.json showcase-manifest.json content-source/showcase-manifest.json catalogue.json; do
            if [ -f "$f" ]; then
              echo "input=$f" >> "$GITHUB_OUTPUT"
              echo "Using $f"
              exit 0
            fi
          done
          echo "No catalogue input found" >&2
          exit 1

      - name: Build genre-enriched Sonic catalogue
        working-directory: good-boy-records
        run: |
          python tools/build_genre_catalogue.py \
            "${{ steps.catalogue.outputs.input }}" \
            templates/music_genre_taxonomy.csv \
            _site/catalogue.json
          if [ -f tools/augment_easter_catalogue.py ]; then
            python tools/augment_easter_catalogue.py _site/catalogue.json .
          fi

      - name: Publish small GBR runtime only
        working-directory: good-boy-records
        shell: bash
        run: |
          set -euo pipefail
          test -f showcase-host.js
          cp showcase-host.js _site/showcase-host.js

          if [ -d content-source/folders ]; then
            mkdir -p _site/content-source
            rm -rf _site/content-source/folders
            cp -R content-source/folders _site/content-source/folders
          fi

          test -f templates/landscape.html
          cp templates/landscape.html _site/landscape.html
          cp templates/landscape.html _site/index.html

          # The whole point of this build: GitHub Pages must never receive the
          # large curated media tree.
          test ! -e _site/showcase
          test -f _site/catalogue.json
          test -f _site/showcase-host.js
          echo "GBR staged size:"
          du -sh _site

      - name: Assemble portfolio routes
        run: python .github/scripts/stage_portfolio.py

      - name: Verify staged GBR route
        run: |
          test -f _pages/good-boy-records/index.html
          test -f _pages/good-boy-records/showcase-host.js
          test ! -e _pages/good-boy-records/showcase
          grep -q 'Sonic Landscape' _pages/good-boy-records/index.html
          echo "Verified: GBR app shell only; showcase media is external."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
