name: Build and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROJECT_DIR: ${{ github.workspace }}/good-boy-records

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GBR build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML Pillow

      - name: Prepare GBR metadata
        working-directory: good-boy-records
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # During migration, refresh the compact catalogue if showcase/ is
          # still present in Git. Once showcase/ is R2-only, use the committed
          # compact metadata generated by the last local build.
          if [ -d showcase ] && find showcase -type f -print -quit | grep -q .; then
            echo "Local showcase present: refreshing metadata."
            if [ -f tools/import_showcase.py ]; then python tools/import_showcase.py; fi
            if [ -f tools/prepare_artwork.py ] && [ -d masters ]; then
              python tools/prepare_artwork.py masters assets/img/sleeves
            fi
            if [ -f tools/build_catalogue.py ]; then python tools/build_catalogue.py; fi
          else
            echo "showcase/ is external (R2): using committed compact catalogue."
          fi

      - name: Find GBR catalogue input
        id: catalogue
        working-directory: good-boy-records
        shell: bash
        run: |
          set -euo pipefail
          for f in data/catalogue.json content-source/showcase-manifest.json showcase-manifest.json catalogue.json; do
            if [ -f "$f" ]; then
              echo "input=$f" >> "$GITHUB_OUTPUT"
              echo "Using $f"
              exit 0
            fi
          done
          echo "No catalogue input found. Run BUILD-SONIC-LANDSCAPE.bat locally once while showcase/ exists and commit the compact metadata." >&2
          exit 1

      - name: Build genre-enriched Sonic catalogue
        working-directory: good-boy-records
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_genre_catalogue.py             "${{ steps.catalogue.outputs.input }}"             templates/music_genre_taxonomy.csv             _site/catalogue.json
          if [ -f tools/augment_easter_catalogue.py ]; then
            python tools/augment_easter_catalogue.py _site/catalogue.json .
          fi

      - name: Publish GBR document tabs and R2 host config
        working-directory: good-boy-records
        shell: bash
        run: |
          set -euo pipefail
          if [ -d content-source/folders ]; then
            mkdir -p _site/content-source
            rm -rf _site/content-source/folders
            cp -R content-source/folders _site/content-source/folders
          fi

          test -f showcase-host.js
          cp showcase-host.js _site/showcase-host.js

      - name: Make Sonic Landscape the GBR index
        working-directory: good-boy-records
        shell: bash
        run: |
          set -euo pipefail
          test -f templates/landscape.html
          cp templates/landscape.html _site/landscape.html
          cp templates/landscape.html _site/index.html

          # R2-only deployment: never ship curated media in Pages.
          rm -rf _site/showcase

          # Regression checks for the exact bug fixed in v10.8.6.
          grep -q 'crossorigin="anonymous"' _site/index.html
          grep -q 'id="fmtFlac"' _site/index.html
          grep -q 'id="fmtMp3"' _site/index.html
          grep -q 'class="module master-module"' _site/index.html
          grep -q '>Shuffle</button>' _site/index.html
          grep -q 'for(let i=0;i<184;i++)' _site/index.html
          grep -q 'beatPeriod' _site/index.html
          grep -q 'class="vertical-slider"' _site/index.html
          grep -q 'class="power-format-stack"' _site/index.html
          grep -q 'decayBeats' _site/index.html
          grep -q 'id="knowledgeButton"' _site/index.html
          grep -q 'class="knowledge-reader"' _site/index.html
          grep -q 'const KNOWLEDGE_DOCS=' _site/index.html
          grep -q 'drawKnowledge' _site/index.html
          grep -q 'GBR_SHOWCASE_ROOT' _site/showcase-host.js
          test -f _site/catalogue.json
          test ! -d _site/showcase

          echo "Verified R2 player build:"
          grep -m1 '<title>' _site/index.html
          grep -m1 'GBR_SHOWCASE_ROOT' _site/showcase-host.js

      - name: Assemble portfolio routes
        run: python .github/scripts/stage_portfolio.py

      - name: Verify staged GBR route
        shell: bash
        run: |
          set -euo pipefail
          test -f _pages/good-boy-records/index.html
          test -f _pages/good-boy-records/showcase-host.js
          grep -q 'crossorigin="anonymous"' _pages/good-boy-records/index.html
          grep -q 'id="fmtFlac"' _pages/good-boy-records/index.html
          grep -q 'id="fmtMp3"' _pages/good-boy-records/index.html
          grep -q 'class="module master-module"' _pages/good-boy-records/index.html
          grep -q '>Shuffle</button>' _pages/good-boy-records/index.html
          grep -q 'for(let i=0;i<184;i++)' _pages/good-boy-records/index.html
          grep -q 'beatPeriod' _pages/good-boy-records/index.html
          grep -q 'class="vertical-slider"' _pages/good-boy-records/index.html
          grep -q 'class="power-format-stack"' _pages/good-boy-records/index.html
          grep -q 'decayBeats' _pages/good-boy-records/index.html
          grep -q 'id="knowledgeButton"' _pages/good-boy-records/index.html
          grep -q 'class="knowledge-reader"' _pages/good-boy-records/index.html
          grep -q 'const KNOWLEDGE_DOCS=' _pages/good-boy-records/index.html
          grep -q 'drawKnowledge' _pages/good-boy-records/index.html
          test ! -d _pages/good-boy-records/showcase
          echo "Verified: GitHub Pages contains player/catalogue only; media stays on R2."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
