caption: |-
  Global Metadata
  Basic Attributes: Late-Romantic Symphony / Operatic Ballad, roughly 68–84 BPM, broad lyrical pacing, rich chromatic harmony and long dramatic arcs rather than beat-driven repetition. Global Emotional Progression: Rebuild the supplied song completely inside this style while preserving its narrative identity: a relaxed portrait of two goldens, one regal and cool, the other affectionate and chaotic, held together by domestic warmth. Let repeated sections evolve through arrangement, register and intensity. Application Scenarios & Imagery: late-evening lamplight, polished wood and two golden retrievers occupying the room as if they commissioned the furniture. Sonics & Production Profile: Full acoustic symphony: strings, woodwinds, horns, trumpets, trombones, timpani, harp and piano where useful. Preserve wide natural dynamics and a deep concert-hall image. No drum kit, synths, trailer percussion, electric guitar or pop compression.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Female), a sultry breathy mezzo-soprano with intimate close-miked delivery and effortless phrasing. Vocal Style: Use lyrical classical phrasing with careful diction and flexible rubato. Verses remain intimate and speech-aware; climactic sections expand into sustained operatic projection without becoming a modern pop belt. Harmony/Backing Vocals: Use subtle classical ensemble or choir support only at major peaks; avoid constant block harmony that flattens the dramatic arc. Role Continuity: Keep the female lead understated and continuous; harmonies should support warmth rather than create a giant chorus unless the target genre explicitly calls for it. Vocal FX: Natural hall acoustics only, with the singer placed clearly in front of the orchestra.
  Arrangement
  Section Timeline: [intro] → [verse] → [chorus] → [verse] → [bridge] → [outro]. Instrument Lifecycle: Strings carry long harmonic motion from the opening. Woodwinds provide intimate counter-lines; horns and low brass enter as emotion grows; timpani is reserved for true structural peaks. Section Directives: [intro]: Begin with a fragile orchestral motif, exposed strings or woodwind and generous space before the voice. [verse]: Support the vocal with restrained strings and solo wind responses, allowing rubato and lyric clarity. [chorus]: Open into broad full-orchestra harmony and sustained vocal projection, using brass and timpani selectively. [bridge]: Suspend time with thinner orchestration, exposed harmony and a darker chromatic turn. [outro]: Return to the opening intimacy and let the final harmonic resolution ring naturally in the hall. Groove & Foundation Progression: All transitions must remain native to the stated genre. Preserve recognisable motifs across repeated sections while changing density, register, voicing or articulation. Keep the target genre dominant throughout.
