<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Simon Taylor — Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="chrome">
    <div class="chrome__identity">
      <strong id="site-title">Simon Taylor</strong>
      <span id="site-subtitle">Supply Chain · Data · Automation</span>
    </div>
    <div class="chrome__actions">
      <button id="theme-toggle" type="button">DARK</button>
      <button id="reset-view" type="button">RESET VIEW</button>
      <button id="reset-layout" type="button">RESET LAYOUT</button>
    </div>
  </header>

  <a id="linkedin-link" class="linkedin-float" href="#" target="_blank" rel="noopener">
    <span class="linkedin-float__mark">in</span>
    <span>LINKEDIN</span>
  </a>

  <div class="viewport" id="viewport">
    <div class="world" id="world">
      <div class="grid-plane" aria-hidden="true"></div>
      <main class="workspace" id="workspace"></main>
    </div>
  </div>

  <main class="mobile-feed" id="mobile-feed"></main>

  <div class="status-strip">
    <span>DRAG EMPTY SPACE TO PAN</span>
    <span>SCROLL TO ZOOM</span>
    <span>DRAG PAGES TO REARRANGE</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
