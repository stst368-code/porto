caption: |-
  Global Metadata
  Basic Attributes: Golden-Era East Coast Hardcore Hip-Hop / Jazz-Funk Sample Aesthetic, roughly 150–156 BPM or a heavy half-time feel, urgent, swaggering and breakbeat-driven. Global Emotional Progression: Rebuild the supplied song completely inside this style while preserving its narrative identity: a satirical authoritarian pageant centred on Doja, balancing absurd grandeur with genuine forward momentum. Let repeated sections evolve through arrangement, register and intensity. Application Scenarios & Imagery: a vast ceremonial square gradually revealing that the supreme ruler is a very self-satisfied golden retriever. Sonics & Production Profile: Hard chopped breakbeat, thick sampled kick/snare, gritty bass loop, dark jazz-funk or brass sample fragments, turntable-style cuts and restrained vinyl texture. Keep the production punchy and sample-led. Avoid glossy trap hi-hats, EDM synths and modern pop chord washes.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male), a firm mid-range voice with clear diction and enough grit for comic authority; ensemble responses should sound disciplined rather than cartoonish. Vocal Style: Use controlled, rhythmically exact rap delivery with strong consonants and confidence. Hooks should become more collective or chant-like, not conventionally sung unless the supplied song already requires melody. Harmony/Backing Vocals: Use short gang responses, doubled final words and occasional sampled vocal stabs. Keep the lead dominant. Role Continuity: Keep the same male lead identity across sections; when group responses appear, use a compact male ensemble rather than changing the principal singer. Vocal FX: Dry compression, subtle saturation and very short room; occasional filtered or telephone effect for a transition only.
  Arrangement
  Section Timeline: [verse] → [verse] → [chorus] → [chorus] → [verse] → [bridge] → [verse] → [bridge] → [verse] → [chorus] → [outro]. Instrument Lifecycle: A breakbeat and bass loop form the permanent spine. One or two chopped jazz/funk motifs recur as identity markers; arrangement growth comes from sample mutes, drum fills and added response layers rather than harmonic overproduction. Section Directives: [verse]: Keep the beat hard and repetitive so the vocal cadence creates most of the variation. [chorus]: Add gang vocals, stronger bass and the fullest sample stack while retaining the same breakbeat identity. [bridge]: Reduce to drums and bass or a single ominous sample, then rebuild through cuts and response shouts. [outro]: Strip samples away until the break or one final vocal cut ends the track abruptly. Groove & Foundation Progression: All transitions must remain native to the stated genre. Preserve recognisable motifs across repeated sections while changing density, register, voicing or articulation. Keep the target genre dominant throughout.
lyrics: |-
  [verse]
  From the throne upon the sofa,
  She surveys the land once more.
  Every hallway,
  Every doorway,
  Every rug from wall to wall.
  [verse]
  None may question,
  None oppose her,
  All rejoice beneath her reign.
  Princess Beauts,
  Great Gremlin Leader,
  Guardian of treats and praise.
  [chorus]
  Glory! Glory!
  Great Doja!
  Leader of the Pack Union!
  Strongest heart and clever mind,
  Guide us through these peaceful times!
  [chorus]
  Glory! Glory!
  Great Doja!
  Every tail now wags as one!
  Long may Princess Doja command,
  Brightest dog in all the land!
  [verse]
  When brave Chunk returns with treasure,
  Bearing forth the sacred ball,
  She accepts his humble offering,
  For the good and joy of all.
  Then with wisdom
  Beyond measure,
  She declares the royal fee:
  "One Dentastick...
  Many scratches...
  Then perhaps this ball goes free."
  Wise is Doja!
  Strong is Doja!
  Nothing happens by mistake!
  Every scheme already planned,
  Before the humans even wake!
  [bridge]
  Wise is Doja!
  Strong is Doja!
  Opossum Face forever reigns!
  Every victory was foretold,
  Inside her magnificent brain!
  [verse]
  Once there stood a mighty ladder,
  Built for humans, tall and steep.
  Others searched
  For little dog doors...
  But not Doja
  She climbed the ladder.
  The people watched in silent wonder.
  The birds forgot their songs.
  Even the Chunk looked up in awe.
  The Princess simply carried on.
  [bridge]
  Raise the banner!
  Sound the brass!
  Let the mighty chorus sing!
  [verse]
  She who conquered
  Walls at Lyme,
  She who made the Gremlin spring!
  River waters cannot tame her!
  Rain awakens glorious might!
  Digging, charging,
  Leading chaos,
  Victory in every fight!
  Should the Chunk commit misfortune,
  She need never bark or shout.
  Just one gentle nudge upon your arm...
  Justice finds him.
  [chorus]
  Glory! Glory!
  Great Doja!
  Supreme Leader of the Pack!
  Every cushion,
  Every blanket,
  Every sunny patch is hers!
  Treats are hers!
  Scratches hers!
  Walks begin upon command!
  [outro]
  Long live Princess Doja forever!
  Long live Gremlin Leader!
  Long live Doja!
  (DOJA!)
  Long live Doja!
  (DOJA!)
  Long live Doja!
  (DOJA!)
